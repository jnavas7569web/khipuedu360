<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Configuración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .input-style { background-color: #f8fafc; border: 2px solid #f1f5f9; transition: all 0.3s ease; }
        .input-style:focus { border-color: #6366f1; background-color: #fff; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center min-h-screen">

    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <button onclick="window.location.href='dashboard.html'" class="mb-4 bg-white text-slate-400 hover:text-indigo-600 w-12 h-12 rounded-2xl shadow-sm border border-slate-100 transition-all">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1 class="text-3xl font-black text-slate-800 italic uppercase tracking-tighter">Configuración</h1>
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest mt-1">Seguridad de tu cuenta</p>
        </div>

        <section class="glass-card p-8">
            <div class="flex items-center gap-4 mb-8 pb-4 border-b border-slate-50">
                <div class="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600">
                    <i class="fa-solid fa-key text-xl"></i>
                </div>
                <div>
                    <h2 class="font-black text-slate-800 uppercase text-sm">Cambiar Contraseña</h2>
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Actualiza tu clave de acceso</p>
                </div>
            </div>

            <form id="form-password" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Nueva Contraseña</label>
                    <input type="password" id="new_pass" required minlength="6"
                        class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 outline-none" placeholder="••••••••">
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Confirmar Contraseña</label>
                    <input type="password" id="confirm_pass" required minlength="6"
                        class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 outline-none" placeholder="••••••••">
                </div>

                <button type="submit" id="btn-update" class="w-full bg-slate-800 hover:bg-black text-white font-black py-4 rounded-2xl shadow-lg transition-all active:scale-95 uppercase text-[10px] tracking-[0.2em]">
                    Actualizar Contraseña <i class="fa-solid fa-shield-halved ml-2"></i>
                </button>
            </form>
        </section>
    </div>

<script type="module">
    ////// AITO DESLOGIGIGNGN
import { activarVigilante } from "./security-control.js";
    ///////////////////AUTO DESLOOGGGGG
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
//////
activarVigilante(auth);
/////
    // Verificar que el usuario esté logueado
    onAuthStateChanged(auth, (user) => {
        if (!user) window.location.href = "index.html";
    });

    document.getElementById('form-password').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-update');
        const newPass = document.getElementById('new_pass').value;
        const confirmPass = document.getElementById('confirm_pass').value;

        // 1. Validar que sean iguales
        if (newPass !== confirmPass) {
            Swal.fire('Error', 'Las contraseñas no coinciden.', 'error');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> PROCESANDO...`;

        try {
            const user = auth.currentUser;
            await updatePassword(user, newPass);

            Swal.fire({
                title: '¡Clave Actualizada!',
                text: 'Tu contraseña ha sido cambiada con éxito. Úsala en tu próximo inicio de sesión.',
                icon: 'success',
                confirmButtonColor: '#6366f1'
            }).then(() => {
                window.location.href = 'dashboard.html';
            });

        } catch (error) {
            btn.disabled = false;
            btn.innerHTML = `Actualizar Contraseña <i class="fa-solid fa-shield-halved ml-2"></i>`;
            
            if (error.code === 'auth/requires-recent-login') {
                Swal.fire({
                    title: 'Seguridad',
                    text: 'Por seguridad, debes cerrar sesión e ingresar nuevamente para cambiar tu clave.',
                    icon: 'warning'
                });
            } else {
                Swal.fire('Error', 'No se pudo cambiar la clave: ' + error.message, 'error');
            }
        }
    });
</script>
</body>
</html>
