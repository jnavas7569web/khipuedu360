<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Gestión de Estudiantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; opacity: 0; transition: opacity 0.5s ease; }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .input-style { background-color: #f1f5f9; border: 2px solid transparent; transition: all 0.3s ease; font-weight: 700; width: 100%; }
        .input-style:focus { border-color: #6366f1; background-color: #fff; outline: none; }
        .label-style { font-size: 10px; font-weight: 900; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; display: block; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-indigo-950 tracking-tighter italic uppercase">Estudiantes</h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Registro y Actualización</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 rounded-2xl transition-all flex items-center justify-center">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </header>

        <div class="glass-card p-6 md:p-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label class="label-style">Número de Cédula (Buscar para actualizar)</label>
                    <div class="flex flex-col md:flex-row gap-2">
                        <input type="text" id="est-cedula" class="p-4 rounded-2xl input-style" placeholder="0000000000">
                        <button onclick="buscarEstudiante()" class="bg-indigo-100 text-indigo-600 px-6 py-4 rounded-2xl font-black uppercase text-[10px] hover:bg-indigo-600 hover:text-white transition-all">
                            <i class="fa-solid fa-magnifying-glass mr-2"></i> Buscar
                        </button>
                    </div>
                </div>

                <div>
                    <label class="label-style">Apellidos</label>
                    <input type="text" id="est-apellidos" class="p-4 rounded-2xl input-style uppercase">
                </div>
                <div>
                    <label class="label-style">Nombres</label>
                    <input type="text" id="est-nombres" class="p-4 rounded-2xl input-style uppercase">
                </div>

                <div>
                    <label class="label-style">Grado / Año</label>
                    <select id="est-grado" class="p-4 rounded-2xl input-style">
                        <option value="">Cargando grados...</option>
                    </select>
                </div>
                <div>
                    <label class="label-style">Paralelo</label>
                    <select id="est-paralelo" class="p-4 rounded-2xl input-style">
                        <option value="">Cargando paralelos...</option>
                    </select>
                </div>

                <div>
                    <label class="label-style">Jornada</label>
                    <select id="est-jornada" class="p-4 rounded-2xl input-style">
                        <option value="">Cargando jornadas...</option>
                    </select>
                </div>
                <div>
                    <label class="label-style">Fecha de Nacimiento</label>
                    <input type="date" id="est-fecha" class="p-4 rounded-2xl input-style">
                </div>
            </div>

            <div class="mt-10 flex flex-col items-center gap-4">
                <button onclick="guardarEstudiante()" id="btn-guardar" class="w-full md:w-auto bg-indigo-600 text-white px-12 py-4 rounded-2xl font-black uppercase text-xs hover:bg-black transition-all shadow-lg">
                    <i class="fa-solid fa-floppy-disk mr-2"></i> Guardar Estudiante
                </button>
                <div id="link-matricula" class="hidden animate-bounce mt-4">
                    <a href="matriculas.html" class="text-indigo-600 font-black uppercase text-[10px] tracking-widest border-b-2 border-indigo-600 pb-1">
                        Ir a Matricular Estudiante <i class="fa-solid fa-arrow-right ml-1"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let editandoID = null;

    onAuthStateChanged(auth, (user) => {
        if (user) { 
            document.body.style.opacity = "1"; 
            cargarSelects(); 
        } else { 
            window.location.href = "index.html"; 
        }
    });

    async function cargarSelects() {
        try {
            // 1. Cargar Grados Ordenados por el campo 'orden' (Imagen 2)
            const qGrados = query(collection(db, "grados"), orderBy("orden", "asc"));
            const snapGrados = await getDocs(qGrados);
            const selGrado = document.getElementById('est-grado');
            selGrado.innerHTML = '<option value="">Seleccione Grado</option>';
            snapGrados.forEach(d => {
                selGrado.innerHTML += `<option value="${d.id}">${d.data().nombre}</option>`;
            });

            // 2. Cargar Paralelos Ordenados por nombre (Imagen 4)
            const qParalelos = query(collection(db, "paralelos"), orderBy("nombre", "asc"));
            const snapParalelos = await getDocs(qParalelos);
            const selPar = document.getElementById('est-paralelo');
            selPar.innerHTML = '<option value="">Seleccione Paralelo</option>';
            snapParalelos.forEach(d => {
                selPar.innerHTML += `<option value="${d.id}">${d.data().nombre}</option>`;
            });

            // 3. Cargar Jornadas (Imagen 5)
            const snapJornadas = await getDocs(collection(db, "jornadas"));
            const selJor = document.getElementById('est-jornada');
            selJor.innerHTML = '<option value="">Seleccione Jornada</option>';
            snapJornadas.forEach(d => {
                selJor.innerHTML += `<option value="${d.id}">${d.data().nombre}</option>`;
            });

        } catch (error) {
            console.error("Error cargando selects:", error);
        }
    }

    window.buscarEstudiante = async () => {
        const cedula = document.getElementById('est-cedula').value.trim();
        if(!cedula) return Swal.fire('Atención', 'Ingresa una cédula para buscar', 'info');

        const q = query(collection(db, "estudiantes"), where("cedula", "==", cedula));
        const snap = await getDocs(q);

        if(!snap.empty) {
            const docEst = snap.docs[0];
            const data = docEst.data();
            editandoID = docEst.id;
            
            document.getElementById('est-apellidos').value = data.apellidos;
            document.getElementById('est-nombres').value = data.nombres;
            document.getElementById('est-grado').value = data.id_grado || "";
            document.getElementById('est-paralelo').value = data.id_paralelo || "";
            document.getElementById('est-jornada').value = data.id_jornada || "";
            document.getElementById('est-fecha').value = data.fecha_nacimiento || "";
            
            Swal.fire('Estudiante Encontrado', 'Puedes actualizar sus datos.', 'success');
        } else {
            editandoID = null;
            Swal.fire('Nuevo Registro', 'La cédula no existe, puedes registrar un nuevo estudiante.', 'info');
        }
    };

    window.guardarEstudiante = async () => {
        const cedula = document.getElementById('est-cedula').value.trim();
        const apellidos = document.getElementById('est-apellidos').value.trim().toUpperCase();
        const nombres = document.getElementById('est-nombres').value.trim().toUpperCase();
        const id_grado = document.getElementById('est-grado').value;
        const id_paralelo = document.getElementById('est-paralelo').value;
        const id_jornada = document.getElementById('est-jornada').value;
        const fecha = document.getElementById('est-fecha').value;

        if(!cedula || !apellidos || !nombres || !id_grado || !id_paralelo || !id_jornada) {
            return Swal.fire('Error', 'Todos los campos son obligatorios', 'error');
        }

        const datos = {
            cedula, apellidos, nombres, id_grado, id_paralelo, id_jornada, 
            fecha_nacimiento: fecha,
            estado: true,
            updatedAt: new Date()
        };

        try {
            // Si editandoID existe, usamos ese ID, si no, creamos un ID nuevo (o usamos la cédula como ID)
            const finalID = editandoID ? editandoID : cedula; 
            await setDoc(doc(db, "estudiantes", finalID), datos, { merge: true });

            Swal.fire({
                title: '¡Guardado!',
                text: 'Los datos del estudiante se procesaron correctamente.',
                icon: 'success',
                confirmButtonColor: '#4f46e5'
            });

            document.getElementById('link-matricula').classList.remove('hidden');
            
        } catch (error) {
            Swal.fire('Error', 'No se pudo guardar: ' + error.message, 'error');
        }
    };
</script>
</body>
</html>
