<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Registro Estudiantil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        /* Mejora de contraste: Fondo gris bajo */
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; opacity: 0; transition: opacity 0.5s ease; }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        /* Cuadros de texto en blanco puro */
        .input-style { background-color: #ffffff; border: 2px solid #e2e8f0; transition: all 0.3s ease; }
        .input-style:focus { border-color: #1d9bf0; outline: none; box-shadow: 0 0 0 4px rgba(29, 155, 240, 0.1); }
        /* Títulos en azul X (Twitter) */
        .label-style { font-size: 10px; font-weight: 900; color: #1d9bf0; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; display: block; margin-left: 0.25rem; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
            <div>
                <h1 class="text-3xl font-black text-indigo-950 tracking-tighter italic uppercase">Gestión Estudiantil</h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Khipu Edu 360 • Ficha Pro</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 rounded-2xl transition-all flex items-center justify-center">
                <i class="fa-solid fa-house"></i>
            </button>
        </header>

        <section class="glass-card p-10">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-2xl font-black text-slate-800 uppercase italic underline decoration-sky-500 decoration-4 underline-offset-8">Ficha de Registro</h2>
                <div id="status-main" class="text-[9px] font-black uppercase px-4 py-2 rounded-xl bg-slate-100 text-slate-400 tracking-widest border border-slate-200">Escáner Inactivo</div>
            </div>

            <form id="form-estudiante" class="space-y-8">
                <div class="bg-slate-50/80 p-8 rounded-[2.5rem] border border-slate-200">
                    <h4 class="text-slate-500 font-black text-[10px] uppercase mb-8 tracking-[0.2em] flex items-center gap-2">
                        <i class="fa-solid fa-user-tag text-sky-500"></i> 1. Datos Personales y Académicos
                    </h4>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div class="relative">
                            <label class="label-style">Cédula Alumno</label>
                            <input type="text" id="in_cedula" maxlength="10" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700" placeholder="13XXXXXXXX">
                            <div id="load-cedula" class="hidden absolute right-4 top-[3.2rem] text-sky-500"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
                        </div>
                        <div>
                            <label class="label-style">Nombres</label>
                            <input type="text" id="in_nombres" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 uppercase">
                        </div>
                        <div>
                            <label class="label-style">Apellidos</label>
                            <input type="text" id="in_apellidos" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 uppercase">
                        </div>

                        <div>
                            <label class="label-style">Grado / Año</label>
                            <select id="in_grado" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 appearance-none">
                                <option value="">Cargando...</option>
                            </select>
                        </div>
                        <div>
                            <label class="label-style">Paralelo</label>
                            <select id="in_paralelo" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 appearance-none">
                                <option value="">-</option>
                            </select>
                        </div>
                        <div>
                            <label class="label-style text-pink-600">Condición NEE</label>
                            <select id="in_nee" required class="w-full p-4 border-2 border-pink-100 bg-white rounded-2xl font-black text-pink-600 outline-none focus:border-pink-500 appearance-none">
                                <option value="false">NO (ORDINARIO)</option>
                                <option value="true">SÍ (NECESIDAD ESPECIAL)</option>
                            </select>
                        </div>

                        <div>
                            <label class="label-style">Nacimiento</label>
                            <input type="date" id="in_nacimiento" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700">
                        </div>
                        <div>
                            <label class="label-style">Género</label>
                            <select id="in_genero" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 appearance-none">
                                <option value="M">MASCULINO</option>
                                <option value="F">FEMENINO</option>
                            </select>
                        </div>
                        <div>
                            <label class="label-style">Sangre</label>
                            <select id="in_sangre" class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 appearance-none">
                                <option value="A+">A+</option><option value="O+">O+</option><option value="B+">B+</option><option value="AB+">AB+</option>
                                <option value="A-">A-</option><option value="O-">O-</option><option value="B-">B-</option><option value="AB-">AB-</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="bg-sky-50/50 p-8 rounded-[2.5rem] border border-sky-100">
                    <div class="flex justify-between items-center mb-8 border-b border-sky-100 pb-4">
                        <h4 class="text-sky-600 font-black text-[10px] uppercase tracking-[0.2em]">2. Información del Representante</h4>
                        <button type="button" id="btn-crear-repre" class="hidden text-[9px] font-black uppercase bg-slate-800 text-white px-4 py-2 rounded-xl hover:bg-black transition-all">
                            <i class="fa-solid fa-plus mr-1 text-sky-400"></i> Registrar Nuevo
                        </button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="relative">
                            <label class="label-style">Cédula Representante</label>
                            <input type="text" id="in_repre_id" maxlength="10" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700" placeholder="Buscar cédula...">
                            <div id="load-repre" class="hidden absolute right-4 top-[3.2rem] text-sky-500"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
                        </div>
                        <div>
                            <label class="label-style">Nombre Confirmado</label>
                            <input type="text" id="in_repre_nombre" readonly class="w-full p-4 bg-white border-2 border-slate-100 rounded-2xl font-black text-slate-400 uppercase italic placeholder:text-slate-300" placeholder="Esperando escáner...">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-4 pt-6">
                    <button type="button" onclick="location.reload()" class="px-8 py-4 font-black uppercase text-[10px] text-slate-400 hover:text-red-500 transition-all tracking-widest">Limpiar Todo</button>
                    <button type="submit" id="btn-save" class="bg-sky-500 hover:bg-black text-white px-14 py-5 rounded-[1.5rem] font-black uppercase text-[10px] tracking-[0.2em] shadow-xl shadow-sky-200 transition-all active:scale-95">
                        Sincronizar Ficha <i class="fa-solid fa-cloud-arrow-up ml-2"></i>
                    </button>
                </div>
            </form>
        </section>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, getDocs, collection, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // --- ESCUDO DE SEGURIDAD (ADMIN Y DOCENTE) ---
    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "index.html"; }
        else {
            const userDoc = await getDoc(doc(db, "usuario", user.uid));
            if (userDoc.exists() && (userDoc.data().rol === 'admin' || userDoc.data().rol === 'docente')) {
                document.body.style.opacity = "1";
                loadCatalogos();
            } else {
                Swal.fire('Acceso Prohibido', 'No tienes permisos para gestionar estudiantes.', 'error')
                .then(() => window.location.href = "dashboard.html");
            }
        }
    });

    async function loadCatalogos() {
        const [snapGrados, snapParalelos] = await Promise.all([
            getDocs(collection(db, "grados")),
            getDocs(collection(db, "paralelos"))
        ]);
        const selG = document.getElementById('in_grado');
        const selP = document.getElementById('in_paralelo');
        selG.innerHTML = '<option value="">Elegir Grado...</option>';
        snapGrados.forEach(d => selG.innerHTML += `<option value="${d.id}">${d.data().nombre}</option>`);
        selP.innerHTML = '<option value="">-</option>';
        snapParalelos.forEach(d => selP.innerHTML += `<option value="${d.id}">${d.id}</option>`);
    }

    // ESCÁNER ESTUDIANTE
    document.getElementById('in_cedula').addEventListener('input', async (e) => {
        const ced = e.target.value;
        const status = document.getElementById('status-main');
        if (ced.length === 10) {
            document.getElementById('load-cedula').classList.remove('hidden');
            const dSnap = await getDoc(doc(db, "estudiantes", ced));
            if (dSnap.exists()) {
                const data = dSnap.data();
                status.innerText = "ESTUDIANTE REGISTRADO - MODO EDICIÓN";
                status.className = "text-[9px] font-black uppercase px-4 py-2 rounded-xl bg-amber-100 text-amber-600 tracking-widest border border-amber-200";
                
                document.getElementById('in_nombres').value = data.nombres;
                document.getElementById('in_apellidos').value = data.apellidos;
                document.getElementById('in_grado').value = data.grado;
                document.getElementById('in_paralelo').value = data.paralelo;
                document.getElementById('in_genero').value = data.genero;
                document.getElementById('in_sangre').value = data.tipo_sangre;
                document.getElementById('in_repre_id').value = data.representante_id;
                // Cargar NEE
                document.getElementById('in_nee').value = data.nee ? "true" : "false";
                
                if(data.fecha_nacimiento) {
                    const date = data.fecha_nacimiento.toDate().toISOString().split('T')[0];
                    document.getElementById('in_nacimiento').value = date;
                }
                validarRepresentante(data.representante_id);
            } else {
                status.innerText = "NUEVO ESTUDIANTE";
                status.className = "text-[9px] font-black uppercase px-4 py-2 rounded-xl bg-emerald-100 text-emerald-600 tracking-widest border border-emerald-200";
            }
            document.getElementById('load-cedula').classList.add('hidden');
        }
    });

    document.getElementById('in_repre_id').addEventListener('input', (e) => {
        if(e.target.value.length === 10) validarRepresentante(e.target.value);
    });

    async function validarRepresentante(cedula) {
        const load = document.getElementById('load-repre');
        const display = document.getElementById('in_repre_nombre');
        const btnAdd = document.getElementById('btn-crear-repre');
        load.classList.remove('hidden');
        const rSnap = await getDoc(doc(db, "representantes", cedula));
        if (rSnap.exists()) {
            display.value = rSnap.data().nombre_completo;
            display.classList.replace('text-red-500', 'text-sky-600');
            btnAdd.classList.add('hidden');
        } else {
            display.value = "REPRESENTANTE NO ENCONTRADO";
            display.classList.replace('text-sky-600', 'text-red-500');
            btnAdd.classList.remove('hidden');
        }
        load.classList.add('hidden');
    }

    document.getElementById('btn-crear-repre').onclick = () => window.location.href = 'representantes.html';

    // GUARDAR
    document.getElementById('form-estudiante').addEventListener('submit', async (e) => {
        e.preventDefault();
        const ced = document.getElementById('in_cedula').value;
        const btn = document.getElementById('btn-save');
        btn.disabled = true;

        const payload = {
            cedula: ced,
            nombres: document.getElementById('in_nombres').value.toUpperCase(),
            apellidos: document.getElementById('in_apellidos').value.toUpperCase(),
            grado: document.getElementById('in_grado').value,
            paralelo: document.getElementById('in_paralelo').value,
            nee: document.getElementById('in_nee').value === "true", // Conversión a booleano
            fecha_nacimiento: new Date(document.getElementById('in_nacimiento').value),
            genero: document.getElementById('in_genero').value,
            tipo_sangre: document.getElementById('in_sangre').value,
            representante_id: document.getElementById('in_repre_id').value,
            periodo_actual: "2026-2027",
            estado: true,
            updated_at: serverTimestamp()
        };

        try {
            await setDoc(doc(db, "estudiantes", ced), payload);
            Swal.fire({ title: '¡Sincronizado!', text: 'Ficha guardada con éxito.', icon: 'success' }).then(() => location.reload());
        } catch (err) {
            btn.disabled = false;
            Swal.fire('Error', 'Fallo en la base de datos.', 'error');
        }
    });
</script>
</body>
</html>
