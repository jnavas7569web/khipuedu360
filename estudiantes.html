<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Registro Estudiantil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; opacity: 0; transition: opacity 0.5s ease; }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .input-style { background-color: #f1f5f9; border: 2px solid transparent; transition: all 0.3s ease; font-weight: 700; width: 100%; }
        .input-style:focus { border-color: #6366f1; background-color: #fff; outline: none; }
        .label-style { font-size: 10px; font-weight: 900; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; display: block; }
        .section-title { border-left: 4px solid #6366f1; padding-left: 10px; font-size: 12px; font-weight: 900; color: #1e293b; text-transform: uppercase; margin-bottom: 20px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-indigo-950 tracking-tighter italic uppercase">Gestión Estudiantil</h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Khipu Edu 360 • Ficha Pro</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 rounded-2xl transition-all flex items-center justify-center shadow-sm">
                <i class="fa-solid fa-house"></i>
            </button>
        </header>

        <div class="glass-card p-6 md:p-10">
            <form id="form-estudiante">
                <div class="section-title">1. Datos Personales y Académicos</div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                    <div class="md:col-span-1">
                        <label class="label-style">Cédula del Alumno</label>
                        <div class="flex gap-2">
                            <input type="text" id="est-cedula" maxlength="10" required class="p-4 rounded-2xl input-style" placeholder="13XXXXXXXX">
                            <button type="button" onclick="buscarEstudiante()" class="bg-indigo-50 text-indigo-600 px-4 rounded-2xl hover:bg-indigo-600 hover:text-white transition-all">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="label-style">Apellidos</label>
                        <input type="text" id="est-apellidos" required class="p-4 rounded-2xl input-style uppercase">
                    </div>
                    <div>
                        <label class="label-style">Nombres</label>
                        <input type="text" id="est-nombres" required class="p-4 rounded-2xl input-style uppercase">
                    </div>

                    <div>
                        <label class="label-style">Grado / Año</label>
                        <select id="est-grado" required class="p-4 rounded-2xl input-style font-bold bg-white"></select>
                    </div>
                    <div>
                        <label class="label-style">Paralelo</label>
                        <select id="est-paralelo" required class="p-4 rounded-2xl input-style font-bold bg-white"></select>
                    </div>
                    <div>
                        <label class="label-style">Jornada</label>
                        <select id="est-jornada" required class="p-4 rounded-2xl input-style font-bold bg-white"></select>
                    </div>

                    <div>
                        <label class="label-style">Fecha de Nacimiento</label>
                        <input type="date" id="est-fecha" required class="p-4 rounded-2xl input-style">
                    </div>
                    <div>
                        <label class="label-style">Género</label>
                        <select id="est-genero" required class="p-4 rounded-2xl input-style font-bold bg-white">
                            <option value="M">MASCULINO</option>
                            <option value="F">FEMENINO</option>
                        </select>
                    </div>
                    <div>
                        <label class="label-style">Periodo Lectivo</label>
                        <input type="text" id="est-periodo" class="p-4 rounded-2xl input-style bg-slate-50 text-indigo-600" readonly>
                    </div>
                </div>

                <div class="section-title">2. Información Médica y NEE</div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                    <div>
                        <label class="label-style">Tipo de Sangre</label>
                        <select id="est-sangre" required class="p-4 rounded-2xl input-style font-bold bg-white">
                            <option value="A+">A+</option><option value="A-">A-</option>
                            <option value="B+">B+</option><option value="B-">B-</option>
                            <option value="AB+">AB+</option><option value="AB-">AB-</option>
                            <option value="O+">O+</option><option value="O-">O-</option>
                        </select>
                    </div>
                    <div>
                        <label class="label-style">Condición NEE (Necesidad Educativa)</label>
                        <select id="est-nee" required class="p-4 rounded-2xl input-style font-bold bg-white">
                            <option value="false">NO</option>
                            <option value="true">SÍ (REQUIERE APOYO)</option>
                        </select>
                    </div>
                </div>

                <div class="section-title">3. Información del Representante</div>
                <div class="bg-slate-50 p-6 rounded-[2rem] border border-dashed border-slate-300">
                    <div class="flex flex-col md:flex-row items-center gap-4">
                        <div class="w-full md:w-1/3">
                            <label class="label-style">Cédula Representante</label>
                            <input type="text" id="est-repre-id" maxlength="10" required class="p-4 rounded-2xl input-style" oninput="identificarRepresentante()">
                        </div>
                        <div class="flex-1 text-center md:text-left">
                            <p id="repre-nombre" class="font-black text-indigo-900 uppercase text-sm">Esperando cédula...</p>
                            <button type="button" id="btn-add-repre" onclick="window.location.href='representantes.html'" class="hidden mt-2 text-rose-500 font-black text-[10px] uppercase hover:underline">
                                <i class="fa-solid fa-user-plus mr-1"></i> No encontrado. ¿Registrar nuevo?
                            </button>
                        </div>
                    </div>
                </div>

                <div class="mt-10">
                    <button type="submit" class="w-full bg-indigo-600 text-white p-5 rounded-3xl font-black uppercase text-xs hover:bg-black transition-all shadow-xl active:scale-95">
                        <i class="fa-solid fa-floppy-disk mr-2"></i> Procesar Ficha de Registro
                    </button>
                </div>
            </form>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
        if (user) { document.body.style.opacity = "1"; inicializarForm(); }
        else { window.location.href = "index.html"; }
    });

    async function inicializarForm() {
        // 1. Cargar Selects Ordenados
        cargarSelect('grados', 'est-grado', 'orden');
        cargarSelect('paralelos', 'est-paralelo', 'nombre');
        cargarSelect('jornadas', 'est-jornada', 'nombre');

        // 2. Cargar Periodo Actual
        const qP = query(collection(db, "periodos_lectivos"), where("estado", "==", true));
        const snapP = await getDocs(qP);
        if(!snapP.empty) document.getElementById('est-periodo').value = snapP.docs[0].data().nombre;
    }

    async function cargarSelect(col, elementId, orderField) {
        const q = query(collection(db, col), orderBy(orderField, "asc"));
        const snap = await getDocs(q);
        const el = document.getElementById(elementId);
        el.innerHTML = '<option value="">Elegir...</option>';
        snap.forEach(d => {
            el.innerHTML += `<option value="${d.data().id || d.id}">${d.data().nombre}</option>`;
        });
    }

    window.buscarEstudiante = async () => {
        const ced = document.getElementById('est-cedula').value.trim();
        if(ced.length < 10) return;
        const docRef = doc(db, "estudiantes", ced);
        const snap = await getDoc(docRef);
        if(snap.exists()) {
            const d = snap.data();
            document.getElementById('est-apellidos').value = d.apellidos;
            document.getElementById('est-nombres').value = d.nombres;
            document.getElementById('est-grado').value = d.grado;
            document.getElementById('est-paralelo').value = d.paralelo;
            document.getElementById('est-jornada').value = d.jornada;
            document.getElementById('est-genero').value = d.genero;
            document.getElementById('est-sangre').value = d.tipo_sangre;
            document.getElementById('est-nee').value = d.nee.toString();
            document.getElementById('est-repre-id').value = d.representante_id;
            if(d.fecha_nacimiento) {
                const date = d.fecha_nacimiento.toDate ? d.fecha_nacimiento.toDate() : new Date(d.fecha_nacimiento);
                document.getElementById('est-fecha').value = date.toISOString().split('T')[0];
            }
            identificarRepresentante();
            Swal.fire('Ficha Cargada', 'Puedes actualizar los datos del alumno.', 'info');
        }
    };

    window.identificarRepresentante = async () => {
        const ced = document.getElementById('est-repre-id').value.trim();
        const lbl = document.getElementById('repre-nombre');
        const btn = document.getElementById('btn-add-repre');
        
        if(ced.length === 10) {
            const docR = await getDoc(doc(db, "representantes", ced));
            if(docR.exists()) {
                lbl.innerText = "Representante: " + docR.data().nombre_completo;
                lbl.classList.replace('text-rose-500', 'text-indigo-900');
                btn.classList.add('hidden');
            } else {
                lbl.innerText = "No registrado";
                lbl.classList.replace('text-indigo-900', 'text-rose-500');
                btn.classList.remove('hidden');
            }
        }
    };

    document.getElementById('form-estudiante').addEventListener('submit', async (e) => {
        e.preventDefault();
        const ced = document.getElementById('est-cedula').value.trim();
        const repreId = document.getElementById('est-repre-id').value.trim();

        const payload = {
            cedula: ced,
            apellidos: document.getElementById('est-apellidos').value.toUpperCase(),
            nombres: document.getElementById('est-nombres').value.toUpperCase(),
            grado: document.getElementById('est-grado').value,
            paralelo: document.getElementById('est-paralelo').value,
            jornada: document.getElementById('est-jornada').value,
            genero: document.getElementById('est-genero').value,
            tipo_sangre: document.getElementById('est-sangre').value,
            nee: document.getElementById('est-nee').value === "true",
            fecha_nacimiento: new Date(document.getElementById('est-fecha').value),
            representante_id: repreId,
            periodo_actual: document.getElementById('est-periodo').value,
            estado: true,
            updated_at: serverTimestamp()
        };

        try {
            await setDoc(doc(db, "estudiantes", ced), payload, { merge: true });
            
            Swal.fire({
                title: '<span class="text-indigo-900 font-black uppercase">¡Registro Exitoso!</span>',
                text: 'El alumno ha sido sincronizado en el sistema.',
                icon: 'success',
                showCancelButton: true,
                showDenyButton: true,
                confirmButtonText: '<i class="fa-solid fa-house"></i> Dashboard',
                denyButtonText: '<i class="fa-solid fa-plus"></i> Otro Estudiante',
                cancelButtonText: '<i class="fa-solid fa-user-plus"></i> Ir a Repres.',
                confirmButtonColor: '#4f46e5',
                denyButtonColor: '#10b981',
                cancelButtonColor: '#f59e0b',
                customClass: { popup: 'rounded-[2.5rem]' }
            }).then((result) => {
                if (result.isConfirmed) window.location.href = "dashboard.html";
                else if (result.isDenied) location.reload();
                else if (result.dismiss === Swal.DismissReason.cancel) window.location.href = "representantes.html";
            });
        } catch (error) {
            Swal.fire('Error', 'No se pudo guardar: ' + error.message, 'error');
        }
    });
</script>
</body>
</html>
