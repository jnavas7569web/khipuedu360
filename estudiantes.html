<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Registro Estudiantil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .input-style { background-color: #f8fafc; border: 2px solid #f1f5f9; transition: all 0.3s ease; }
        .input-style:focus { border-color: #6366f1; background-color: #fff; outline: none; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
            <div>
                <h1 class="text-3xl font-black text-indigo-950 tracking-tighter italic uppercase">Gestión Estudiantil</h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Khipu Edu 360 • Ficha de Inscripción</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 rounded-2xl transition-all flex items-center justify-center">
                <i class="fa-solid fa-house"></i>
            </button>
        </header>

        <section class="glass-card p-10">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-2xl font-black text-emerald-900 uppercase italic">Nueva Matrícula</h2>
                <div id="status-cedula" class="text-[9px] font-black uppercase px-4 py-2 rounded-xl bg-slate-100 text-slate-400 tracking-widest border border-slate-200">Esperando Cédula...</div>
            </div>

            <form id="form-estudiante" class="space-y-8">
                <div class="bg-slate-50/50 p-6 rounded-3xl border border-slate-100">
                    <h4 class="text-indigo-600 font-black text-[10px] uppercase mb-6 tracking-[0.2em] border-b border-indigo-50 pb-2">1. Información de Identidad</h4>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="relative">
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Cédula</label>
                            <input type="text" id="in_cedula" maxlength="10" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700" placeholder="13XXXXXXXX">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Nombres</label>
                            <input type="text" id="in_nombres" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 uppercase">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Apellidos</label>
                            <input type="text" id="in_apellidos" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 uppercase">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Fecha de Nacimiento</label>
                            <input type="date" id="in_nacimiento" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Género</label>
                            <select id="in_genero" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700">
                                <option value="M">MASCULINO</option>
                                <option value="F">FEMENINO</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Nacionalidad</label>
                            <input type="text" id="in_nacionalidad" value="ECUATORIANA" class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 uppercase">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Tipo de Sangre</label>
                            <select id="in_sangre" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700">
                                <option value="A+">A+</option><option value="O+">O+</option><option value="B+">B+</option><option value="AB+">AB+</option>
                                <option value="A-">A-</option><option value="O-">O-</option><option value="B-">B-</option><option value="AB-">AB-</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">NEE (Discapacidad)</label>
                            <select id="in_nee" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700">
                                <option value="no">NO</option>
                                <option value="si">SI</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="bg-indigo-50/30 p-6 rounded-3xl border border-indigo-50">
                    <h4 class="text-indigo-600 font-black text-[10px] uppercase mb-6 tracking-[0.2em] border-b border-indigo-100 pb-2">2. Asignación y Familia</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Cédula del Representante</label>
                            <input type="text" id="in_repre_id" maxlength="10" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700" placeholder="Buscar cédula...">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Grado / Año</label>
                            <select id="in_grado" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700">
                                <option value="">Cargando...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Paralelo</label>
                            <select id="in_paralelo" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700">
                                <option value="">Cargando...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Periodo Lectivo Actual</label>
                            <input type="text" id="in_periodo" value="2026-2027" readonly class="w-full p-4 bg-white/50 border-2 border-slate-100 rounded-2xl font-black text-slate-400 cursor-not-allowed text-center">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" onclick="location.reload()" class="px-8 py-4 font-black uppercase text-[10px] text-slate-400 hover:text-red-500 transition-all tracking-widest">Descartar</button>
                    <button type="submit" id="btn-save" class="bg-emerald-600 hover:bg-black text-white px-12 py-4 rounded-2xl font-black uppercase text-[10px] tracking-[0.2em] shadow-xl transition-all active:scale-95">
                        Guardar Estudiante <i class="fa-solid fa-check-double ml-2"></i>
                    </button>
                </div>
            </form>
        </section>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, getDocs, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- CARGAR GRADOS Y PARALELOS ---
    async function loadCatalogos() {
        const [snapGrados, snapParalelos] = await Promise.all([
            getDocs(collection(db, "grados")),
            getDocs(collection(db, "paralelos"))
        ]);

        const selG = document.getElementById('in_grado');
        selG.innerHTML = '<option value="">Seleccione Grado</option>';
        snapGrados.forEach(d => selG.innerHTML += `<option value="${d.id}">${d.data().nombre}</option>`);

        const selP = document.getElementById('in_paralelo');
        selP.innerHTML = '<option value="">Seleccione Paralelo</option>';
        snapParalelos.forEach(d => selP.innerHTML += `<option value="${d.id}">${d.id}</option>`);
    }

    // --- GUARDADO BASADO EN TABLA FOTO ---
    document.getElementById('form-estudiante').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-save');
        const ced = document.getElementById('in_cedula').value.trim();
        
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> PROCESANDO...`;

        const payload = {
            cedula: ced,
            nombres: document.getElementById('in_nombres').value.trim().toUpperCase(),
            apellidos: document.getElementById('in_apellidos').value.trim().toUpperCase(),
            fecha_nacimiento: new Date(document.getElementById('in_nacimiento').value),
            genero: document.getElementById('in_genero').value,
            nacionalidad: document.getElementById('in_nacionalidad').value.toUpperCase(),
            tipo_sangre: document.getElementById('in_sangre').value,
            nee: document.getElementById('in_nee').value,
            representante_id: document.getElementById('in_repre_id').value.trim(),
            grado: document.getElementById('in_grado').value, // El ID como grado_01
            paralelo: document.getElementById('in_paralelo').value, // El ID como A
            periodo_actual: "2026-2027",
            estado: true,
            foto_url: "",
            updated_at: serverTimestamp()
        };

        try {
            await setDoc(doc(db, "estudiantes", ced), payload);
            Swal.fire({ title: '¡Guardado!', text: 'Estudiante registrado en el sistema.', icon: 'success' })
                .then(() => location.reload());
        } catch (error) {
            btn.disabled = false;
            btn.innerText = "Guardar Estudiante";
            Swal.fire('Error', 'No se pudo sincronizar con la base de datos.', 'error');
        }
    });

    loadCatalogos();
</script>
</body>
</html>
