<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Registro de Calificaciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; opacity: 0; transition: opacity 0.5s ease; }
        .glass-card { background: white; border-radius: 2.5rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        
        /* INPUTS GIGANTES PARA AGILIDAD */
        .nota-input { 
            width: 100px; 
            padding: 12px; 
            border-radius: 14px; 
            border: 2px solid #f1f5f9; 
            text-align: center; 
            font-weight: 800; 
            font-size: 1.2rem; 
            transition: all 0.3s; 
            outline: none; 
        }
        .nota-input:focus { border-color: #6366f1; background: #eef2ff; }
        .nota-input:disabled { background: #f8fafc; color: #cbd5e1; border-color: transparent; cursor: not-allowed; }
        .promedio-cell { font-weight: 900; color: #1e1b4b; font-size: 1.3rem; }
        .supletorio-active { border-color: #f59e0b !important; background: #fffbeb !important; }
        tr:hover .nota-input { border-color: #cbd5e1; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
            <div>
                <h1 class="text-3xl font-black text-indigo-950 tracking-tighter italic uppercase">Calificaciones</h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Ingreso de Notas Trimestrales</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 rounded-2xl transition-all flex items-center justify-center">
                <i class="fa-solid fa-house"></i>
            </button>
        </header>

        <div class="glass-card p-8 mb-8 grid grid-cols-1 md:grid-cols-4 gap-6 items-end">
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Grado / Curso</label>
                <select id="sel-grado" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl font-black text-xs uppercase outline-none focus:border-indigo-500 appearance-none"></select>
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Sección (P | J)</label>
                <select id="sel-seccion" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl font-black text-xs uppercase outline-none appearance-none"></select>
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Materia</label>
                <select id="sel-materia" class="w-full p-4 bg-slate-50 border-2 border-transparent rounded-2xl font-black text-xs uppercase outline-none appearance-none"></select>
            </div>
            <button id="btn-cargar" class="bg-indigo-600 hover:bg-black text-white p-4 rounded-2xl font-black uppercase text-[11px] shadow-xl transition-all active:scale-95">
                Cargar Registro <i class="fa-solid fa-folder-open ml-2"></i>
            </button>
        </div>

        <div id="container-tabla" class="hidden">
            <div class="glass-card overflow-hidden border-b-8 border-indigo-600">
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="bg-slate-900 text-white text-[10px] uppercase tracking-widest">
                            <th class="p-6 text-left">Nómina del Estudiante</th>
                            <th class="p-6 text-center">Nota 1</th>
                            <th class="p-6 text-center">Nota 2</th>
                            <th class="p-6 text-center">Nota 3</th>
                            <th class="p-6 text-center bg-indigo-800">Promedio</th>
                            <th class="p-6 text-center">Supletorio</th>
                            <th class="p-6 text-center bg-emerald-700">Nota Final</th>
                        </tr>
                    </thead>
                    <tbody id="body-notas" class="divide-y divide-slate-100 text-slate-700"></tbody>
                </table>
            </div>

            <div class="mt-8 flex justify-end">
                <button id="btn-sincronizar" class="bg-emerald-500 hover:bg-black text-white px-12 py-5 rounded-3xl font-black uppercase text-xs tracking-widest shadow-2xl transition-all active:scale-95">
                    Sincronizar y Guardar <i class="fa-solid fa-cloud-arrow-up ml-2"></i>
                </button>
            </div>
        </div>
    </div>

<script type="module">
      ////// AITO DESLOGIGIGNGN
import { activarVigilante } from "./security-control.js";
    ///////////////////AUTO DESLOOGGGGG
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, collection, query, where, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
//////
activarVigilante(auth);
/////
    const cacheMaps = { grados: {}, materias: {}, jornadas: {}, paralelos: {} };
    let misAsignaciones = [];
    let periodoActivo = "";

    onAuthStateChanged(auth, async (user) => {
        if (user) { document.body.style.opacity = "1"; await inicializar(); }
        else { window.location.href = "index.html"; }
    });

    async function inicializar() {
        const [gS, mS, jS, pS, perS] = await Promise.all([
            getDocs(collection(db, "grados")),
            getDocs(collection(db, "materias")),
            getDocs(collection(db, "jornadas")),
            getDocs(collection(db, "paralelos")),
            getDocs(query(collection(db, "periodos_lectivos"), where("estado", "==", "activo")))
        ]);
        gS.forEach(d => cacheMaps.grados[d.id] = d.data().nombre.toUpperCase());
        mS.forEach(d => cacheMaps.materias[d.id] = d.data().nombre.toUpperCase());
        jS.forEach(d => cacheMaps.jornadas[d.id] = d.data().nombre.toUpperCase());
        pS.forEach(d => cacheMaps.paralelos[d.id] = d.data().nombre.toUpperCase());
        if(!perS.empty) periodoActivo = perS.docs[0].data().nombre;
        cargarFiltros(auth.currentUser.uid);
    }

    async function cargarFiltros(uid) {
        const uSnap = await getDoc(doc(db, "usuario", uid));
        const isAdmin = uSnap.data().rol === "admin";
        const qAsig = isAdmin ? query(collection(db, "asignaciones")) : query(collection(db, "asignaciones"), where("docente_id", "==", uid));
        const snap = await getDocs(qAsig);
        const selG = document.getElementById('sel-grado');
        selG.innerHTML = '<option value="">ELEGIR GRADO</option>';
        let vistos = new Set();
        snap.forEach(d => {
            const a = d.data(); misAsignaciones.push({id: d.id, ...a});
            if(!vistos.has(a.grado_id)) {
                vistos.add(a.grado_id);
                selG.innerHTML += `<option value="${a.grado_id}">${cacheMaps.grados[a.grado_id] || a.grado_id}</option>`;
            }
        });
    }

    document.getElementById('sel-grado').addEventListener('change', (e) => {
        const selS = document.getElementById('sel-seccion');
        selS.innerHTML = '<option value="">ELEGIR SECCIÓN</option>';
        misAsignaciones.filter(a => a.grado_id === e.target.value).forEach(a => {
            selS.innerHTML += `<option value='${JSON.stringify({p: a.paralelo_id, j: a.jornada})}'>${a.paralelo_id} - ${a.jornada}</option>`;
        });
    });

    document.getElementById('sel-seccion').addEventListener('change', (e) => {
        const selM = document.getElementById('sel-materia');
        const sec = JSON.parse(e.target.value);
        selM.innerHTML = '<option value="">ELEGIR MATERIA</option>';
        misAsignaciones.filter(a => a.grado_id === document.getElementById('sel-grado').value && a.paralelo_id === sec.p && a.jornada === sec.j)
        .forEach(a => a.materia_id.forEach(mId => {
            selM.innerHTML += `<option value="${mId}">${cacheMaps.materias[mId] || mId}</option>`;
        }));
    });

    document.getElementById('btn-cargar').addEventListener('click', async () => {
        const g = document.getElementById('sel-grado').value;
        const s = document.getElementById('sel-seccion').value;
        const m = document.getElementById('sel-materia').value;
        if(!g || !s || !m) return Swal.fire('Incompleto', 'Seleccione Grado, Sección y Materia', 'warning');
        const sec = JSON.parse(s);
        const tbody = document.getElementById('body-notas');
        tbody.innerHTML = '<tr><td colspan="7" class="p-16 text-center animate-pulse font-black text-indigo-900 uppercase">Cargando nómina...</td></tr>';
        
        const snapE = await getDocs(collection(db, "estudiantes"));
        let alumnos = [];
        snapE.forEach(d => {
            const e = d.data();
            const eP = cacheMaps.paralelos[e.paralelo] || e.paralelo;
            const eJ = cacheMaps.jornadas[e.jornada] || e.jornada;
            if(e.grado === g && eP === sec.p && eJ === sec.j && (e.estado === true || e.estado === "activo")) alumnos.push({id: d.id, ...e});
        });
        alumnos.sort((a,b) => a.apellidos.localeCompare(b.apellidos));

        const snapN = await getDocs(query(collection(db, "notass"), where("periodo_id", "==", periodoActivo), where("materia_id", "==", m)));
        let notasG = {}; snapN.forEach(d => notasG[d.data().estudiante_id] = d.data());

        tbody.innerHTML = "";
        alumnos.forEach(est => {
            const ng = notasG[est.id] || { nota1:0, nota2:0, nota3:0, nota_supletorio:0 };
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="p-6">
                    <div class="font-black text-slate-800 uppercase text-lg leading-tight tracking-tight">${est.apellidos} ${est.nombres}</div>
                </td>
                <td class="p-6 text-center"><input type="number" step="0.01" class="nota-input n1" data-id="${est.id}" value="${ng.nota1 || ''}"></td>
                <td class="p-6 text-center"><input type="number" step="0.01" class="nota-input n2" data-id="${est.id}" value="${ng.nota2 || ''}"></td>
                <td class="p-6 text-center"><input type="number" step="0.01" class="nota-input n3" data-id="${est.id}" value="${ng.nota3 || ''}"></td>
                <td class="p-6 text-center promedio-cell">0.00</td>
                <td class="p-6 text-center"><input type="number" step="0.01" class="nota-input sup" data-id="${est.id}" value="${ng.nota_supletorio || ''}" disabled></td>
                <td class="p-6 text-center final-cell font-black text-emerald-600 text-2xl">0.00</td>
            `;
            tbody.appendChild(tr);
            calcularFila(tr);
        });
        document.getElementById('container-tabla').classList.remove('hidden');
    });

    function calcularFila(tr) {
        const val = (cl) => parseFloat(tr.querySelector(cl).value) || 0;
        const [n1, n2, n3] = [val('.n1'), val('.n2'), val('.n3')];
        const [supI, promC, finC] = [tr.querySelector('.sup'), tr.querySelector('.promedio-cell'), tr.querySelector('.final-cell')];
        const promedio = (n1 + n2 + n3) / 3; promC.innerText = promedio.toFixed(2);
        if(promedio < 7 && promedio > 0) {
            supI.disabled = false; supI.classList.add('supletorio-active');
            finC.innerText = (parseFloat(supI.value) || 0) >= 7 ? "7.00" : promedio.toFixed(2);
            finC.className = "final-cell font-black text-amber-500 text-2xl";
        } else {
            supI.disabled = true; supI.classList.remove('supletorio-active');
            finC.innerText = promedio.toFixed(2); finC.className = "final-cell font-black text-emerald-600 text-2xl";
        }
    }

    document.addEventListener('input', (e) => {
        if(e.target.classList.contains('nota-input')) {
            if(e.target.value > 10) e.target.value = 10;
            if(e.target.value < 0) e.target.value = 0;
            calcularFila(e.target.closest('tr'));
        }
    });

    document.getElementById('btn-sincronizar').addEventListener('click', async () => {
        const btn = document.getElementById('btn-sincronizar');
        btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> SINCRONIZANDO...';
        const rows = document.querySelectorAll('#body-notas tr');
        const materiaId = document.getElementById('sel-materia').value;
        try {
            for(let row of rows) {
                const eid = row.querySelector('.n1').dataset.id;
                const promFinal = parseFloat(row.querySelector('.final-cell').innerText);
                await setDoc(doc(db, "notass", `${periodoActivo}_${eid}_${materiaId}`.replace(/\s+/g, '')), {
                    estudiante_id: eid, materia_id: materiaId, periodo_id: periodoActivo,
                    nota1: parseFloat(row.querySelector('.n1').value) || 0,
                    nota2: parseFloat(row.querySelector('.n2').value) || 0,
                    nota3: parseFloat(row.querySelector('.n3').value) || 0,
                    nota_supletorio: parseFloat(row.querySelector('.sup').value) || 0,
                    promedio_final: promFinal, updated_at: serverTimestamp()
                }, { merge: true });
            }
            Swal.fire({
                title: '¡Éxito!',
                text: 'Calificaciones sincronizadas correctamente.',
                icon: 'success',
                confirmButtonText: 'Aceptar',
                customClass: { popup: 'rounded-[2rem]' }
            }).then(() => location.reload()); // REFRESH FORZOSO AQUÍ
        } catch (e) { 
            console.error(e); Swal.fire('Error', 'Falla de conexión.', 'error'); 
            btn.disabled = false; btn.innerHTML = 'Sincronizar y Guardar <i class="fa-solid fa-cloud-arrow-up ml-2"></i>';
        }
    });
</script>
</body>
</html>
