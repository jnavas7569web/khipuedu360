<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu-Edu360 - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen font-sans">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 border-t-4 border-indigo-600">
        <h2 class="text-3xl font-extrabold mb-2 text-center text-gray-800 tracking-tighter italic uppercase">Khipu-Edu360</h2>
        <p class="text-sm text-gray-400 mb-8 text-center uppercase tracking-widest font-bold">Panel de Control</p>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-1 uppercase tracking-widest ml-1">Correo Institucional</label>
                <input type="email" id="email" placeholder="ejemplo@escuela.com" required
                    class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition font-medium italic">
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-1 uppercase tracking-widest ml-1">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required
                    class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            </div>
            
            <button type="submit" id="loginBtn" class="w-full bg-indigo-600 text-white font-black py-4 rounded-xl hover:bg-black transform hover:scale-[1.02] active:scale-95 transition shadow-lg mt-4 tracking-widest uppercase text-sm">
                Ingresar al Sistema
            </button>

            <p class="text-center mt-4">
                <a href="#" id="btn-olvido" class="text-indigo-500 hover:text-indigo-700 text-xs font-bold transition-all no-underline">
                    <i class="fa-solid fa-lock-open mr-1"></i> ¿Olvidaste tu contraseña?
                </a>
            </p>
        </form>
        
        <p id="message" class="mt-6 text-center text-red-500 text-xs font-bold h-4 italic"></p>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // NUEVAS CREDENCIALES KHIPU-EDU360
    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    auth.languageCode = 'es';

    const loginForm = document.getElementById('login-form');
    const msg = document.getElementById('message');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');

        btn.disabled = true;
        btn.innerText = "VERIFICANDO PERFIL...";
        msg.innerText = "";

        try {
            // 1. Auth en Firebase
            const userCredential = await signInWithEmailAndPassword(auth, email, pass);
            const uid = userCredential.user.uid;

            // 2. Consultar Rol y Estado en la colección 'usuarios'
            const userDoc = await getDoc(doc(db, "usuarios", uid));

            if (userDoc.exists()) {
                const data = userDoc.data();

                if (data.estado !== 'activo') {
                    throw { code: 'custom/user-disabled', message: 'Tu cuenta ha sido suspendida.' };
                }

                // 3. Éxito y redirección por rol
                Swal.fire({
                    title: `¡Hola, ${data.nombre}!`,
                    text: 'Acceso concedido correctamente.',
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false,
                    willClose: () => {
                        // Redirige según el rol de la tabla
                        if (data.rol === 'admin') {
                            window.location.href = "admin_dash.html";
                        } else {
                            window.location.href = "docente_dash.html";
                        }
                    }
                });

            } else {
                throw { code: 'custom/no-profile', message: 'No tienes un perfil asignado en la base de datos.' };
            }

        } catch (error) {
            btn.disabled = false;
            btn.innerText = "INGRESAR AL SISTEMA";
            
            let errorMsg = "Credenciales incorrectas.";
            if (error.code === 'auth/invalid-credential') errorMsg = "Correo o clave incorrectos.";
            if (error.code === 'custom/user-disabled') errorMsg = error.message;
            if (error.code === 'custom/no-profile') errorMsg = error.message;

            Swal.fire({
                title: 'Error de Acceso',
                text: errorMsg,
                icon: 'error',
                confirmButtonColor: '#4f46e5'
            });
        }
    });

    // --- LÓGICA DE RECUPERAR CONTRASEÑA ---
    document.getElementById('btn-olvido').addEventListener('click', async (e) => {
        e.preventDefault();
        const { value: email } = await Swal.fire({
            title: 'Recuperar Contraseña',
            input: 'email',
            inputPlaceholder: 'Ingresa tu correo institucional',
            confirmButtonColor: '#4f46e5',
            showCancelButton: true
        });

        if (email) {
            try {
                await sendPasswordResetEmail(auth, email);
                Swal.fire('Enlace Enviado', 'Revisa tu correo para restablecer tu clave.', 'success');
            } catch (error) {
                Swal.fire('Error', 'No se pudo enviar el correo.', 'error');
            }
        }
    });
</script>
</body>
</html>
