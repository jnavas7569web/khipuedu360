<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu-Edu360 - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen font-sans">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 border-t-4 border-indigo-600">
        <h2 class="text-3xl font-extrabold mb-2 text-center text-gray-800 tracking-tighter italic uppercase">Khipu-Edu360</h2>
        <p class="text-sm text-gray-400 mb-8 text-center uppercase tracking-widest font-bold">Acceso Oficial</p>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-1 uppercase tracking-widest ml-1">Correo Institucional</label>
                <input type="email" id="email" placeholder="tu-correo@gmail.com" required
                    class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition font-medium">
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-1 uppercase tracking-widest ml-1">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required
                    class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            </div>
            
            <button type="submit" id="loginBtn" class="w-full bg-indigo-600 text-white font-black py-4 rounded-xl hover:bg-black transform hover:scale-[1.02] active:scale-95 transition shadow-lg mt-4 tracking-widest uppercase text-sm">
                Ingresar al Sistema
            </button>
        </form>
        
        <p id="message" class="mt-6 text-center text-red-500 text-xs font-bold h-4 italic"></p>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginForm = document.getElementById('login-form');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');

        btn.disabled = true;
        btn.innerText = "VERIFICANDO...";

        try {
            // 1. Iniciar sesión en Auth
            const userCredential = await signInWithEmailAndPassword(auth, email, pass);
            const uid = userCredential.user.uid;

            // 2. Buscar en la colección 'usuario' (exactamente como en tu imagen)
            const userDoc = await getDoc(doc(db, "usuario", uid));

            if (userDoc.exists()) {
                const data = userDoc.data();

                // 3. Validar estado activo
                if (data.estado !== 'activo') {
                    throw { message: 'Tu cuenta está inactiva.' };
                }

                // 4. ÉXITO: Redirección a ee.html
                Swal.fire({
                    title: `¡Bienvenido ${data.nombre}!`,
                    text: 'Redirigiendo...',
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false,
                    willClose: () => {
                        window.location.href = "ee.html";
                    }
                });

            } else {
                // Si el UID no coincide con el ID del documento
                throw { message: 'No se encontró tu perfil en la base de datos.' };
            }

        } catch (error) {
            btn.disabled = false;
            btn.innerText = "INGRESAR AL SISTEMA";
            
            let errorMsg = error.message || "Error al ingresar.";
            if (error.code === 'auth/invalid-credential') errorMsg = "Correo o contraseña incorrectos.";

            Swal.fire({
                title: 'Error de Acceso',
                text: errorMsg,
                icon: 'error',
                confirmButtonColor: '#4f46e5'
            });
        }
    });
</script>
</body>
</html>
