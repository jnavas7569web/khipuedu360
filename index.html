<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Acceso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; }
        .glass-card {
            background: rgba(255, 255, 255, 1);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-style {
            background-color: #f8fafc;
            border: 2px solid #f1f5f9;
            transition: all 0.3s ease;
        }
        .input-style:focus {
            border-color: #6366f1;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen p-4 font-sans">

    <div class="glass-card w-full max-w-sm p-10">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black text-slate-800 tracking-tighter mb-1">
                Khipu <span class="text-indigo-600">Edu 360</span>
            </h1>
            <p class="text-slate-400 text-xs font-bold uppercase tracking-[0.2em]">Panel de acceso</p>
        </div>
        
        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest ml-1">Correo</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                    <input type="email" id="email" placeholder="nombre@ejemplo.com" required
                        class="w-full pl-11 pr-4 py-3.5 input-style rounded-2xl outline-none font-semibold text-slate-700 italic">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest ml-1">Contraseña</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                    <input type="password" id="password" placeholder="••••••••" required
                        class="w-full pl-11 pr-4 py-3.5 input-style rounded-2xl outline-none font-semibold text-slate-700">
                </div>
            </div>
            
            <button type="submit" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-xl shadow-lg shadow-indigo-200 transform transition-all active:scale-95 uppercase text-sm tracking-widest">
                Ingresar al Sistema
            </button>
        </form>
        
        <div class="text-center mt-8">
            <button id="btn-olvido" class="text-indigo-500 hover:text-indigo-700 text-[11px] font-bold transition-all flex items-center justify-center mx-auto gap-2">
                <i class="fa-solid fa-lock-open"></i> ¿Olvidaste tu contraseña?
            </button>
        </div>

        <p id="message" class="mt-6 text-center text-red-500 text-xs font-bold h-4 italic"></p>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    auth.languageCode = 'es';

    const loginForm = document.getElementById('login-form');
    const msg = document.getElementById('message');

    // --- LÓGICA DE INICIO DE SESIÓN ---
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');

        btn.disabled = true;
        btn.innerText = "VALIDANDO ACCESO...";
        msg.innerText = "";

        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, pass);
            
            // Validar en la colección 'usuario' (en singular como tu imagen)
            const userDoc = await getDoc(doc(db, "usuario", userCredential.user.uid));

            if (userDoc.exists() && userDoc.data().estado === 'activo') {
                Swal.fire({
                    title: '¡Acceso Correcto!',
                    text: 'Bienvenido a Khipu Edu 360',
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false,
                    willClose: () => { window.location.href = "dashboard.html"; }
                });
            } else {
                throw { code: 'custom/inactive', message: "Cuenta inactiva o sin perfil." };
            }
        } catch (error) {
            btn.disabled = false;
            btn.innerText = "INGRESAR AL SISTEMA";
            let errorMsg = "Credenciales incorrectas.";
            if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') errorMsg = "El usuario no existe o los datos son incorrectos.";
            if (error.code === 'custom/inactive') errorMsg = error.message;

            Swal.fire({
                title: 'Error de Acceso',
                text: errorMsg,
                icon: 'error',
                confirmButtonColor: '#6366f1'
            });
        }
    });

    // --- LÓGICA DE RECUPERAR CONTRASEÑA (Copiada de tu código funcional) ---
    document.getElementById('btn-olvido').addEventListener('click', async (e) => {
        e.preventDefault();

        const { value: email } = await Swal.fire({
            title: 'Recuperar Contraseña',
            html: '<p class="text-sm text-gray-600">Enviaremos un enlace a tu correo para que puedas cambiar tu clave de forma segura.</p>',
            input: 'email',
            inputPlaceholder: 'tu-correo@ejemplo.com',
            confirmButtonColor: '#6366f1',
            confirmButtonText: 'Enviar Enlace',
            showCancelButton: true,
            cancelButtonText: 'Cancelar',
            cancelButtonColor: '#d33',
            inputAttributes: { autocapitalize: 'off', autocorrect: 'off' }
        });

        if (email) {
            try {
                await sendPasswordResetEmail(auth, email);
                
                Swal.fire({
                    title: '¡Enlace Enviado!',
                    html: `<div class="text-left p-2">
                            <p><b>Khipu Edu 360 Informa:</b></p>
                            <p class="mt-2">Se ha enviado un correo a: <b>${email}</b></p>
                            <p class="mt-2 text-xs text-gray-500 italic">Si no lo ves, revisa la carpeta de Correo No Deseado o Spam.</p>
                           </div>`,
                    icon: 'success',
                    confirmButtonColor: '#6366f1'
                });
            } catch (error) {
                console.error(error);
                let msgError = "No se pudo enviar el correo.";
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-email') {
                    msgError = "Este correo no está registrado o es inválido.";
                }
                
                Swal.fire('Error', msgError, 'error');
            }
        }
    });
</script>
</body>
</html>
