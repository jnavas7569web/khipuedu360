<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Configuración Maestra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; opacity: 0; transition: opacity 0.5s ease; }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .input-style { background-color: #f1f5f9; border: 2px solid transparent; transition: all 0.3s ease; font-weight: 700; }
        .input-style:focus { border-color: #6366f1; background-color: #fff; outline: none; }
        .tab-active { color: #6366f1; border-bottom: 3px solid #6366f1; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
            <div>
                <h1 class="text-3xl font-black text-indigo-950 tracking-tighter italic uppercase">Configuración</h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Gestión Maestra del Sistema</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 rounded-2xl transition-all flex items-center justify-center shadow-sm">
                <i class="fa-solid fa-house"></i>
            </button>
        </header>

        <div class="flex gap-4 md:gap-8 mb-8 border-b border-slate-200 px-6 overflow-x-auto whitespace-nowrap">
            <button onclick="switchTab('inst')" id="btn-inst" class="pb-4 font-black uppercase text-[10px] tracking-widest tab-active">Institución</button>
            <button onclick="switchTab('grados')" id="btn-grados" class="pb-4 font-black uppercase text-[10px] tracking-widest text-slate-400">Grados</button>
            <button onclick="switchTab('par')" id="btn-par" class="pb-4 font-black uppercase text-[10px] tracking-widest text-slate-400">Paralelos</button>
            <button onclick="switchTab('jor')" id="btn-jor" class="pb-4 font-black uppercase text-[10px] tracking-widest text-slate-400">Jornadas</button>
            <button onclick="switchTab('mat')" id="btn-mat" class="pb-4 font-black uppercase text-[10px] tracking-widest text-slate-400">Materias</button>
        </div>

        <div id="tab-inst" class="tab-content">
            <div class="glass-card p-8 md:p-10">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="md:col-span-2"><label class="text-[10px] font-black text-slate-400 uppercase ml-2 mb-2 block">Nombre Institución</label><input type="text" id="inst-nombre" class="w-full p-4 rounded-2xl input-style text-lg uppercase"></div>
                    <div><label class="text-[10px] font-black text-slate-400 uppercase ml-2 mb-2 block">Código AMIE</label><input type="text" id="inst-amie" class="w-full p-4 rounded-2xl input-style"></div>
                    <div><label class="text-[10px] font-black text-slate-400 uppercase ml-2 mb-2 block">Periodo Lectivo</label><input type="text" id="inst-periodo" class="w-full p-4 rounded-2xl input-style"></div>
                    <div><label class="text-[10px] font-black text-slate-400 uppercase ml-2 mb-2 block">Director/a</label><input type="text" id="inst-director" class="w-full p-4 rounded-2xl input-style uppercase"></div>
                </div>
                <button onclick="actualizarInstitucion()" class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-black uppercase text-xs hover:bg-black transition-all shadow-lg shadow-indigo-100">Guardar Cambios</button>
            </div>
        </div>

        <div id="tab-grados" class="tab-content hidden">
            <div class="glass-card p-8">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 items-end">
                    <div><label class="text-[9px] font-black text-slate-400 mb-2 block uppercase">Nombre Grado</label><input type="text" id="grado-nom" class="w-full p-4 rounded-2xl input-style uppercase text-xs" placeholder="Segundo Grado"></div>
                    <div><label class="text-[9px] font-black text-slate-400 mb-2 block uppercase">Subnivel</label><input type="text" id="grado-sub" class="w-full p-4 rounded-2xl input-style uppercase text-xs" placeholder="Básica Elemental"></div>
                    <div><label class="text-[9px] font-black text-slate-400 mb-2 block uppercase">Orden (N°)</label><input type="number" id="grado-ord" class="w-full p-4 rounded-2xl input-style text-xs" placeholder="3"></div>
                    <button onclick="agregarGrado()" class="bg-indigo-600 text-white p-4 rounded-2xl font-black uppercase text-[10px]">Añadir</button>
                </div>
                <table class="w-full"><tbody id="lista-grados" class="divide-y divide-slate-50"></tbody></table>
            </div>
        </div>

        <div id="tab-par" class="tab-content hidden">
            <div class="glass-card p-8">
                <div class="flex gap-4 mb-8">
                    <input type="text" id="par-nom" class="flex-1 p-4 rounded-2xl input-style uppercase" placeholder="Nombre (Ej: A)">
                    <button onclick="agregarParalelo()" class="bg-indigo-600 text-white px-8 rounded-2xl font-black uppercase text-[10px]">Añadir</button>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-4" id="lista-paralelos"></div>
            </div>
        </div>

        <div id="tab-jor" class="tab-content hidden">
            <div class="glass-card p-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 items-end">
                    <input type="text" id="jor-nom" class="p-4 rounded-2xl input-style uppercase text-xs" placeholder="Matutina">
                    <input type="text" id="jor-hor" class="p-4 rounded-2xl input-style text-xs" placeholder="07:15 - 12:12">
                    <button onclick="agregarJornada()" class="bg-indigo-600 text-white p-4 rounded-2xl font-black uppercase text-[10px]">Añadir</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="lista-jornadas"></div>
            </div>
        </div>

        <div id="tab-mat" class="tab-content hidden">
            <div class="glass-card p-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 items-end">
                    <input type="text" id="mat-nom" class="p-4 rounded-2xl input-style uppercase text-xs" placeholder="Matemática">
                    <input type="text" id="mat-are" class="p-4 rounded-2xl input-style uppercase text-xs" placeholder="Ciencias Exactas">
                    <button onclick="agregarMateria()" class="bg-indigo-600 text-white p-4 rounded-2xl font-black uppercase text-[10px]">Añadir</button>
                </div>
                <table class="w-full"><tbody id="lista-materias" class="divide-y divide-slate-50"></tbody></table>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.body.style.opacity = "1";
            cargarDatosInstitucion(); cargarGrados(); cargarParalelos(); cargarJornadas(); cargarMaterias();
        } else { window.location.href = "index.html"; }
    });

    window.switchTab = (tab) => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.querySelectorAll('button[id^="btn-"]').forEach(b => b.classList.remove('tab-active', 'text-indigo-600'));
        document.querySelectorAll('button[id^="btn-"]').forEach(b => b.classList.add('text-slate-400'));
        document.getElementById('tab-' + tab).classList.remove('hidden');
        document.getElementById('btn-' + tab).classList.add('tab-active', 'text-indigo-600');
    };

    // --- INSTITUCIÓN ---
    async function cargarDatosInstitucion() {
        const d = await getDoc(doc(db, "institucion", "datos_generales"));
        if (d.exists()) {
            const data = d.data();
            document.getElementById('inst-nombre').value = data.nombre || "";
            document.getElementById('inst-amie').value = data.amie || "";
            document.getElementById('inst-periodo').value = data.periodo_lectivo || "";
            document.getElementById('inst-director').value = data.director || "";
        }
    }
    window.actualizarInstitucion = async () => {
        await setDoc(doc(db, "institucion", "datos_generales"), {
            nombre: document.getElementById('inst-nombre').value.toUpperCase(), amie: document.getElementById('inst-amie').value,
            periodo_lectivo: document.getElementById('inst-periodo').value, director: document.getElementById('inst-director').value.toUpperCase()
        }, { merge: true });
        Swal.fire('¡Listo!', 'Institución actualizada', 'success');
    };

    // --- GRADOS ---
    async function cargarGrados() {
        const snap = await getDocs(collection(db, "grados"));
        const tbody = document.getElementById('lista-grados'); tbody.innerHTML = "";
        snap.forEach(d => {
            const g = d.data();
            tbody.innerHTML += `<tr><td class="py-4 font-bold text-xs text-slate-700 uppercase">${g.nombre}</td><td><span class="text-[9px] font-black text-indigo-400 uppercase">${g.subnivel} (Orden: ${g.orden})</span></td><td class="text-right"><button onclick="eliminarDoc('grados','${d.id}', cargarGrados)" class="text-slate-300 hover:text-red-500 px-4"><i class="fa-solid fa-trash-can"></i></button></td></tr>`;
        });
    }
    window.agregarGrado = async () => {
        const n = document.getElementById('grado-nom').value.trim();
        const s = document.getElementById('grado-sub').value.trim();
        const o = document.getElementById('grado-ord').value.trim();
        if(!n || !s || !o) return;
        await setDoc(doc(db, "grados", n.toLowerCase().replace(/ /g, "_")), { nombre: n, subnivel: s, orden: o, estado: true });
        cargarGrados();
    };

    // --- PARALELOS ---
    async function cargarParalelos() {
        const snap = await getDocs(collection(db, "paralelos"));
        const div = document.getElementById('lista-paralelos'); div.innerHTML = "";
        snap.forEach(d => {
            div.innerHTML += `<div class="bg-slate-50 p-4 rounded-2xl flex justify-between items-center border border-slate-100"><span class="font-black text-indigo-900">${d.data().nombre}</span><button onclick="eliminarDoc('paralelos','${d.id}', cargarParalelos)" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button></div>`;
        });
    }
    window.agregarParalelo = async () => {
        const n = document.getElementById('par-nom').value.trim().toUpperCase();
        if(!n) return;
        await setDoc(doc(db, "paralelos", n.toLowerCase()), { nombre: n, estado: true });
        cargarParalelos();
    };

    // --- JORNADAS ---
    async function cargarJornadas() {
        const snap = await getDocs(collection(db, "jornadas"));
        const div = document.getElementById('lista-jornadas'); div.innerHTML = "";
        snap.forEach(d => {
            div.innerHTML += `<div class="bg-slate-50 p-5 rounded-2xl flex justify-between items-center border border-slate-100"><div><p class="font-black text-indigo-950 text-xs uppercase">${d.data().nombre}</p><p class="text-[10px] text-slate-400 font-bold">${d.data().horario}</p></div><button onclick="eliminarDoc('jornadas','${d.id}', cargarJornadas)" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button></div>`;
        });
    }
    window.agregarJornada = async () => {
        const n = document.getElementById('jor-nom').value.trim();
        const h = document.getElementById('jor-hor').value.trim();
        if(!n || !h) return;
        await setDoc(doc(db, "jornadas", n.toLowerCase()), { nombre: n, horario: h, estado: true });
        cargarJornadas();
    };

    // --- MATERIAS ---
    async function cargarMaterias() {
        const snap = await getDocs(collection(db, "materias"));
        const tbody = document.getElementById('lista-materias'); tbody.innerHTML = "";
        snap.forEach(d => {
            tbody.innerHTML += `<tr><td class="py-4 font-bold text-xs text-slate-700 uppercase">${d.data().nombre}</td><td><span class="text-[9px] font-black text-indigo-400 uppercase">${d.data().area}</span></td><td class="text-right"><button onclick="eliminarDoc('materias','${d.id}', cargarMaterias)" class="text-slate-300 hover:text-red-500 px-4"><i class="fa-solid fa-trash-can"></i></button></td></tr>`;
        });
    }
    window.agregarMateria = async () => {
        const n = document.getElementById('mat-nom').value.trim();
        const a = document.getElementById('mat-are').value.trim();
        if(!n || !a) return;
        await setDoc(doc(db, "materias", n.toLowerCase().replace(/ /g, "_")), { nombre: n, area: a, estado: true });
        cargarMaterias();
    };

    window.eliminarDoc = async (coleccion, id, callback) => {
        const res = await Swal.fire({ title: '¿Eliminar?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Sí, borrar', confirmButtonColor: '#ef4444' });
        if(res.isConfirmed) { await deleteDoc(doc(db, coleccion, id)); callback(); }
    };
</script>
</body>
</html>
