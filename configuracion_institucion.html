<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Configuración Maestra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; opacity: 0; transition: opacity 0.5s ease; }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        
        /* ESTÁNDAR VISUAL: MAYÚSCULAS EN TODO EXCEPTO MAIL */
        .input-style { background-color: #f1f5f9; border: 2px solid transparent; transition: all 0.3s ease; font-weight: 700; text-transform: uppercase; }
        #inst-mail { text-transform: none; } /* Excepción para el mail */
        
        .input-style:focus { border-color: #6366f1; background-color: #fff; outline: none; }
        .tab-active { color: #6366f1; border-bottom: 3px solid #6366f1; }
        .logo-preview { width: 120px; height: 120px; object-fit: contain; border-radius: 1.5rem; border: 2px solid #e2e8f0; background: #fff; padding: 5px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
            <div>
                <h1 class="text-3xl font-black text-indigo-950 tracking-tighter italic uppercase">Configuración</h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Gestión Maestra de la Institución</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 rounded-2xl transition-all flex items-center justify-center">
                <i class="fa-solid fa-house"></i>
            </button>
        </header>

        <div class="flex gap-4 md:gap-8 mb-8 border-b border-slate-200 px-6 overflow-x-auto whitespace-nowrap">
            <button onclick="switchTab('inst')" id="btn-inst" class="pb-4 font-black uppercase text-[10px] tracking-widest tab-active">1. Institución</button>
            <button onclick="switchTab('grados')" id="btn-grados" class="pb-4 font-black uppercase text-[10px] tracking-widest text-slate-400">2. Grados</button>
            <button onclick="switchTab('mat')" id="btn-mat" class="pb-4 font-black uppercase text-[10px] tracking-widest text-slate-400">3. Materias</button>
            <button onclick="switchTab('par')" id="btn-par" class="pb-4 font-black uppercase text-[10px] tracking-widest text-slate-400">4. Paralelos</button>
            <button onclick="switchTab('jor')" id="btn-jor" class="pb-4 font-black uppercase text-[10px] tracking-widest text-slate-400">5. Jornadas</button>
        </div>

        <div id="tab-inst" class="tab-content">
            <div class="glass-card p-10">
                <div class="flex flex-col md:flex-row gap-10 mb-8 items-start">
                    <div class="flex flex-col items-center gap-4 w-full md:w-1/4">
                        <label class="text-[10px] font-black text-slate-400 uppercase block text-center">Escudo / Logo</label>
                        <img id="img-preview" src="https://via.placeholder.com/150?text=Logo+Escuela" class="logo-preview shadow-sm" alt="Logo">
                        <p class="text-[9px] text-center text-slate-400 font-medium px-2 italic mt-2">Pegue el enlace directo abajo</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 flex-1 w-full text-slate-700">
                        <div class="md:col-span-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Nombre de la Institución</label>
                            <input type="text" id="inst-nombre" class="w-full p-4 rounded-2xl input-style uppercase" placeholder="NOMBRE OFICIAL">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Código AMIE</label>
                            <input type="text" id="inst-amie" class="w-full p-4 rounded-2xl input-style uppercase">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Distrito</label>
                            <input type="text" id="inst-distrito" class="w-full p-4 rounded-2xl input-style uppercase" placeholder="EJ: 13D01">
                        </div>
                        <div class="md:col-span-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Dirección Domiciliaria (dir)</label>
                            <input type="text" id="inst-dir" class="w-full p-4 rounded-2xl input-style uppercase" placeholder="CALLE Y AVENIDAS">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Director/a</label>
                            <input type="text" id="inst-director" class="w-full p-4 rounded-2xl input-style uppercase">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Teléfono de contacto</label>
                            <input type="text" id="inst-telefono" class="w-full p-4 rounded-2xl input-style" placeholder="EJ: 0989898988">
                        </div>
                        <div class="md:col-span-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Correo Electrónico (mail)</label>
                            <input type="email" id="inst-mail" class="w-full p-4 rounded-2xl input-style lowercase" placeholder="correoescuela@gmail.com">
                        </div>
                        <div class="md:col-span-2">
                            <label class="text-[10px] font-black text-indigo-400 uppercase mb-2 block italic"><i class="fa-solid fa-link mr-1"></i> URL del Logo (logo_url)</label>
                            <input type="text" id="inst-logo-url" class="w-full p-4 rounded-2xl input-style text-blue-600 font-normal" oninput="actualizarVistaLogo()">
                        </div>
                    </div>
                </div>
                <button onclick="actualizarInstitucion()" class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-black uppercase text-xs hover:bg-black transition-all shadow-lg">Actualizar Datos Generales</button>
            </div>
        </div>

        <div id="tab-grados" class="tab-content hidden">
            <div class="glass-card p-8">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 items-end">
                    <input type="text" id="grado-nom" class="p-4 rounded-2xl input-style uppercase text-xs" placeholder="NOMBRE GRADO">
                    <select id="grado-sub" class="p-4 rounded-2xl input-style text-xs font-bold">
                        <option value="BÁSICA PREPARATORIA">BÁSICA PREPARATORIA</option>
                        <option value="BÁSICA ELEMENTAL">BÁSICA ELEMENTAL</option>
                        <option value="BÁSICA MEDIA">BÁSICA MEDIA</option>
                        <option value="BÁSICA SUPERIOR">BÁSICA SUPERIOR</option>
                        <option value="BACHILLERATO">BACHILLERATO</option>
                    </select>
                    <input type="number" id="grado-ord" class="p-4 rounded-2xl input-style text-xs" placeholder="ORDEN">
                    <button onclick="agregarGrado()" class="bg-indigo-600 text-white p-4 rounded-2xl font-black uppercase text-[10px]">Añadir</button>
                </div>
                <table class="w-full"><tbody id="lista-grados" class="divide-y divide-slate-100 text-slate-700 uppercase font-bold text-xs"></tbody></table>
            </div>
        </div>

        <div id="tab-mat" class="tab-content hidden">
            <div class="glass-card p-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 items-end">
                    <input type="text" id="mat-nom" class="p-4 rounded-2xl input-style uppercase text-xs" placeholder="NOMBRE MATERIA">
                    <input type="text" id="mat-are" class="p-4 rounded-2xl input-style uppercase text-xs" placeholder="ÁREA ACADÉMICA">
                    <button onclick="agregarMateria()" class="bg-indigo-600 text-white p-4 rounded-2xl font-black uppercase text-[10px]">Añadir</button>
                </div>
                <table class="w-full"><tbody id="lista-materias" class="divide-y divide-slate-100 text-slate-700 uppercase font-bold text-xs"></tbody></table>
            </div>
        </div>

        <div id="tab-par" class="tab-content hidden">
            <div class="glass-card p-8 text-center">
                <div class="flex gap-4 mb-8 justify-center">
                    <input type="text" id="par-nom" class="p-4 rounded-2xl input-style uppercase text-center w-40" placeholder="EJ: A">
                    <button onclick="agregarParalelo()" class="bg-indigo-600 text-white px-8 rounded-2xl font-black uppercase text-[10px]">Añadir</button>
                </div>
                <div id="lista-paralelos" class="grid grid-cols-2 md:grid-cols-5 gap-4"></div>
            </div>
        </div>

        <div id="tab-jor" class="tab-content hidden">
            <div class="glass-card p-8 text-slate-700">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 items-end">
                    <input type="text" id="jor-nom" class="p-4 rounded-2xl input-style uppercase text-xs" placeholder="MATUTINA">
                    <input type="text" id="jor-hor" class="p-4 rounded-2xl input-style text-xs" placeholder="07:15 - 12:15">
                    <button onclick="agregarJornada()" class="bg-indigo-600 text-white p-4 rounded-2xl font-black uppercase text-[10px]">Añadir</button>
                </div>
                <div id="lista-jornadas" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>
    </div>

<script type="module">
      ////// AITO DESLOGIGIGNGN
import { activarVigilante } from "./security-control.js";
    ///////////////////AUTO DESLOOGGGGG
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs, deleteDoc, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    //////
activarVigilante(auth);
/////

    onAuthStateChanged(auth, (user) => {
        if (user) { document.body.style.opacity = "1"; cargarTodo(); }
        else { window.location.href = "index.html"; }
    });

    // --- ESTÁNDAR DE DATOS: Mayúsculas al perder foco ---
    document.querySelectorAll('input[type="text"]').forEach(input => {
        input.addEventListener('blur', function() {
            this.value = this.value.toUpperCase().trim();
        });
    });

    window.switchTab = (tab) => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.querySelectorAll('button[id^="btn-"]').forEach(b => b.classList.remove('tab-active', 'text-indigo-600'));
        document.getElementById('tab-' + tab).classList.remove('hidden');
        document.getElementById('btn-' + tab).classList.add('tab-active', 'text-indigo-600');
    };

    const cargarTodo = () => { cargarInst(); cargarJor(); cargarMat(); cargarPar(); cargarGra(); };

    window.actualizarVistaLogo = () => {
        const url = document.getElementById('inst-logo-url').value.trim();
        if(url) document.getElementById('img-preview').src = url;
    };

    // INSTITUCION
    const cargarInst = async () => {
        const d = await getDoc(doc(db, "institucion", "datos_generales"));
        if(d.exists()){
            const data = d.data();
            document.getElementById('inst-nombre').value = (data.nombre || "").toUpperCase();
            document.getElementById('inst-amie').value = (data.amie || "").toUpperCase();
            document.getElementById('inst-distrito').value = (data.distrito || "").toUpperCase();
            document.getElementById('inst-dir').value = (data.dir || "").toUpperCase();
            document.getElementById('inst-director').value = (data.director || "").toUpperCase();
            document.getElementById('inst-telefono').value = data.telefono || "";
            document.getElementById('inst-mail').value = (data.mail || "").toLowerCase();
            document.getElementById('inst-logo-url').value = data.logo_url || "";
            if(data.logo_url) document.getElementById('img-preview').src = data.logo_url;
        }
    };

    window.actualizarInstitucion = async () => {
        await setDoc(doc(db, "institucion", "datos_generales"), {
            nombre: document.getElementById('inst-nombre').value.toUpperCase().trim(),
            amie: document.getElementById('inst-amie').value.toUpperCase().trim(),
            distrito: document.getElementById('inst-distrito').value.toUpperCase().trim(),
            dir: document.getElementById('inst-dir').value.toUpperCase().trim(),
            director: document.getElementById('inst-director').value.toUpperCase().trim(),
            telefono: document.getElementById('inst-telefono').value.trim(),
            mail: document.getElementById('inst-mail').value.toLowerCase().trim(),
            logo_url: document.getElementById('inst-logo-url').value.trim()
        }, {merge:true});
        Swal.fire('¡Éxito!', 'Información actualizada correctamente.', 'success');
    };

    // MATERIAS
    window.cargarMat = async () => {
        const snap = await getDocs(collection(db, "materias"));
        const tbody = document.getElementById('lista-materias'); tbody.innerHTML = "";
        snap.forEach(d => {
            tbody.innerHTML += `<tr><td class="py-4 font-bold text-xs uppercase">${d.data().nombre.toUpperCase()}</td><td class="uppercase">${d.data().area.toUpperCase()}</td><td class="text-right"><button onclick="eliminarF('materias','${d.id}','cargarMat')" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button></td></tr>`;
        });
    };
    window.agregarMateria = async () => {
        const n = document.getElementById('mat-nom').value.trim().toUpperCase();
        const a = document.getElementById('mat-are').value.trim().toUpperCase();
        if(!n || !a) return;
        const q = query(collection(db, "materias"), where("nombre", "==", n));
        const res = await getDocs(q);
        if(!res.empty) return Swal.fire('Error','Materia ya existe','error');
        await addDoc(collection(db, "materias"), { nombre: n, area: a, estado: true });
        document.getElementById('mat-nom').value = ""; document.getElementById('mat-are').value = ""; cargarMat();
    };

    // GRADOS
    window.cargarGra = async () => {
        const snap = await getDocs(collection(db, "grados"));
        const tbody = document.getElementById('lista-grados'); tbody.innerHTML = "";
        let gs = []; snap.forEach(d => gs.push({id:d.id, ...d.data()}));
        gs.sort((a,b) => a.orden - b.orden);
        gs.forEach(g => {
            tbody.innerHTML += `<tr><td class="py-4 font-bold text-xs uppercase">${g.nombre.toUpperCase()}</td><td class="uppercase">${g.subnivel.toUpperCase()}</td><td class="text-right"><button onclick="eliminarF('grados','${g.id}','cargarGra')" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button></td></tr>`;
        });
    };
    window.agregarGrado = async () => {
        const n = document.getElementById('grado-nom').value.trim().toUpperCase();
        const s = document.getElementById('grado-sub').value.toUpperCase();
        const o = document.getElementById('grado-ord').value;
        if(!n || !s || !o) return;
        await addDoc(collection(db, "grados"), { nombre: n, subnivel: s, orden: parseInt(o), estado: true });
        document.getElementById('grado-nom').value = ""; document.getElementById('grado-ord').value = ""; cargarGra();
    };

    // JORNADAS
    window.cargarJor = async () => {
        const snap = await getDocs(collection(db, "jornadas"));
        const div = document.getElementById('lista-jornadas'); div.innerHTML = "";
        snap.forEach(d => {
            div.innerHTML += `<div class="bg-slate-50 p-4 rounded-2xl flex justify-between items-center border"><div><p class="font-black text-xs uppercase">${d.data().nombre.toUpperCase()}</p><p class="text-[9px]">${d.data().horario}</p></div><button onclick="eliminarF('jornadas','${d.id}','cargarJor')" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button></div>`;
        });
    };
    window.agregarJornada = async () => {
        const n = document.getElementById('jor-nom').value.trim().toUpperCase();
        const h = document.getElementById('jor-hor').value.trim();
        if(!n || !h) return;
        await addDoc(collection(db, "jornadas"), { nombre: n, horario: h, estado: true });
        document.getElementById('jor-nom').value = ""; document.getElementById('jor-hor').value = ""; cargarJor();
    };

    // PARALELOS
    window.cargarPar = async () => {
        const snap = await getDocs(collection(db, "paralelos"));
        const div = document.getElementById('lista-paralelos'); div.innerHTML = "";
        snap.forEach(d => {
            div.innerHTML += `<div class="bg-slate-50 p-4 rounded-2xl flex justify-between items-center border"><span class="font-black text-indigo-900 uppercase">${d.data().nombre.toUpperCase()}</span><button onclick="eliminarF('paralelos','${d.id}','cargarPar')" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button></div>`;
        });
    };
    window.agregarParalelo = async () => {
        const n = document.getElementById('par-nom').value.trim().toUpperCase();
        if(!n) return;
        await addDoc(collection(db, "paralelos"), { nombre: n, estado: true });
        document.getElementById('par-nom').value = ""; cargarPar();
    };

    window.eliminarF = async (col, id, func) => {
        const res = await Swal.fire({ title: '¿Eliminar?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Sí, borrar', confirmButtonColor: '#ef4444' });
        if(res.isConfirmed){ await deleteDoc(doc(db, col, id)); window[func](); }
    };
</script>
</body>
</html>
