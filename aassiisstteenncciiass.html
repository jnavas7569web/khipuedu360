<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Control de Asistencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; opacity: 0; transition: opacity 0.5s ease; font-size: 16px; }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .input-style { background-color: #f1f5f9; border: 2px solid transparent; transition: all 0.3s ease; font-weight: 700; font-size: 1.1rem; }
        .input-style:focus { border-color: #6366f1; background-color: #fff; outline: none; }
        .nee-badge { background: #fee2e2; color: #ef4444; font-size: 11px; padding: 3px 8px; border-radius: 8px; font-weight: 900; letter-spacing: 0.5px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
            <div>
                <h1 class="text-4xl font-black text-indigo-950 tracking-tighter italic uppercase">Control de Asistencia</h1>
                <p class="text-slate-400 text-[12px] font-bold uppercase tracking-[0.3em] mt-1">Khipu Edu 360 • Registro Diario</p>
            </div>
            <div class="flex gap-3">
                <input type="date" id="fecha_asistencia" class="p-4 bg-slate-100 rounded-2xl font-black text-indigo-600 border-none outline-none text-md shadow-inner">
                <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-14 h-14 rounded-2xl transition-all flex items-center justify-center shadow-sm">
                    <i class="fa-solid fa-house text-xl"></i>
                </button>
            </div>
        </header>

        <div id="info-alerta" class="hidden mb-6 p-5 rounded-2xl bg-amber-50 border border-amber-200 text-amber-800 text-sm font-black uppercase tracking-wider flex items-center gap-4 shadow-sm">
            <i class="fa-solid fa-circle-exclamation text-2xl"></i>
            <span id="txt-alerta"></span>
        </div>

        <div class="glass-card p-10 mb-8 grid grid-cols-1 md:grid-cols-3 gap-8 items-end">
            <div>
                <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-3 block">Grado Seleccionado</label>
                <select id="sel_grado" class="w-full p-5 input-style rounded-2xl outline-none appearance-none cursor-pointer">
                    <option value="">Cargando...</option>
                </select>
            </div>
            <div>
                <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-3 block">Paralelo / Jornada</label>
                <select id="sel_paralelo" class="w-full p-5 input-style rounded-2xl outline-none appearance-none cursor-pointer">
                    <option value="">Esperando grado...</option>
                </select>
            </div>
            <button id="btn-generar" class="bg-indigo-600 hover:bg-black text-white p-5 rounded-2xl font-black uppercase text-[12px] tracking-widest transition-all shadow-xl shadow-indigo-100 active:scale-95">
                Generar Nómina <i class="fa-solid fa-users-viewfinder ml-2"></i>
            </button>
        </div>

        <div id="container-nomina" class="hidden">
            <div class="glass-card overflow-hidden mb-8 border-b-4 border-indigo-500">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-100 text-[11px] font-black text-slate-500 uppercase tracking-widest">
                            <th class="p-8">Estudiante</th>
                            <th class="p-8 text-center">Estado de Asistencia</th>
                            <th class="p-8 text-right">Observación</th>
                        </tr>
                    </thead>
                    <tbody id="lista-estudiantes"></tbody>
                </table>
            </div>

            <div class="flex flex-col md:flex-row justify-between items-center gap-8 bg-white p-10 rounded-[2.5rem] border border-slate-100 shadow-xl mb-10">
                <div class="flex items-center gap-5">
                    <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 shadow-sm">
                        <i class="fa-solid fa-user-tie text-3xl"></i>
                    </div>
                    <div>
                        <p class="text-[11px] font-black text-slate-400 uppercase tracking-tighter">Responsable del Aula</p>
                        <h4 id="nombre-tutor" class="text-xl font-black text-slate-800 uppercase italic">Buscando...</h4>
                    </div>
                </div>
                <button id="btn-guardar" class="w-full md:w-auto bg-emerald-500 hover:bg-black text-white px-16 py-6 rounded-2xl font-black uppercase text-[13px] tracking-[0.2em] shadow-2xl shadow-emerald-100 transition-all active:scale-95">
                    Sincronizar y Guardar <i class="fa-solid fa-cloud-arrow-up ml-2"></i>
                </button>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, collection, query, where, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
        if (!user) window.location.href = "index.html";
        else {
            document.body.style.opacity = "1";
            const local = new Date();
            local.setMinutes(local.getMinutes() - local.getTimezoneOffset());
            document.getElementById('fecha_asistencia').value = local.toJSON().slice(0,10);
            cargarFiltros();
        }
    });

    async function cargarFiltros() {
        const selG = document.getElementById('sel_grado');
        const selP = document.getElementById('sel_paralelo');
        const userUID = auth.currentUser.uid;

        try {
            const userDoc = await getDoc(doc(db, "usuario", userUID));
            const userData = userDoc.data();
            const isAdmin = userData.rol === "admin";

            if (isAdmin) {
                // CARGA ADMIN: Todo el catálogo
                const [gSnap, pSnap] = await Promise.all([
                    getDocs(collection(db, "grados")),
                    getDocs(collection(db, "paralelos"))
                ]);
                selG.innerHTML = '<option value="">Elegir Grado (Admin)</option>';
                gSnap.forEach(d => selG.innerHTML += `<option value="${d.id}">${d.data().nombre}</option>`);
                selP.innerHTML = '<option value="">Elegir Paralelo</option>';
                pSnap.forEach(d => {
                    const nom = d.data().nombre || d.id;
                    selP.innerHTML += `<option value="${nom}">${nom}</option>`;
                });
            } else {
                // CARGA DOCENTE: Solo sus asignaciones
                const qAsig = query(collection(db, "asignaciones"), where("docente_id", "==", userUID));
                const asigSnap = await getDocs(qAsig);
                
                let misGradosIds = [];
                let misParalelos = [];
                asigSnap.forEach(asig => {
                    misGradosIds.push(asig.data().grado_id);
                    misParalelos.push(asig.data().paralelo_id);
                });

                selG.innerHTML = '<option value="">Mis Grados</option>';
                const gSnap = await getDocs(collection(db, "grados"));
                gSnap.forEach(d => {
                    if(misGradosIds.includes(d.id)) selG.innerHTML += `<option value="${d.id}">${d.data().nombre}</option>`;
                });

                selP.innerHTML = '<option value="">Mis Paralelos</option>';
                [...new Set(misParalelos)].forEach(p => {
                    selP.innerHTML += `<option value="${p}">${p}</option>`;
                });
            }
        } catch (e) { console.error(e); }
    }

    document.getElementById('btn-generar').addEventListener('click', async () => {
        const grado = document.getElementById('sel_grado').value;
        const paralelo = document.getElementById('sel_paralelo').value;
        const fecha = document.getElementById('fecha_asistencia').value;

        if (!grado || !paralelo || !fecha) return Swal.fire('Incompleto', 'Seleccione Grado, Paralelo y Fecha.', 'info');

        // 1. Tutor (Búsqueda exacta)
        const qTutor = query(collection(db, "asignaciones"), where("grado_id", "==", grado), where("paralelo_id", "==", paralelo), where("tutor", "==", true));
        const tutorSnap = await getDocs(qTutor);
        document.getElementById('nombre-tutor').innerText = tutorSnap.empty ? "Sin tutor asignado" : "Buscando...";
        if (!tutorSnap.empty) {
            const docRef = await getDoc(doc(db, "usuario", tutorSnap.docs[0].data().docente_id));
            document.getElementById('nombre-tutor').innerText = docRef.exists() ? docRef.data().nombre : "Docente no identificado";
        }

        // 2. Alerta de duplicidad
        const qA = query(collection(db, "asistencias"), where("fecha", "==", fecha), where("grado_id", "==", grado), where("paralelo_id", "==", paralelo));
        const aSnap = await getDocs(qA);
        let registrosPrevios = {};
        if (!aSnap.empty) {
            const pDoc = await getDoc(doc(db, "usuario", aSnap.docs[0].data().registrado_por));
            document.getElementById('info-alerta').classList.remove('hidden');
            document.getElementById('txt-alerta').innerText = `Asistencia registrada hoy por: ${pDoc.exists() ? pDoc.data().nombre : 'otro docente'}`;
            aSnap.forEach(d => registrosPrevios[d.data().estudiante_id] = d.data());
        } else {
            document.getElementById('info-alerta').classList.add('hidden');
        }

        // 3. Nómina Estudiantes (Comparación exacta de Paralelo)
        const estSnap = await getDocs(collection(db, "estudiantes"));
        let estudiantes = [];
        estSnap.forEach(d => {
            const est = d.data();
            // Comparamos Grado ID y Paralelo Nombre exacto
            if (est.grado === grado && est.paralelo === paralelo) {
                if (est.estado === true || est.estado === undefined || est.estado === "activo") {
                    estudiantes.push({id: d.id, ...est});
                }
            }
        });

        estudiantes.sort((a,b) => a.apellidos.localeCompare(b.apellidos));
        const tbody = document.getElementById('lista-estudiantes');
        tbody.innerHTML = '';

        if(estudiantes.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="p-20 text-center text-slate-300 font-bold italic text-xl uppercase">No hay alumnos en ' + paralelo + '.</td></tr>';
            document.getElementById('container-nomina').classList.remove('hidden');
            return;
        }

        estudiantes.forEach(est => {
            const pre = registrosPrevios[est.id] || { estado: 'presente', observacion: '' };
            tbody.innerHTML += `
                <tr class="border-b border-slate-50 hover:bg-slate-50/50 transition-all">
                    <td class="p-8">
                        <div class="font-black text-slate-800 uppercase text-lg tracking-tight">${est.apellidos} ${est.nombres}</div>
                        <div class="text-[10px] text-slate-400 font-bold tracking-widest mt-1">ID: ${est.id} ${est.nee ? '<span class="nee-badge ml-3">NEE</span>' : ''}</div>
                    </td>
                    <td class="p-8 text-center">
                        <select class="status-select w-full max-w-[200px] p-4 bg-white border-2 border-slate-100 rounded-2xl font-black text-indigo-600 outline-none shadow-sm focus:border-indigo-400" data-id="${est.id}">
                            <option value="presente" ${pre.estado==='presente'?'selected':''}>✅ PRESENTE</option>
                            <option value="ausente" ${pre.estado==='ausente'?'selected':''}>❌ AUSENTE</option>
                            <option value="atraso" ${pre.estado==='atraso'?'selected':''}>⏳ ATRASO</option>
                            <option value="justificado" ${pre.estado==='justificado'?'selected':''}>📝 JUSTIFICADO</option>
                        </select>
                    </td>
                    <td class="p-8 text-right">
                        <button onclick="document.getElementById('obs_${est.id}').classList.toggle('hidden')" class="${pre.observacion?'text-indigo-600':'text-slate-300'} p-3 hover:scale-110 transition-transform">
                            <i class="fa-solid fa-comment-dots text-3xl"></i>
                        </button>
                        <input type="text" id="obs_${est.id}" value="${pre.observacion}" placeholder="Nota..." class="${pre.observacion?'':'hidden'} w-full mt-3 p-3 text-xs font-bold border-b-2 border-indigo-200 outline-none bg-indigo-50/30 rounded-xl">
                    </td>
                </tr>`;
        });
        document.getElementById('container-nomina').classList.remove('hidden');
    });

    document.getElementById('btn-guardar').addEventListener('click', async () => {
        const sel = document.querySelectorAll('.status-select');
        const fecha = document.getElementById('fecha_asistencia').value;
        const grado = document.getElementById('sel_grado').value;
        const paralelo = document.getElementById('sel_paralelo').value;
        const btn = document.getElementById('btn-guardar');

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> GUARDANDO...';

        try {
            for (let s of sel) {
                const eid = s.dataset.id;
                await setDoc(doc(db, "asistencias", `${eid}_${fecha}`), {
                    estudiante_id: eid, fecha, estado: s.value,
                    observacion: document.getElementById(`obs_${eid}`).value.toUpperCase(),
                    grado_id: grado, paralelo_id: paralelo,
                    registrado_por: auth.currentUser.uid, timestamp: serverTimestamp()
                }, { merge: true });
            }
            Swal.fire('¡Éxito!', 'Asistencia sincronizada correctamente.', 'success').then(() => location.reload());
        } catch(e) { 
            Swal.fire('Error', 'No se pudo guardar la lista.', 'error'); 
            btn.disabled = false;
            btn.innerText = "Sincronizar y Guardar";
        }
    });
</script>
</body>
</html>
