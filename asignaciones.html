<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Asignaciones</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; opacity: 0; transition: opacity 0.5s ease; }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        
        /* ESTÁNDAR VISUAL MAYÚSCULAS */
        .input-style { 
            background-color: #f1f5f9; border: 2px solid #e2e8f0; transition: all 0.3s ease; 
            font-weight: 700; color: #1e293b; text-transform: uppercase;
        }
        .input-style:focus { border-color: #1d9bf0; background-color: #fff; outline: none; box-shadow: 0 0 0 4px rgba(29, 155, 240, 0.1); }
        
        .label-style { font-size: 11px; font-weight: 900; color: #1d9bf0; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; display: block; margin-left: 0.25rem; }
        .tag-materia { background: #eff6ff; color: #1d4ed8; padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 11px; display: flex; align-items: center; gap: 8px; border: 1px solid #dbeafe; text-transform: uppercase; }
        .dot { transition: all 0.3s ease-in-out; }
        input:checked ~ .dot { transform: translateX(1.5rem); background-color: #10b981; }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-7xl mx-auto">
    <header class="flex justify-between items-center mb-10 bg-white p-6 md:p-10 rounded-[2.5rem] border border-slate-100 shadow-sm">
        <div>
            <h1 class="text-3xl md:text-5xl font-black text-indigo-950 tracking-tighter italic uppercase leading-tight">Asignaciones</h1>
            <p class="text-slate-400 text-[10px] md:text-[13px] font-bold uppercase tracking-[0.3em] mt-2">Carga Horaria y Tutorías</p>
        </div>
        <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 md:w-16 md:h-16 rounded-3xl transition-all flex items-center justify-center shadow-sm">
            <i class="fa-solid fa-house text-xl md:text-2xl"></i>
        </button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
        <aside class="lg:col-span-4">
            <div class="glass-card p-6 md:p-10 sticky top-8">
                <h2 id="form-title" class="text-xl md:text-2xl font-black text-slate-800 uppercase italic underline decoration-sky-500 decoration-4 underline-offset-8 mb-8">Vincular Docente</h2>

                <form id="form-asignacion" class="space-y-6 text-slate-700">
                    <div>
                        <label class="label-style">Docente Responsable</label>
                        <select id="select-docente" required class="w-full p-4 input-style rounded-2xl appearance-none cursor-pointer"></select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="label-style">Grado</label>
                            <select id="select-grado" required class="w-full p-4 input-style rounded-2xl appearance-none cursor-pointer"></select>
                        </div>
                        <div>
                            <label class="label-style">Paralelo</label>
                            <select id="select-paralelo" required class="w-full p-4 input-style rounded-2xl appearance-none cursor-pointer"></select>
                        </div>
                    </div>

                    <div>
                        <label class="label-style">Jornada de la Carga</label>
                        <select id="select-jornada" required class="w-full p-4 input-style rounded-2xl appearance-none cursor-pointer"></select>
                    </div>

                    <div class="bg-slate-50 p-6 rounded-[2rem] border border-slate-200">
                        <label class="label-style text-slate-500">Asignar Materias</label>
                        <div class="flex gap-2 mb-4">
                            <select id="select-materia" class="flex-1 p-4 input-style rounded-2xl"></select>
                            <button type="button" id="btn-add-materia" class="bg-indigo-600 text-white px-6 rounded-2xl hover:bg-black transition-all">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                        <div id="materia-tags" class="flex flex-wrap gap-2">
                            <p id="no-materias" class="text-[10px] font-bold text-slate-300 uppercase italic">Sin materias añadidas</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 items-center">
                        <div>
                            <label class="label-style">Periodo Lectivo</label>
                            <input type="text" id="input-periodo" class="w-full p-4 input-style rounded-2xl bg-slate-100 text-indigo-600 text-center" readonly>
                        </div>
                        <div class="flex flex-col items-center">
                            <label class="label-style">¿Es Tutor?</label>
                            <label class="flex items-center cursor-pointer">
                                <div class="relative">
                                    <input type="checkbox" id="check-tutor" class="sr-only">
                                    <div class="block bg-slate-200 w-14 h-8 rounded-full"></div>
                                    <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition shadow-sm"></div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <button type="submit" id="btn-submit" class="w-full bg-sky-500 hover:bg-black text-white py-5 rounded-3xl font-black uppercase text-[11px] tracking-[0.2em] shadow-xl transition-all active:scale-95">
                        Confirmar Asignación <i class="fa-solid fa-circle-check ml-2"></i>
                    </button>
                </form>
            </div>
        </aside>

        <main class="lg:col-span-8">
            <div class="glass-card p-6 md:p-10">
                <div class="flex justify-between items-center mb-10">
                    <h2 class="text-2xl font-black text-slate-800 uppercase italic">Registros Actuales</h2>
                    <span id="count-asig" class="bg-indigo-600 text-white px-4 py-1 rounded-xl font-black text-[10px]">0</span>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-[10px] font-black text-slate-400 uppercase border-b border-slate-50">
                                <th class="pb-6 pl-4">Docente</th>
                                <th class="pb-6 text-center">Curso / Jornada</th>
                                <th class="pb-6">Materias</th>
                                <th class="pb-6 text-right pr-4">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-asignaciones" class="divide-y divide-slate-50">
                            <tr><td colspan="4" class="p-20 text-center text-slate-300 italic">Cargando registros...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script type="module">

    /////
   import { activarVigilante } from "./security-control.js";
    ///
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, setDoc, deleteDoc, serverTimestamp, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    //////
activarVigilante(auth);
/////

    let materiasSel = [];
    const maps = { docente: {}, grado: {}, materia: {} };

    onAuthStateChanged(auth, async (user) => {
        if (user) { 
            document.body.style.opacity = "1"; 
            await cargarTodo(); 
        } else { window.location.href = "index.html"; }
    });

    async function cargarTodo() {
        try {
            const [sUsr, sGra, sPar, sMat, sPer, sJor] = await Promise.all([
                getDocs(query(collection(db, "usuario"), where("rol", "in", ["docente", "admin"]), orderBy("nombre", "asc"))),
                getDocs(query(collection(db, "grados"), orderBy("orden", "asc"))),
                getDocs(collection(db, "paralelos")),
                getDocs(collection(db, "materias")),
                getDocs(query(collection(db, "periodos_lectivos"), where("estado", "in", ["activo", true]))),
                getDocs(collection(db, "jornadas"))
            ]);

            // Periodo
            if(!sPer.empty) document.getElementById('input-periodo').value = sPer.docs[0].data().nombre.toUpperCase();

            const fill = (snap, elId, mapKey) => {
                const el = document.getElementById(elId);
                el.innerHTML = '<option value="">SELECCIONAR...</option>';
                snap.forEach(d => {
                    const nombre = d.data().nombre.toUpperCase();
                    maps[mapKey][d.id] = nombre;
                    el.innerHTML += `<option value="${d.id}">${nombre}</option>`;
                });
            };

            fill(sUsr, 'select-docente', 'docente');
            fill(sGra, 'select-grado', 'grado');
            fill(sMat, 'select-materia', 'materia');

            // Paralelos y Jornadas (Guardamos NOMBRE para que coincida con Estudiantes)
            const selP = document.getElementById('select-paralelo');
            selP.innerHTML = '<option value="">-</option>';
            sPar.forEach(p => selP.innerHTML += `<option value="${p.data().nombre.toUpperCase()}">${p.data().nombre.toUpperCase()}</option>`);

            const selJ = document.getElementById('select-jornada');
            selJ.innerHTML = '<option value="">-</option>';
            sJor.forEach(j => selJ.innerHTML += `<option value="${j.data().nombre.toUpperCase()}">${j.data().nombre.toUpperCase()}</option>`);

            loadTable();
        } catch (e) { console.error(e); }
    }

    document.getElementById('btn-add-materia').onclick = () => {
        const id = document.getElementById('select-materia').value;
        if (id && !materiasSel.includes(id)) { materiasSel.push(id); renderTags(); }
    };

    function renderTags() {
        const cont = document.getElementById('materia-tags');
        cont.querySelectorAll('.tag-materia').forEach(t => t.remove());
        document.getElementById('no-materias').style.display = materiasSel.length ? 'none' : 'block';
        materiasSel.forEach(id => {
            const div = document.createElement('div');
            div.className = "tag-materia";
            div.innerHTML = `${maps.materia[id]} <i class="fa-solid fa-xmark cursor-pointer" onclick="removeM('`+id+`')"></i>`;
            cont.appendChild(div);
        });
    }

    window.removeM = (id) => { materiasSel = materiasSel.filter(m => m !== id); renderTags(); };

    async function loadTable() {
        const tbody = document.getElementById('tabla-asignaciones');
        const snap = await getDocs(collection(db, "asignaciones"));
        tbody.innerHTML = "";
        document.getElementById('count-asig').innerText = snap.size + " REGISTROS";

        snap.forEach(docSnap => {
            const d = docSnap.data();
            const tr = document.createElement('tr');
            tr.className = "hover:bg-slate-50 transition-all border-b border-slate-50";
            const materiasTxt = d.materia_id ? d.materia_id.map(m => maps.materia[m] || m).join(', ') : '---';

            tr.innerHTML = `
                <td class="p-6">
                    <div class="font-black text-indigo-950 text-lg uppercase">${maps.docente[d.docente_id] || d.docente_id}</div>
                    ${d.tutor ? '<span class="text-[8px] font-black bg-emerald-500 text-white px-2 py-0.5 rounded-lg uppercase mt-1 inline-block">Docente Tutor</span>' : ''}
                </td>
                <td class="p-6 text-center">
                    <div class="font-bold text-slate-700 text-xs uppercase">${maps.grado[d.grado_id] || d.grado_id}</div>
                    <div class="text-[10px] font-black text-sky-500 uppercase">"${d.paralelo_id}" (${d.jornada || 'N/A'})</div>
                </td>
                <td class="p-6"><div class="text-[10px] text-slate-400 font-bold uppercase truncate max-w-[150px]">${materiasTxt}</div></td>
                <td class="p-6 text-right">
                    <button onclick="borrar('`+docSnap.id+`')" class="text-slate-200 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    document.getElementById('form-asignacion').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-submit');
        const docente = document.getElementById('select-docente').value;
        const grado = document.getElementById('select-grado').value;
        const paralelo = document.getElementById('select-paralelo').value;
        const jornada = document.getElementById('select-jornada').value;
        const esTutor = document.getElementById('check-tutor').checked;
        const periodo = document.getElementById('input-periodo').value;

        if(!materiasSel.length) return Swal.fire('Error', 'Seleccione materias.', 'warning');
        btn.disabled = true;

        try {
            // VALIDACIÓN: UN SOLO TUTOR POR DOCENTE POR AÑO
            if(esTutor) {
                const qT = query(collection(db, "asignaciones"), 
                    where("docente_id", "==", docente), 
                    where("periodo_id", "==", periodo),
                    where("tutor", "==", true));
                const snapT = await getDocs(qT);
                if(!snapT.empty) {
                    Swal.fire('Restricción', 'Este docente ya es tutor en otro grado. Un docente solo puede tener una tutoría por año.', 'error');
                    btn.disabled = false; return;
                }
            }

            const payload = {
                docente_id: docente, grado_id: grado, paralelo_id: paralelo, jornada: jornada,
                periodo_id: periodo, materia_id: materiasSel, tutor: esTutor,
                updated_at: serverTimestamp()
            };

            const docId = `${docente}_${grado}_${paralelo}_${jornada}`.replace(/\s+/g, '');
            await setDoc(doc(db, "asignaciones", docId), payload);
            Swal.fire('Éxito', 'Asignación guardada.', 'success').then(() => location.reload());
        } catch (e) { btn.disabled = false; }
    };

    window.borrar = async (id) => {
        const res = await Swal.fire({ title: '¿Eliminar?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444' });
        if (res.isConfirmed) { await deleteDoc(doc(db, "asignaciones", id)); loadTable(); }
    };
</script>
</body>
</html>
