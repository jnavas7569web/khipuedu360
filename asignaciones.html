<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Asignaciones Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; opacity: 0; transition: opacity 0.5s ease; }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .input-style { background-color: #f1f5f9; border: 2px solid #e2e8f0; transition: all 0.3s ease; font-weight: 700; color: #1e293b; }
        .input-style:focus { border-color: #1d9bf0; background-color: #fff; outline: none; box-shadow: 0 0 0 4px rgba(29, 155, 240, 0.1); }
        .label-style { font-size: 11px; font-weight: 900; color: #1d9bf0; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; display: block; margin-left: 0.25rem; }
        .tag-materia { background: #eff6ff; color: #1d4ed8; padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 11px; display: flex; align-items: center; gap: 8px; border: 1px solid #dbeafe; text-transform: uppercase; }
        .dot { transition: all 0.3s ease-in-out; }
        input:checked ~ .dot { transform: translateX(1.5rem); background-color: #10b981; }

        /* Ajuste para el botón + en móviles */
        @media (max-width: 640px) {
            .btn-plus-container { width: 100%; margin-top: 10px; }
            .btn-plus-container button { width: 100%; height: 50px; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-7xl mx-auto">
    <header class="flex justify-between items-center mb-10 bg-white p-6 md:p-10 rounded-[2.5rem] border border-slate-100 shadow-sm">
        <div>
            <h1 class="text-3xl md:text-5xl font-black text-indigo-950 tracking-tighter italic uppercase leading-tight">Asignaciones</h1>
            <p class="text-slate-400 text-[10px] md:text-[13px] font-bold uppercase tracking-[0.3em] mt-2">Carga Horaria y Tutorías • Khipu Edu 360</p>
        </div>
        <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 md:w-16 md:h-16 rounded-3xl transition-all flex items-center justify-center shadow-sm">
            <i class="fa-solid fa-house text-xl md:text-2xl"></i>
        </button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
        <aside class="lg:col-span-4">
            <div class="glass-card p-6 md:p-10 sticky top-8">
                <div class="flex justify-between items-center mb-8">
                    <h2 id="form-title" class="text-xl md:text-2xl font-black text-slate-800 uppercase italic underline decoration-sky-500 decoration-4 underline-offset-8">Vincular Docente</h2>
                    <span id="edit-badge" class="hidden bg-amber-100 text-amber-600 px-3 py-1 rounded-xl font-black text-[9px] uppercase border border-amber-200">Editando</span>
                </div>

                <form id="form-asignacion" class="space-y-6">
                    <input type="hidden" id="edit-id">
                    
                    <div>
                        <label class="label-style">Docente Responsable</label>
                        <select id="select-docente" required class="w-full p-4 input-style rounded-2xl appearance-none cursor-pointer uppercase text-sm">
                            <option value="">SELECCIONAR...</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="label-style">Grado Destino</label>
                            <select id="select-grado" required class="w-full p-4 input-style rounded-2xl appearance-none cursor-pointer text-sm">
                                <option value="">CARGANDO...</option>
                            </select>
                        </div>
                        <div>
                            <label class="label-style">Paralelo</label>
                            <select id="select-paralelo" required class="w-full p-4 input-style rounded-2xl appearance-none cursor-pointer text-sm">
                                <option value="">-</option>
                            </select>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-6 rounded-[2rem] border border-slate-200">
                        <label class="label-style text-slate-500">Asignar Materias</label>
                        <div class="flex flex-col sm:flex-row gap-3 mb-6">
                            <select id="select-materia" class="flex-1 p-4 input-style rounded-2xl text-sm">
                                <option value="">Elegir materia...</option>
                            </select>
                            <div class="btn-plus-container">
                                <button type="button" id="btn-add-materia" class="bg-indigo-600 text-white p-4 rounded-2xl hover:bg-black transition-all shadow-lg flex items-center justify-center">
                                    <i class="fa-solid fa-plus text-lg"></i>
                                </button>
                            </div>
                        </div>
                        <div id="materia-tags" class="flex flex-wrap gap-2">
                            <p id="no-materias" class="text-[10px] font-bold text-slate-300 uppercase italic">Sin materias añadidas</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 items-center">
                        <div>
                            <label class="label-style">Periodo Lectivo</label>
                            <input type="text" id="input-periodo" class="w-full p-4 input-style rounded-2xl bg-slate-100 text-indigo-600 cursor-not-allowed text-center" readonly>
                        </div>
                        <div class="flex flex-col items-center">
                            <label class="label-style">¿Es Tutor?</label>
                            <label class="flex items-center cursor-pointer">
                                <div class="relative">
                                    <input type="checkbox" id="check-tutor" class="sr-only">
                                    <div class="block bg-slate-200 w-14 h-8 rounded-full"></div>
                                    <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition shadow-sm"></div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <button type="submit" id="btn-submit" class="w-full bg-sky-500 hover:bg-black text-white py-5 rounded-3xl font-black uppercase text-[11px] tracking-[0.2em] shadow-xl transition-all active:scale-95">
                        Confirmar Asignación <i class="fa-solid fa-circle-check ml-2"></i>
                    </button>
                    <button type="button" id="btn-cancel" class="hidden w-full text-[10px] font-black uppercase text-slate-400 py-2 hover:text-red-500 transition-all underline underline-offset-4">Cancelar Edición</button>
                </form>
            </div>
        </aside>

        <main class="lg:col-span-8">
            <div class="glass-card p-6 md:p-10">
                <div class="flex justify-between items-center mb-10 border-b border-slate-50 pb-6">
                    <h2 class="text-2xl font-black text-slate-800 uppercase italic tracking-tighter">Registros Actuales</h2>
                    <span id="count-asig" class="bg-indigo-600 text-white px-4 py-1 rounded-xl font-black text-[10px] uppercase">0 REGISTROS</span>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="text-[10px] font-black text-slate-400 uppercase text-left">
                                <th class="pb-6 pl-4">Docente</th>
                                <th class="pb-6 text-center">Curso</th>
                                <th class="pb-6">Materias</th>
                                <th class="pb-6 text-center">Periodo</th>
                                <th class="pb-6 text-right pr-4">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-asignaciones" class="divide-y divide-slate-50">
                            <tr><td colspan="5" class="p-20 text-center text-slate-300 italic font-bold">Iniciando sistema...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, setDoc, deleteDoc, serverTimestamp, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let materiasSel = [];
    const cache = { docente: {}, grado: {}, materia: {} };

    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "index.html"; }
        else {
            const userDoc = await getDoc(doc(db, "usuario", user.uid));
            if (userDoc.exists() && userDoc.data().rol === 'admin') {
                document.body.style.opacity = "1";
                await inicializar();
            } else {
                window.location.href = "dashboard.html";
            }
        }
    });

    async function inicializar() {
        const [sUsr, sGra, sPar, sMat, sPer] = await Promise.all([
            getDocs(query(collection(db, "usuario"), where("rol", "in", ["docente", "admin"]), orderBy("nombre", "asc"))),
            getDocs(query(collection(db, "grados"), orderBy("orden", "asc"))),
            getDocs(query(collection(db, "paralelos"), orderBy("nombre", "asc"))),
            getDocs(query(collection(db, "materias"), orderBy("nombre", "asc"))),
            getDocs(query(collection(db, "periodos_lectivos"), where("estado", "==", "activo")))
        ]);

        // Cargar Periodo Actual
        if(!sPer.empty) document.getElementById('input-periodo').value = sPer.docs[0].data().nombre;

        // Cargar Docentes
        const selD = document.getElementById('select-docente');
        selD.innerHTML = '<option value="">ELEGIR DOCENTE...</option>';
        sUsr.forEach(d => {
            cache.docente[d.id] = d.data().nombre;
            selD.innerHTML += `<option value="${d.id}">${d.data().nombre}</option>`;
        });

        // Cargar Grados (Ordenados)
        const selG = document.getElementById('select-grado');
        selG.innerHTML = '<option value="">ELEGIR...</option>';
        sGra.forEach(d => {
            cache.grado[d.id] = d.data().nombre;
            selG.innerHTML += `<option value="${d.id}">${d.data().nombre}</option>`;
        });

        // Cargar Paralelos (Por Nombre)
        const selP = document.getElementById('select-paralelo');
        selP.innerHTML = '<option value="">-</option>';
        sPar.forEach(d => {
            selP.innerHTML += `<option value="${d.data().nombre}">${d.data().nombre}</option>`;
        });

        // Cargar Materias
        const selM = document.getElementById('select-materia');
        selM.innerHTML = '<option value="">Elegir materia...</option>';
        sMat.forEach(d => {
            cache.materia[d.id] = d.data().nombre;
            selM.innerHTML += `<option value="${d.id}">${d.data().nombre}</option>`;
        });

        loadTable();
    }

    document.getElementById('btn-add-materia').onclick = () => {
        const id = document.getElementById('select-materia').value;
        if (id && !materiasSel.includes(id)) {
            materiasSel.push(id);
            renderTags();
        }
    };

    function renderTags() {
        const cont = document.getElementById('materia-tags');
        cont.querySelectorAll('.tag-materia').forEach(t => t.remove());
        document.getElementById('no-materias').style.display = materiasSel.length ? 'none' : 'block';
        materiasSel.forEach(id => {
            const div = document.createElement('div');
            div.className = "tag-materia";
            div.innerHTML = `${cache.materia[id] || id} <i class="fa-solid fa-xmark cursor-pointer opacity-50 hover:opacity-100" onclick="removeMateria('${id}')"></i>`;
            cont.appendChild(div);
        });
    }

    window.removeMateria = (id) => {
        materiasSel = materiasSel.filter(m => m !== id);
        renderTags();
    };

    async function loadTable() {
        const tbody = document.getElementById('tabla-asignaciones');
        const snap = await getDocs(collection(db, "asignaciones"));
        tbody.innerHTML = "";
        document.getElementById('count-asig').innerText = `${snap.size} REGISTROS`;

        if (snap.empty) {
            tbody.innerHTML = `<tr><td colspan="5" class="p-20 text-center text-slate-300 italic font-bold">Sin asignaciones.</td></tr>`;
            return;
        }

        snap.forEach(docSnap => {
            const d = docSnap.data();
            const tr = document.createElement('tr');
            tr.className = "hover:bg-slate-50 transition-all border-b border-slate-50";
            const mats = d.materia_id ? d.materia_id.map(m => cache.materia[m] || m).join(', ') : '---';

            tr.innerHTML = `
                <td class="p-4 md:p-6">
                    <div class="font-black text-indigo-950 text-sm md:text-lg uppercase">${cache.docente[d.docente_id] || d.docente_id}</div>
                    ${d.tutor ? '<span class="text-[8px] font-black bg-emerald-500 text-white px-2 py-0.5 rounded-lg uppercase mt-1 inline-block">Docente Tutor</span>' : ''}
                </td>
                <td class="p-4 text-center">
                    <div class="font-bold text-slate-700 text-xs uppercase">${cache.grado[d.grado_id] || d.grado_id}</div>
                    <div class="text-[10px] font-black text-sky-500 uppercase">"${d.paralelo_id}"</div>
                </td>
                <td class="p-4"><div class="text-[10px] text-slate-400 font-bold uppercase truncate max-w-[150px]">${mats}</div></td>
                <td class="p-4 text-center font-black text-indigo-950 text-xs">${d.periodo_id}</td>
                <td class="p-4 text-right space-x-2">
                    <button onclick="editAsig('${docSnap.id}')" class="text-sky-500 hover:text-black"><i class="fa-solid fa-pen"></i></button>
                    <button onclick="deleteAsig('${docSnap.id}')" class="text-slate-200 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.editAsig = async (id) => {
        const dSnap = await getDoc(doc(db, "asignaciones", id));
        if (dSnap.exists()) {
            const data = dSnap.data();
            document.getElementById('edit-id').value = id;
            document.getElementById('select-docente').value = data.docente_id;
            document.getElementById('select-grado').value = data.grado_id;
            document.getElementById('select-paralelo').value = data.paralelo_id;
            document.getElementById('check-tutor').checked = data.tutor;
            materiasSel = data.materia_id || [];
            renderTags();
            document.getElementById('edit-badge').classList.remove('hidden');
            document.getElementById('btn-cancel').classList.remove('hidden');
            document.getElementById('btn-submit').innerText = "Guardar Cambios";
            document.getElementById('btn-submit').classList.replace('bg-sky-500', 'bg-amber-500');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    };

    document.getElementById('btn-cancel').onclick = () => location.reload();

    document.getElementById('form-asignacion').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-submit');
        const g_id = document.getElementById('select-grado').value;
        const p_id = document.getElementById('select-paralelo').value;
        const d_id = document.getElementById('select-docente').value;
        const esT = document.getElementById('check-tutor').checked;
        const per = document.getElementById('input-periodo').value;

        if(!materiasSel.length) return Swal.fire('Atención', 'Selecciona al menos una materia.', 'warning');
        btn.disabled = true;

        try {
            if(esT) {
                const qT = query(collection(db, "asignaciones"), where("grado_id", "==", g_id), where("paralelo_id", "==", p_id), where("tutor", "==", true));
                const sT = await getDocs(qT);
                const existT = sT.docs.find(doc => doc.id !== document.getElementById('edit-id').value);
                if(existT) {
                    Swal.fire('Conflicto', 'Este curso ya tiene un tutor asignado.', 'error');
                    btn.disabled = false; return;
                }
            }

            const payload = {
                docente_id: d_id, grado_id: g_id, paralelo_id: p_id,
                periodo_id: per, materia_id: materiasSel, tutor: esT,
                updated_at: serverTimestamp()
            };

            const finalID = document.getElementById('edit-id').value || `${d_id}_${g_id}_${p_id}`.replace(/\s+/g, '');
            await setDoc(doc(db, "asignaciones", finalID), payload, { merge: true });
            Swal.fire('¡Listo!', 'Asignación procesada con éxito.', 'success').then(() => location.reload());
        } catch (e) { 
            Swal.fire('Error', e.message, 'error'); 
            btn.disabled = false;
        }
    };

    window.deleteAsig = async (id) => {
        const res = await Swal.fire({ title: '¿Eliminar?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Sí, borrar', confirmButtonColor: '#ef4444' });
        if (res.isConfirmed) { await deleteDoc(doc(db, "asignaciones", id)); loadTable(); }
    };
</script>
</body>
</html>
