<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Asignaciones</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .input-style { background-color: #f8fafc; border: 2px solid #f1f5f9; transition: all 0.3s ease; }
        .input-style:focus { border-color: #6366f1; background-color: #fff; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .tag-materia { background: #e0e7ff; color: #4338ca; padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 10px; display: flex; align-items: center; gap: 5px; text-transform: uppercase; }
        /* Toggle */
        .dot { transition: all 0.3s ease-in-out; }
        input:checked ~ .dot { transform: translateX(100%); background-color: #4f46e5; }
        input:checked ~ .block { background-color: #e0e7ff; }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-7xl mx-auto">
    <header class="flex justify-between items-center mb-10 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
        <div>
            <h1 class="text-3xl font-black text-indigo-950 tracking-tighter italic uppercase">Asignaciones Académicas</h1>
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Gestión de Carga Horaria • Khipu Edu 360</p>
        </div>
        <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 rounded-2xl transition-all flex items-center justify-center">
            <i class="fa-solid fa-house"></i>
        </button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <aside class="lg:col-span-1">
            <div class="glass-card p-8 sticky top-8">
                <h2 class="text-xl font-black text-slate-800 uppercase italic mb-8 flex items-center gap-2">
                    <i class="fa-solid fa-link text-indigo-500"></i> Vincular Docente
                </h2>

                <form id="form-asignacion" class="space-y-6">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Docente Responsable</label>
                        <select id="select-docente" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 uppercase">
                            <option value="">Cargando docentes...</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Grado</label>
                            <select id="select-grado" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700">
                                <option value="">Cargando...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Paralelo</label>
                            <select id="select-paralelo" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700">
                                <option value="">Cargando...</option>
                            </select>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100">
                        <label class="block text-[10px] font-black text-indigo-400 uppercase mb-3 ml-1">Asignar Materias</label>
                        <div class="flex gap-2 mb-4">
                            <select id="select-materia" class="flex-1 p-3 input-style rounded-xl font-bold text-slate-700 text-sm">
                                <option value="">Elegir materia...</option>
                            </select>
                            <button type="button" id="btn-add-materia" class="bg-indigo-600 text-white px-4 rounded-xl hover:bg-black transition-all">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                        <div id="materia-tags" class="flex flex-wrap gap-2">
                            <p id="no-materias" class="text-[9px] font-bold text-slate-300 uppercase italic">Sin materias añadidas</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 items-center">
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Periodo</label>
                            <select id="select-periodo" required class="w-full p-3 input-style rounded-xl font-bold text-slate-700">
                                <option value="">Cargando...</option>
                            </select>
                        </div>
                        <div class="flex flex-col items-center">
                            <label class="text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest">¿Es Tutor?</label>
                            <label class="flex items-center cursor-pointer">
                                <div class="relative">
                                    <input type="checkbox" id="check-tutor" class="sr-only">
                                    <div class="block bg-slate-200 w-14 h-8 rounded-full"></div>
                                    <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition shadow-sm"></div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-black text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-[0.2em] shadow-xl transition-all">
                        Guardar Asignación <i class="fa-solid fa-check-circle ml-2"></i>
                    </button>
                </form>
            </div>
        </aside>

        <main class="lg:col-span-2">
            <div class="glass-card p-8">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-xl font-black text-slate-800 uppercase italic">Registros Actuales</h2>
                    <span id="count-asig" class="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-xl font-black text-[10px] uppercase">0 registros</span>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-[10px] font-black text-slate-400 uppercase border-b border-slate-100">
                                <th class="p-4">Docente / Cargo</th>
                                <th class="p-4 text-center">Grado / Par.</th>
                                <th class="p-4">Cátedras</th>
                                <th class="p-4 text-center">Periodo</th>
                                <th class="p-4"></th>
                            </tr>
                        </thead>
                        <tbody id="tabla-asignaciones" class="divide-y divide-slate-50">
                            <tr><td colspan="5" class="p-10 text-center text-slate-300 italic font-bold">Iniciando sistema...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };
///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const auth = getAuth(app);

// BLOQUE DE SEGURIDAD: Verificar sesión activa
onAuthStateChanged(auth, async (user) => {
    if (!user) {
        // Si no hay usuario, expulsar al login de inmediato
        window.location.href = "index.html";
    } else {
        // OPCIONAL: Control de nivel Admin (Solo para páginas de gestión)
        // Si la página es 'usuarios.html' o 'configuracion.html'
        const currentPath = window.location.pathname;
        if (currentPath.includes('usuarios.html') || currentPath.includes('asignaciones.html')) {
            const userDoc = await getDoc(doc(db, "usuario", user.uid));
            if (userDoc.exists() && userDoc.data().rol !== 'admin') {
                Swal.fire('Acceso Denegado', 'No tienes permisos de administrador.', 'error')
                .then(() => window.location.href = "dashboard.html");
            }
        }
    }
});
    
    //////////////////////////////////////////hackinggggggggggggggggggggg///////////////////////////////////////////////////////////////////////////////
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Mapas globales para "traducir" IDs a Nombres
    let materiasSel = [];
    const maps = { docente: {}, grado: {}, materia: {}, periodo: {} };

    async function loadAll() {
        try {
            const [sUsr, sGra, sPar, sMat, sPer] = await Promise.all([
                getDocs(query(collection(db, "usuario"), orderBy("nombre"))),
                getDocs(collection(db, "grados")),
                getDocs(collection(db, "paralelos")),
                getDocs(collection(db, "materias")),
                getDocs(collection(db, "periodos_lectivos"))
            ]);

            // Llenar selectores y Mapas
            const fill = (snap, elId, mapKey, isUser = false) => {
                const el = document.getElementById(elId);
                el.innerHTML = `<option value="">Seleccionar...</option>`;
                snap.forEach(d => {
                    const data = d.data();
                    const name = isUser ? `${data.nombre} ${data.apellido || ''}` : (data.nombre || d.id);
                    maps[mapKey][d.id] = name;
                    el.innerHTML += `<option value="${d.id}">${name}</option>`;
                });
            };

            fill(sUsr, 'select-docente', 'docente', true);
            fill(sGra, 'select-grado', 'grado');
            fill(sMat, 'select-materia', 'materia');
            
            // Paralelos y Periodos (ajuste manual)
            const sP = document.getElementById('select-paralelo');
            sP.innerHTML = `<option value="">-</option>`;
            sPar.forEach(p => sP.innerHTML += `<option value="${p.id}">${p.id}</option>`);

            const sPe = document.getElementById('select-periodo');
            sPe.innerHTML = '';
            sPer.forEach(p => {
                maps.periodo[p.id] = p.data().nombre;
                sPe.innerHTML += `<option value="${p.id}" ${p.data().estado === 'activo' ? 'selected' : ''}>${p.data().nombre}</option>`;
            });

            loadTable();
        } catch (e) { console.error(e); }
    }

    // Lógica de Etiquetas de Materias
    document.getElementById('btn-add-materia').onclick = () => {
        const id = document.getElementById('select-materia').value;
        if (id && !materiasSel.includes(id)) {
            materiasSel.push(id);
            renderTags();
        }
    };

    function renderTags() {
        const cont = document.getElementById('materia-tags');
        cont.querySelectorAll('.tag-materia').forEach(t => t.remove());
        document.getElementById('no-materias').style.display = materiasSel.length ? 'none' : 'block';
        materiasSel.forEach(id => {
            const div = document.createElement('div');
            div.className = "tag-materia";
            div.innerHTML = `${maps.materia[id]} <i class="fa-solid fa-xmark cursor-pointer" onclick="removeMateria('${id}')"></i>`;
            cont.appendChild(div);
        });
    }

    window.removeMateria = (id) => {
        materiasSel = materiasSel.filter(m => m !== id);
        renderTags();
    };

    // Pintar Tabla con Nombres Reales
    async function loadTable() {
        const tbody = document.getElementById('tabla-asignaciones');
        const snap = await getDocs(collection(db, "asignaciones"));
        tbody.innerHTML = "";
        document.getElementById('count-asig').innerText = `${snap.size} registros`;

        if (snap.empty) {
            tbody.innerHTML = `<tr><td colspan="5" class="p-10 text-center text-slate-300 italic">No hay asignaciones.</td></tr>`;
            return;
        }

        snap.forEach(docSnap => {
            const d = docSnap.data();
            const tr = document.createElement('tr');
            tr.className = "hover:bg-slate-50 transition-all border-b border-slate-50 group";
            
            const matList = d.materia_id ? d.materia_id.map(m => maps.materia[m] || m).join(', ') : '---';

            tr.innerHTML = `
                <td class="p-4">
                    <div class="font-black text-indigo-950 text-xs uppercase">${maps.docente[d.docente_id] || d.docente_id}</div>
                    ${d.tutor ? '<span class="text-[8px] font-black bg-emerald-100 text-emerald-600 px-2 py-0.5 rounded uppercase">Tutor</span>' : ''}
                </td>
                <td class="p-4 text-center">
                    <div class="font-bold text-slate-600 text-xs">${maps.grado[d.grado_id] || d.grado_id}</div>
                    <div class="text-[9px] font-black text-indigo-400">PARALELO "${d.paralelo_id}"</div>
                </td>
                <td class="p-4">
                    <div class="text-[9px] font-bold text-slate-400 uppercase italic max-w-[200px] truncate">${matList}</div>
                </td>
                <td class="p-4 text-center">
                    <span class="text-[10px] font-black text-slate-500">${maps.periodo[d.periodo_id] || d.periodo_id}</span>
                </td>
                <td class="p-4 text-right">
                    <button onclick="deleteAsig('${docSnap.id}')" class="text-slate-200 hover:text-red-500 transition-all">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Guardar
    document.getElementById('form-asignacion').onsubmit = async (e) => {
        e.preventDefault();
        if(!materiasSel.length) return Swal.fire('Error', 'Debe añadir materias.', 'error');

        const payload = {
            docente_id: document.getElementById('select-docente').value,
            grado_id: document.getElementById('select-grado').value,
            paralelo_id: document.getElementById('select-paralelo').value,
            periodo_id: document.getElementById('select-periodo').value,
            materia_id: materiasSel,
            tutor: document.getElementById('check-tutor').checked,
            updated_at: serverTimestamp()
        };

        try {
            const id = `${payload.docente_id}_${payload.grado_id}_${payload.paralelo_id}`;
            await setDoc(doc(db, "asignaciones", id), payload);
            Swal.fire('Guardado', 'Asignación procesada con éxito.', 'success').then(() => location.reload());
        } catch (e) { Swal.fire('Error', 'Hubo un problema al guardar.', 'error'); }
    };

    window.deleteAsig = async (id) => {
        if((await Swal.fire({title:'¿Eliminar?', showCancelButton:true})).isConfirmed) {
            await deleteDoc(doc(db, "asignaciones", id));
            loadTable();
        }
    };

    loadAll();
</script>
</body>
</html>
