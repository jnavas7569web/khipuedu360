<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Gestión de Asignaciones</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .input-style { background-color: #f8fafc; border: 2px solid #f1f5f9; transition: all 0.3s ease; }
        .input-style:focus { border-color: #6366f1; background-color: #fff; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .tag-materia { background: #e0e7ff; color: #4338ca; padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 10px; display: flex; align-items: center; gap: 5px; text-transform: uppercase; }
        /* Toggle Switch */
        .dot { transition: all 0.3s ease-in-out; }
        input:checked ~ .dot { transform: translateX(100%); background-color: #4f46e5; }
        input:checked ~ .block { background-color: #e0e7ff; }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-7xl mx-auto">
    <header class="flex justify-between items-center mb-10 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
        <div>
            <h1 class="text-3xl font-black text-indigo-950 tracking-tighter italic uppercase">Asignaciones Académicas</h1>
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Khipu Edu 360 • Control Central</p>
        </div>
        <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 rounded-2xl transition-all flex items-center justify-center shadow-sm">
            <i class="fa-solid fa-house text-lg"></i>
        </button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <aside class="lg:col-span-1">
            <div class="glass-card p-8 sticky top-8">
                <h2 id="form-title" class="text-xl font-black text-slate-800 uppercase italic mb-8 flex items-center gap-2">
                    <i class="fa-solid fa-link text-indigo-500"></i> Nueva Vinculación
                </h2>

                <form id="form-asignacion" class="space-y-6">
                    <input type="hidden" id="asig-id">
                    
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Seleccionar Docente</label>
                        <select id="select-docente" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 uppercase appearance-none">
                            <option value="">Cargando lista...</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Grado</label>
                            <select id="select-grado" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700">
                                <option value="">Cargando...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Paralelo</label>
                            <select id="select-paralelo" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700">
                                <option value="">Cargando...</option>
                            </select>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100">
                        <label class="block text-[10px] font-black text-indigo-400 uppercase mb-3 ml-1 tracking-widest">Añadir Materias</label>
                        <div class="flex gap-2 mb-4">
                            <select id="select-materia" class="flex-1 p-3 input-style rounded-xl font-bold text-slate-700 text-sm">
                                <option value="">Elegir materia...</option>
                            </select>
                            <button type="button" id="btn-add-materia" class="bg-indigo-600 text-white px-4 rounded-xl hover:bg-black transition-all">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                        <div id="materia-tags" class="flex flex-wrap gap-2">
                            <p id="no-materias" class="text-[9px] font-bold text-slate-300 uppercase italic">Ninguna seleccionada</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 items-center">
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Periodo</label>
                            <select id="select-periodo" required class="w-full p-3 input-style rounded-xl font-bold text-slate-700">
                                <option value="">Cargando...</option>
                            </select>
                        </div>
                        <div class="flex flex-col items-center">
                            <label class="text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest">¿Es Tutor?</label>
                            <label for="check-tutor" class="flex items-center cursor-pointer">
                                <div class="relative">
                                    <input type="checkbox" id="check-tutor" class="sr-only">
                                    <div class="block bg-slate-200 w-14 h-8 rounded-full"></div>
                                    <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition shadow-sm"></div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div class="pt-4 flex gap-2">
                        <button type="submit" id="btn-save" class="flex-1 bg-indigo-600 hover:bg-black text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-[0.2em] shadow-xl transition-all active:scale-95">
                            Guardar Asignación <i class="fa-solid fa-floppy-disk ml-2"></i>
                        </button>
                        <button type="button" id="btn-cancel" class="hidden bg-slate-100 text-slate-400 px-6 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:text-red-500 transition-all">X</button>
                    </div>
                </form>
            </div>
        </aside>

        <main class="lg:col-span-2">
            <div class="glass-card p-8 overflow-hidden">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-xl font-black text-slate-800 uppercase italic">Vinculaciones Activas</h2>
                    <div class="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest">
                        Total: <span id="count-asig">0</span>
                    </div>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">
                                <th class="p-4">Docente / Tutoría</th>
                                <th class="p-4 text-center">Grado / Paralelo</th>
                                <th class="p-4">Materias</th>
                                <th class="p-4 text-center">Periodo</th>
                                <th class="p-4 text-right"></th>
                            </tr>
                        </thead>
                        <tbody id="tabla-asignaciones" class="divide-y divide-slate-50">
                            <tr><td colspan="5" class="p-10 text-center font-bold text-slate-300 italic">Cargando datos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, setDoc, deleteDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let listaMateriasSel = [];
    let nombresMaterias = {}; // Mapa para ID -> Nombre

    // --- CARGA DE CATÁLOGOS ---
    async function loadCatalogos() {
        try {
            const [snapDoc, snapGra, snapPar, snapMat, snapPer] = await Promise.all([
                getDocs(query(collection(db, "usuario"), orderBy("nombre"))),
                getDocs(collection(db, "grados")),
                getDocs(collection(db, "paralelos")),
                getDocs(collection(db, "materias")),
                getDocs(collection(db, "periodos_lectivos"))
            ]);

            // Llenar Docentes
            const sD = document.getElementById('select-docente');
            sD.innerHTML = '<option value="">Elegir Docente</option>';
            snapDoc.forEach(d => sD.innerHTML += `<option value="${d.id}">${d.data().nombre} ${d.data().apellido || ''}</option>`);

            // Llenar Grados
            const sG = document.getElementById('select-grado');
            sG.innerHTML = '<option value="">Elegir</option>';
            snapGra.forEach(g => sG.innerHTML += `<option value="${g.id}">${g.data().nombre}</option>`);

            // Llenar Paralelos
            const sP = document.getElementById('select-paralelo');
            sP.innerHTML = '<option value="">-</option>';
            snapPar.forEach(p => sP.innerHTML += `<option value="${p.id}">${p.id}</option>`);

            // Llenar Materias y crear Mapa
            const sM = document.getElementById('select-materia');
            sM.innerHTML = '<option value="">Seleccionar...</option>';
            snapMat.forEach(m => {
                nombresMaterias[m.id] = m.data().nombre;
                sM.innerHTML += `<option value="${m.id}">${m.data().nombre}</option>`;
            });

            // Llenar Periodos
            const sPer = document.getElementById('select-periodo');
            sPer.innerHTML = '';
            snapPer.forEach(per => sPer.innerHTML += `<option value="${per.id}" ${per.data().estado === 'activo' ? 'selected' : ''}>${per.data().nombre}</option>`);

            loadTable();
        } catch (e) { console.error(e); }
    }

    // --- MANEJO DE ETIQUETAS DE MATERIAS ---
    document.getElementById('btn-add-materia').onclick = () => {
        const sel = document.getElementById('select-materia');
        const id = sel.value;
        if (id && !listaMateriasSel.includes(id)) {
            listaMateriasSel.push(id);
            renderTags();
        }
    };

    function renderTags() {
        const cont = document.getElementById('materia-tags');
        document.getElementById('no-materias').style.display = listaMateriasSel.length > 0 ? 'none' : 'block';
        cont.querySelectorAll('.tag-materia').forEach(t => t.remove());
        listaMateriasSel.forEach(id => {
            const div = document.createElement('div');
            div.className = "tag-materia";
            div.innerHTML = `<span>${nombresMaterias[id]}</span><i class="fa-solid fa-xmark cursor-pointer" onclick="removeTag('${id}')"></i>`;
            cont.appendChild(div);
        });
    }

    window.removeTag = (id) => {
        listaMateriasSel = listaMateriasSel.filter(m => m !== id);
        renderTags();
    };

    // --- CARGAR TABLA ---
    async function loadTable() {
        const tbody = document.getElementById('tabla-asignaciones');
        const snap = await getDocs(collection(db, "asignaciones"));
        tbody.innerHTML = "";
        document.getElementById('count-asig').innerText = snap.size;

        if(snap.empty) {
            tbody.innerHTML = `<tr><td colspan="5" class="p-10 text-center font-bold text-slate-300 italic">No hay asignaciones.</td></tr>`;
            return;
        }

        snap.forEach(docSnap => {
            const d = docSnap.data();
            const materiasTxt = d.materia_id ? d.materia_id.map(id => nombresMaterias[id] || id).join(', ') : '---';
            const tr = document.createElement('tr');
            tr.className = "hover:bg-slate-50 transition-all group";
            tr.innerHTML = `
                <td class="p-4">
                    <div class="font-black text-indigo-950 text-sm uppercase">${d.docente_id}</div>
                    ${d.tutor ? '<span class="text-[9px] font-black bg-emerald-100 text-emerald-600 px-2 py-0.5 rounded tracking-widest">DOCENTE TUTOR</span>' : ''}
                </td>
                <td class="p-4 text-center">
                    <span class="font-bold text-slate-600">${d.grado_id} "${d.paralelo_id}"</span>
                </td>
                <td class="p-4">
                    <div class="text-[10px] font-bold text-slate-400 uppercase leading-tight max-w-[200px] truncate">${materiasTxt}</div>
                </td>
                <td class="p-4 text-center font-mono text-xs font-bold text-slate-400">${d.periodo_id}</td>
                <td class="p-4 text-right">
                    <button onclick="deleteAsig('${docSnap.id}')" class="text-slate-200 hover:text-red-500 transition-all opacity-0 group-hover:opacity-100">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // --- GUARDAR ---
    document.getElementById('form-asignacion').onsubmit = async (e) => {
        e.preventDefault();
        if(listaMateriasSel.length === 0) return Swal.fire('Error', 'Seleccione al menos una materia.', 'error');

        const btn = document.getElementById('btn-save');
        btn.disabled = true;

        const payload = {
            docente_id: document.getElementById('select-docente').value,
            grado_id: document.getElementById('select-grado').value,
            paralelo_id: document.getElementById('select-paralelo').value,
            materia_id: listaMateriasSel, // ARRAY como en tu requerimiento
            periodo_id: document.getElementById('select-periodo').value,
            tutor: document.getElementById('check-tutor').checked,
            activa: true,
            updated_at: serverTimestamp()
        };

        try {
            // Generar ID único basado en docente y curso
            const customID = `${payload.docente_id}_${payload.grado_id}_${payload.paralelo_id}`;
            await setDoc(doc(db, "asignaciones", customID), payload);
            
            Swal.fire('¡Éxito!', 'Vinculación académica guardada.', 'success').then(() => location.reload());
        } catch (err) {
            btn.disabled = false;
            Swal.fire('Error', 'No se pudo guardar la asignación.', 'error');
        }
    };

    window.deleteAsig = async (id) => {
        const res = await Swal.fire({ title: '¿Eliminar?', text: 'Se perderá el vínculo docente-curso.', icon: 'warning', showCancelButton: true });
        if(res.isConfirmed) {
            await deleteDoc(doc(db, "asignaciones", id));
            loadTable();
        }
    };

    loadCatalogos();
</script>
</body>
</html>
