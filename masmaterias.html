<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Gestión de Materias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .input-style { background-color: #f8fafc; border: 2px solid #f1f5f9; transition: all 0.3s ease; }
        .input-style:focus { border-color: #6366f1; background-color: #fff; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
            <div>
                <h1 class="text-3xl font-black text-indigo-950 tracking-tighter italic uppercase">Materias</h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Configuración Curricular</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 rounded-2xl transition-all flex items-center justify-center">
                <i class="fa-solid fa-house"></i>
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1">
                <section class="glass-card p-6 sticky top-8">
                    <h2 class="font-black text-indigo-900 uppercase text-xs mb-6 flex items-center">
                        <i class="fa-solid fa-plus-circle mr-2 text-lg"></i> Nueva Materia
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase ml-2 mb-1">Nombre de Materia</label>
                            <input type="text" id="materia-nombre" class="w-full p-4 rounded-2xl input-style font-bold text-slate-700 outline-none uppercase" placeholder="Ej: Matemática">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase ml-2 mb-1">Área Académica</label>
                            <select id="materia-area" class="w-full p-4 rounded-2xl input-style font-bold text-slate-700 outline-none">
                                <option value="TRONCAL">TRONCAL (BÁSICA)</option>
                                <option value="ESPECIAL">ESPECIAL / TÉCNICA</option>
                                <option value="PROYECTO">PROYECTO ESCOLAR</option>
                                <option value="OTRA">OTRA</option>
                            </select>
                        </div>
                        <button onclick="guardarMateria()" class="w-full bg-indigo-600 text-white p-4 rounded-2xl font-black uppercase text-xs hover:bg-black transition-all shadow-lg shadow-indigo-200">
                            Guardar Materia
                        </button>
                    </div>
                </section>
            </div>

            <div class="lg:col-span-2">
                <section class="glass-card p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="font-black text-indigo-900 uppercase text-xs">Materias Registradas</h2>
                        <span id="contador-materias" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-[10px] font-black">0 TOTAL</span>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="text-left border-b border-slate-50">
                                    <th class="pb-4 text-[10px] font-black text-slate-400 uppercase px-2">Nombre</th>
                                    <th class="pb-4 text-[10px] font-black text-slate-400 uppercase px-2">Área</th>
                                    <th class="pb-4 text-[10px] font-black text-slate-400 uppercase px-2 text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-materias" class="divide-y divide-slate-50">
                                </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // GUARDAR MATERIA
    window.guardarMateria = async () => {
        const nombre = document.getElementById('materia-nombre').value.trim().toUpperCase();
        const area = document.getElementById('materia-area').value;

        if(!nombre) return Swal.fire('Error', 'Escriba el nombre de la materia', 'error');

        try {
            await addDoc(collection(db, "materias"), {
                nombre,
                area,
                estado: true,
                fecha_creacion: new Date()
            });
            document.getElementById('materia-nombre').value = "";
            Swal.fire('¡Éxito!', 'Materia registrada correctamente', 'success');
            cargarMaterias();
        } catch (e) {
            console.error(e);
            Swal.fire('Error', 'No se pudo guardar', 'error');
        }
    };

    // CARGAR MATERIAS
    window.cargarMaterias = async () => {
        const tbody = document.getElementById('tabla-materias');
        tbody.innerHTML = '<tr><td colspan="3" class="py-10 text-center animate-pulse font-black text-slate-300 text-xs">CARGANDO MATERIAS...</td></tr>';
        
        try {
            const q = query(collection(db, "materias"), orderBy("nombre", "asc"));
            const snap = await getDocs(q);
            tbody.innerHTML = "";
            
            document.getElementById('contador-materias').innerText = `${snap.size} TOTAL`;

            snap.forEach(docSnap => {
                const mat = docSnap.data();
                const id = docSnap.id;
                
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="py-4 px-2 font-bold text-slate-700 text-sm">${mat.nombre}</td>
                        <td class="py-4 px-2 text-[10px] font-black text-indigo-500 uppercase">${mat.area}</td>
                        <td class="py-4 px-2 text-center">
                            <button onclick="eliminarMateria('${id}')" class="text-slate-300 hover:text-red-500 transition-all mx-2">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        } catch (e) {
            console.error(e);
        }
    };

    // ELIMINAR MATERIA
    window.eliminarMateria = async (id) => {
        const result = await Swal.fire({
            title: '¿Eliminar materia?',
            text: "Esta acción no se puede deshacer.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#6366f1',
            confirmButtonText: 'Sí, eliminar',
            cancelButtonText: 'Cancelar'
        });

        if (result.isConfirmed) {
            await deleteDoc(doc(db, "materias", id));
            cargarMaterias();
        }
    };

    // Inicializar
    cargarMaterias();
</script>
</body>
</html>
