<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Gestión de Materias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .input-style { background-color: #f8fafc; border: 2px solid #f1f5f9; transition: all 0.3s ease; }
        .input-style:focus { border-color: #6366f1; background-color: #fff; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .dot { transition: all 0.3s ease-in-out; }
        input:checked ~ .dot { transform: translateX(100%); background-color: #10b981; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-10 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
            <div>
                <h1 class="text-3xl font-black text-indigo-950 tracking-tighter italic uppercase">Catálogo de Materias</h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Khipu Edu 360 • Configuración Académica</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 rounded-2xl transition-all flex items-center justify-center">
                <i class="fa-solid fa-house"></i>
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <aside class="lg:col-span-1">
                <div class="glass-card p-8 sticky top-8">
                    <h2 id="form-title" class="text-xl font-black text-slate-800 uppercase italic mb-8">Nueva Materia</h2>
                    
                    <form id="form-materia" class="space-y-6">
                        <input type="hidden" id="materia-id">
                        
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Código (Ej: LEN-001)</label>
                            <input type="text" id="in_codigo" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 uppercase" placeholder="MAT-001">
                        </div>

                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Nombre de la Asignatura</label>
                            <input type="text" id="in_nombre" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 uppercase" placeholder="Matemáticas">
                        </div>

                        <div class="flex items-center justify-between bg-slate-50 p-4 rounded-2xl border border-slate-100">
                            <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest">¿Materia Activa?</span>
                            <label class="flex items-center cursor-pointer">
                                <div class="relative">
                                    <input type="checkbox" id="in_activa" class="sr-only" checked>
                                    <div class="block bg-slate-200 w-14 h-8 rounded-full"></div>
                                    <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition shadow-sm"></div>
                                </div>
                            </label>
                        </div>

                        <div class="pt-4 flex gap-2">
                            <button type="submit" id="btn-save" class="flex-1 bg-indigo-600 hover:bg-black text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-[0.2em] shadow-xl transition-all">
                                Guardar Materia <i class="fa-solid fa-save ml-2"></i>
                            </button>
                            <button type="button" id="btn-cancel" onclick="resetForm()" class="hidden bg-slate-100 text-slate-400 px-6 rounded-2xl hover:text-red-500 transition-all font-black">X</button>
                        </div>
                    </form>
                </div>
            </aside>

            <main class="lg:col-span-2">
                <div class="glass-card p-8">
                    <h2 class="text-xl font-black text-slate-800 uppercase italic mb-8">Asignaturas Registradas</h2>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="text-[10px] font-black text-slate-400 uppercase border-b border-slate-100">
                                    <th class="p-4">Código</th>
                                    <th class="p-4">Nombre</th>
                                    <th class="p-4 text-center">Estado</th>
                                    <th class="p-4 text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-materias" class="divide-y divide-slate-50">
                                <tr><td colspan="4" class="p-10 text-center font-bold text-slate-300 italic animate-pulse uppercase text-xs">Cargando catálogo...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- LISTAR MATERIAS (Real-time) ---
    function loadMaterias() {
        const q = query(collection(db, "materias"), orderBy("nombre", "asc"));
        onSnapshot(q, (snapshot) => {
            const tbody = document.getElementById('tabla-materias');
            tbody.innerHTML = "";
            
            if (snapshot.empty) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-slate-300 font-bold italic uppercase text-xs">No hay materias registradas</td></tr>`;
                return;
            }

            snapshot.forEach(docSnap => {
                const m = docSnap.data();
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-all group";
                tr.innerHTML = `
                    <td class="p-4 font-mono text-xs font-bold text-indigo-500">${m.codigo}</td>
                    <td class="p-4 font-black text-slate-700 text-sm uppercase">${m.nombre}</td>
                    <td class="p-4 text-center">
                        <span class="px-3 py-1 rounded-lg text-[9px] font-black uppercase ${m.activa ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'}">
                            ${m.activa ? 'Activa' : 'Inactiva'}
                        </span>
                    </td>
                    <td class="p-4 text-right flex justify-end gap-2">
                        <button onclick="editMateria('${docSnap.id}', '${m.codigo}', '${m.nombre}', ${m.activa})" class="text-slate-300 hover:text-indigo-600 transition-all"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteMateria('${docSnap.id}')" class="text-slate-300 hover:text-red-500 transition-all"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });
    }

    // --- GUARDAR / ACTUALIZAR ---
    document.getElementById('form-materia').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-save');
        const id = document.getElementById('materia-id').value;
        const codigo = document.getElementById('in_codigo').value.trim().toUpperCase();
        
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Procesando...`;

        // Generamos el ID basado en el código si es nueva, o usamos el ID oculto si es edición
        const docID = id || "mat_" + codigo.toLowerCase().replace(/[^a-z0-9]/g, "_");

        const payload = {
            codigo: codigo,
            nombre: document.getElementById('in_nombre').value.trim().toUpperCase(),
            activa: document.getElementById('in_activa').checked
        };

        try {
            await setDoc(doc(db, "materias", docID), payload, { merge: true });
            Swal.fire({ title: '¡Éxito!', text: 'Materia guardada correctamente.', icon: 'success', timer: 1500, showConfirmButton: false });
            resetForm();
        } catch (error) {
            Swal.fire('Error', 'No se pudo guardar: ' + error.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = `Guardar Materia <i class="fa-solid fa-save ml-2"></i>`;
        }
    };

    // --- FUNCIONES GLOBALES ---
    window.editMateria = (id, cod, nom, act) => {
        document.getElementById('form-title').innerText = "Editar Materia";
        document.getElementById('materia-id').value = id;
        document.getElementById('in_codigo').value = cod;
        document.getElementById('in_nombre').value = nom;
        document.getElementById('in_activa').checked = act;
        document.getElementById('btn-cancel').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.resetForm = () => {
        document.getElementById('form-materia').reset();
        document.getElementById('materia-id').value = "";
        document.getElementById('form-title').innerText = "Nueva Materia";
        document.getElementById('btn-cancel').classList.add('hidden');
    };

    window.deleteMateria = async (id) => {
        const res = await Swal.fire({
            title: '¿Eliminar materia?',
            text: "Esta acción no se puede deshacer.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            confirmButtonText: 'Sí, borrar'
        });

        if (res.isConfirmed) {
            await deleteDoc(doc(db, "materias", id));
        }
    };

    loadMaterias();
</script>
</body>
</html>
