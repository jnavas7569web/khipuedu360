<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Matrículas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; opacity: 0; transition: opacity 0.5s ease; }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .input-style { background-color: #f8fafc; border: 2px solid #f1f5f9; transition: all 0.3s ease; }
        .input-style:focus { border-color: #6366f1; background-color: #fff; outline: none; }
        .label-style { font-size: 10px; font-weight: 900; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; display: block; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
            <div>
                <h1 class="text-3xl font-black text-indigo-950 tracking-tighter italic uppercase">Matrículas Oficiales</h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Khipu Edu 360 • Gestión Académica</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 rounded-2xl transition-all flex items-center justify-center">
                <i class="fa-solid fa-house"></i>
            </button>
        </header>

        <form id="form-matricula" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-1 space-y-6">
                <div class="glass-card p-8">
                    <label class="label-style">Cédula Estudiante</label>
                    <div class="relative">
                        <input type="text" id="in_cedula" maxlength="10" required class="w-full p-4 input-style rounded-2xl font-black text-xl text-indigo-600 tracking-widest" placeholder="0000000000">
                        <div id="loader-est" class="hidden absolute right-4 top-4 text-indigo-500"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
                    </div>
                    <p id="msg-estudiante" class="text-[10px] mt-4 font-bold text-slate-400 uppercase leading-tight italic">Valide la cédula para habilitar el registro.</p>
                </div>

                <div class="glass-card p-8 bg-indigo-900 text-white border-none">
                    <label class="label-style text-indigo-300">Periodo Lectivo</label>
                    <select id="in_periodo" required class="w-full p-4 bg-indigo-800 border-none rounded-2xl font-black text-white outline-none">
                        <option value="">Cargando...</option>
                    </select>
                </div>
            </div>

            <div class="md:col-span-2 glass-card p-10">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="md:col-span-2">
                        <label class="label-style">Estudiante Encontrado</label>
                        <input type="text" id="res_nombre" readonly class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold text-slate-500 uppercase">
                    </div>
                    
                    <div>
                        <label class="label-style">Grado</label>
                        <input type="text" id="res_grado_nombre" readonly class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold text-slate-500 uppercase">
                        <input type="hidden" id="id_grado">
                    </div>

                    <div>
                        <label class="label-style">Paralelo</label>
                        <input type="text" id="res_paralelo" readonly class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold text-slate-500 uppercase">
                    </div>

                    <div id="box-docente" class="md:col-span-2 p-6 bg-slate-50 rounded-3xl border border-slate-200 transition-all">
                        <label class="label-style">Docente Asignado</label>
                        <div class="flex items-center gap-4">
                            <div id="docente-icon" class="w-12 h-12 bg-slate-300 rounded-xl flex items-center justify-center text-white text-xl">
                                <i class="fa-solid fa-user-tie"></i>
                            </div>
                            <div>
                                <h4 id="res_docente_nombre" class="font-black text-slate-400 uppercase italic">Esperando validación...</h4>
                                <input type="hidden" id="id_docente">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end mt-10 gap-4">
                    <button type="submit" id="btn-save" disabled class="bg-indigo-600 opacity-50 cursor-not-allowed hover:bg-black text-white px-10 py-5 rounded-2xl font-black uppercase text-[10px] tracking-[0.2em] shadow-xl transition-all">
                        Confirmar Matrícula <i class="fa-solid fa-file-signature ml-2"></i>
                    </button>
                </div>
            </div>
        </form>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, collection, query, where, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // --- SEGURIDAD Y CONTROL DE ACCESO ---
    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "index.html"; }
        else {
            const userDoc = await getDoc(doc(db, "usuario", user.uid));
            const userData = userDoc.data();
            if (userData && (userData.rol === 'admin' || userData.rol === 'docente')) {
                document.body.style.opacity = "1";
                loadPeriodos();
            } else {
                Swal.fire('Acceso Denegado', 'No tienes permisos para matricular.', 'error')
                .then(() => window.location.href = "dashboard.html");
            }
        }
    });

    // --- CARGA DE PERIODOS (CORREGIDO) ---
    async function loadPeriodos() {
        try {
            const snap = await getDocs(collection(db, "periodos"));
            const sel = document.getElementById('in_periodo');
            sel.innerHTML = '<option value="">Seleccione Periodo</option>';
            snap.forEach(d => {
                const p = d.data();
                // Usamos p.nombre que es donde guardas "2026-2027"
                sel.innerHTML += `<option value="${d.id}">${p.nombre || d.id}</option>`;
            });
        } catch (e) { console.error("Error cargando periodos:", e); }
    }

    // --- BÚSQUEDA ESTRICTA ---
    document.getElementById('in_cedula').addEventListener('input', async (e) => {
        const ced = e.target.value;
        const btn = document.getElementById('btn-save');
        const boxDoc = document.getElementById('box-docente');
        const resDoc = document.getElementById('res_docente_nombre');
        const iconDoc = document.getElementById('docente-icon');

        if (ced.length === 10) {
            document.getElementById('loader-est').classList.remove('hidden');
            const eSnap = await getDoc(doc(db, "estudiantes", ced));
            
            if (eSnap.exists()) {
                const est = eSnap.data();
                document.getElementById('res_nombre').value = `${est.nombres} ${est.apellidos}`;
                document.getElementById('res_paralelo').value = est.paralelo;
                document.getElementById('id_grado').value = est.grado;
                
                const gSnap = await getDoc(doc(db, "grados", est.grado));
                document.getElementById('res_grado_nombre').value = gSnap.exists() ? gSnap.data().nombre : est.grado;

                // VALIDAR ASIGNACIÓN (MODO ESTRICTO)
                const qAsig = query(collection(db, "asignaciones"), 
                    where("grado_id", "==", est.grado), 
                    where("paralelo_id", "==", est.paralelo));
                
                const asigSnap = await getDocs(qAsig);

                if (!asigSnap.empty) {
                    const asig = asigSnap.docs[0].data();
                    document.getElementById('id_docente').value = asig.docente_id;
                    const dSnap = await getDoc(doc(db, "usuario", asig.docente_id));
                    
                    resDoc.innerText = dSnap.exists() ? dSnap.data().nombre : "DOCENTE ASIGNADO";
                    resDoc.classList.replace('text-slate-400', 'text-emerald-700');
                    boxDoc.classList.replace('bg-slate-50', 'bg-emerald-50');
                    iconDoc.classList.replace('bg-slate-300', 'bg-emerald-600');
                    
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                } else {
                    resDoc.innerText = "SIN DOCENTE ASIGNADO";
                    resDoc.classList.replace('text-slate-400', 'text-red-600');
                    boxDoc.classList.replace('bg-slate-50', 'bg-red-50');
                    iconDoc.classList.replace('bg-slate-300', 'bg-red-600');
                    btn.disabled = true;
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                    Swal.fire('Atención', 'No existe docente asignado para este grado/paralelo.', 'warning');
                }
            } else {
                Swal.fire('Error', 'Estudiante no encontrado.', 'error');
            }
            document.getElementById('loader-est').classList.add('hidden');
        }
    });

    // --- GUARDAR MATRÍCULA ---
    document.getElementById('form-matricula').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-save');
        btn.disabled = true;

        const data = {
            estudiante_id: document.getElementById('in_cedula').value,
            id_docente: document.getElementById('id_docente').value,
            grado_id: document.getElementById('id_grado').value,
            paralelo_id: document.getElementById('res_paralelo').value,
            periodo_id: document.getElementById('in_periodo').value,
            fecha_matricula: serverTimestamp(),
            estado: "activa"
        };

        try {
            const mId = `${data.estudiante_id}_${data.periodo_id}`;
            await setDoc(doc(db, "matriculas", mId), data);
            Swal.fire('Éxito', 'Matrícula registrada correctamente.', 'success').then(() => location.reload());
        } catch (err) {
            Swal.fire('Error', 'No se pudo guardar.', 'error');
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
