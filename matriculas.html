<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Matrículas Oficiales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; opacity: 0; transition: opacity 0.5s ease; }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .input-style { background-color: #f8fafc; border: 2px solid #f1f5f9; transition: all 0.3s ease; font-weight: 700; }
        .input-style:focus { border-color: #6366f1; background-color: #fff; outline: none; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        .label-style { font-size: 10px; font-weight: 900; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; display: block; }
        .badge-periodo { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
            <div>
                <h1 class="text-3xl font-black text-indigo-950 tracking-tighter italic uppercase">Proceso de Matrícula</h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Khipu Edu 360 • Gestión Académica</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 rounded-2xl transition-all flex items-center justify-center">
                <i class="fa-solid fa-house"></i>
            </button>
        </header>

        <form id="form-matricula" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-6">
                <div class="glass-card p-8 text-center md:text-left">
                    <label class="label-style">Cédula del Estudiante</label>
                    <div class="relative">
                        <input type="text" id="in_cedula" maxlength="10" required 
                            class="w-full p-5 input-style rounded-2xl font-black text-2xl text-indigo-600 tracking-widest outline-none text-center" placeholder="0000000000">
                        <div id="loader-est" class="hidden absolute right-4 top-5 text-indigo-500">
                            <i class="fa-solid fa-circle-notch fa-spin text-xl"></i>
                        </div>
                    </div>
                    <p id="msg-estudiante" class="text-[10px] mt-4 font-bold text-slate-400 uppercase leading-tight italic">Validación de identidad necesaria.</p>
                </div>

                <div class="glass-card p-8 bg-indigo-900 text-white border-none shadow-indigo-200 shadow-2xl relative overflow-hidden">
                    <div class="relative z-10">
                        <label class="label-style text-indigo-300">Periodo Lectivo Activo</label>
                        <div id="periodo_display" class="text-4xl font-black tracking-tighter italic">---</div>
                        <input type="hidden" id="in_periodo">
                        <div class="mt-4 inline-block px-3 py-1 rounded-full badge-periodo text-[9px] font-bold uppercase tracking-widest">
                            Sincronizado <i class="fa-solid fa-cloud-check ml-1"></i>
                        </div>
                    </div>
                    <i class="fa-solid fa-calendar-check absolute -right-4 -bottom-4 text-8xl text-white/5"></i>
                </div>
            </div>

            <div class="lg:col-span-8 glass-card p-10">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    
                    <div class="md:col-span-2">
                        <label class="label-style">Nombres del Estudiante</label>
                        <input type="text" id="res_nombre" readonly class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-black text-slate-600 uppercase tracking-tight">
                    </div>

                    <div class="md:col-span-2 p-6 bg-blue-50 rounded-3xl border border-blue-100">
                        <label class="label-style text-blue-700">Representante Legal</label>
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-blue-500 rounded-xl flex items-center justify-center text-white">
                                <i class="fa-solid fa-user-group"></i>
                            </div>
                            <input type="text" id="res_repre" readonly class="w-full bg-transparent border-none font-black text-blue-900 uppercase p-0 focus:ring-0" value="---">
                            <input type="hidden" id="id_repre">
                        </div>
                    </div>

                    <div>
                        <label class="label-style">Grado Destino</label>
                        <select id="id_grado" required class="w-full p-4 input-style rounded-2xl outline-none appearance-none">
                            <option value="">Cargando grados...</option>
                        </select>
                    </div>

                    <div>
                        <label class="label-style">Paralelo Destino</label>
                        <select id="res_paralelo" required class="w-full p-4 input-style rounded-2xl outline-none appearance-none">
                            <option value="">Seleccione Paralelo</option>
                        </select>
                    </div>

                    <div id="box-docente" class="md:col-span-2 p-6 bg-slate-50 rounded-3xl border border-slate-200 transition-all">
                        <label class="label-style">Docente Responsable (Tutoría)</label>
                        <div class="flex items-center gap-4">
                            <div id="docente-icon" class="w-12 h-12 bg-slate-300 rounded-xl flex items-center justify-center text-white text-xl transition-colors">
                                <i class="fa-solid fa-chalkboard-user"></i>
                            </div>
                            <div>
                                <h4 id="res_docente_nombre" class="font-black text-slate-400 uppercase italic">Esperando selección de curso...</h4>
                                <input type="hidden" id="id_docente">
                                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">Asignación detectada en tiempo real</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end mt-12 gap-4 items-center">
                    <button type="button" onclick="location.reload()" class="text-[10px] font-black uppercase text-slate-400 hover:text-red-500 transition-all">Limpiar Formulario</button>
                    <button type="submit" id="btn-save" disabled class="bg-indigo-600 opacity-50 cursor-not-allowed hover:bg-black text-white px-12 py-5 rounded-2xl font-black uppercase text-[11px] tracking-[0.2em] shadow-2xl transition-all active:scale-95">
                        Confirmar Matrícula <i class="fa-solid fa-file-circle-check ml-2"></i>
                    </button>
                </div>
            </div>
        </form>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, collection, query, where, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "index.html"; }
        else {
            const userDoc = await getDoc(doc(db, "usuario", user.uid));
            const uData = userDoc.data();
            if (uData && (uData.rol === 'admin' || uData.rol === 'docente')) {
                document.body.style.opacity = "1";
                inicializarPagina();
            } else {
                window.location.href = "dashboard.html";
            }
        }
    });

    async function inicializarPagina() {
        await cargarListas();
        await detectarPeriodoActivo();
    }

    async function cargarListas() {
        const gSnap = await getDocs(collection(db, "grados"));
        const selG = document.getElementById('id_grado');
        selG.innerHTML = '<option value="">Elegir Grado</option>';
        gSnap.forEach(d => selG.innerHTML += `<option value="${d.id}">${d.data().nombre}</option>`);

        const pSnap = await getDocs(collection(db, "paralelos"));
        const selP = document.getElementById('res_paralelo');
        selP.innerHTML = '<option value="">Seleccione Paralelo</option>';
        pSnap.forEach(d => selP.innerHTML += `<option value="${d.id}">${d.data().nombre || d.id}</option>`);
    }

    async function detectarPeriodoActivo() {
        const q = query(collection(db, "periodos_lectivos"), where("estado", "==", "activo"));
        const snap = await getDocs(q);
        if (!snap.empty) {
            document.getElementById('periodo_display').innerText = snap.docs[0].data().nombre;
            document.getElementById('in_periodo').value = snap.docs[0].id;
        }
    }

    document.getElementById('in_cedula').addEventListener('input', async (e) => {
        const ced = e.target.value;
        if (ced.length === 10) {
            document.getElementById('loader-est').classList.remove('hidden');
            const eSnap = await getDoc(doc(db, "estudiantes", ced));
            if (eSnap.exists()) {
                const est = eSnap.data();
                document.getElementById('res_nombre').value = `${est.nombres} ${est.apellidos}`;
                document.getElementById('id_grado').value = est.grado;
                document.getElementById('res_paralelo').value = est.paralelo;
                document.getElementById('id_repre').value = est.representante_id;

                if(est.representante_id) {
                    const rSnap = await getDoc(doc(db, "representantes", est.representante_id));
                    if(rSnap.exists()){
                        const rData = rSnap.data();
                        // CORRECCIÓN: Usar campo nombre_completo que trae Nombres + Apellidos
                        document.getElementById('res_repre').value = rData.nombre_completo || `${rData.nombres} ${rData.apellidos}`;
                    } else {
                        document.getElementById('res_repre').value = "REPRESENTANTE NO ENCONTRADO";
                    }
                }
                validarAsignacionDinamica();
            } else {
                Swal.fire('Error', 'Estudiante no registrado.', 'error');
            }
            document.getElementById('loader-est').classList.add('hidden');
        }
    });

    async function validarAsignacionDinamica() {
        const grado = document.getElementById('id_grado').value;
        const paralelo = document.getElementById('res_paralelo').value;
        const resDoc = document.getElementById('res_docente_nombre');
        const boxDoc = document.getElementById('box-docente');
        const btn = document.getElementById('btn-save');

        if (grado && paralelo) {
            const qAsig = query(collection(db, "asignaciones"), 
                where("grado_id", "==", grado), 
                where("paralelo_id", "==", paralelo));
            
            const asigSnap = await getDocs(qAsig);

            if (!asigSnap.empty) {
                const asig = asigSnap.docs[0].data();
                const dSnap = await getDoc(doc(db, "usuario", asig.docente_id));
                document.getElementById('id_docente').value = asig.docente_id;
                resDoc.innerText = dSnap.exists() ? dSnap.data().nombre : "DOCENTE ASIGNADO";
                boxDoc.className = "md:col-span-2 p-6 bg-emerald-50 rounded-3xl border border-emerald-100 transition-all";
                resDoc.className = "font-black text-emerald-900 uppercase tracking-tight";
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                resDoc.innerText = "SIN ASIGNACIÓN EN ESTE CURSO";
                boxDoc.className = "md:col-span-2 p-6 bg-red-50 rounded-3xl border border-red-100 transition-all";
                resDoc.className = "font-black text-red-600 uppercase tracking-tight";
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }
    }

    document.getElementById('id_grado').addEventListener('change', validarAsignacionDinamica);
    document.getElementById('res_paralelo').addEventListener('change', validarAsignacionDinamica);

    document.getElementById('form-matricula').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-save');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> PROCESANDO...';

        const pId = document.getElementById('in_periodo').value;
        const ced = document.getElementById('in_cedula').value;

        try {
            await setDoc(doc(db, "matriculas", `${ced}_${pId}`), {
                estudiante_id: ced,
                nombre_estudiante: document.getElementById('res_nombre').value,
                representante_id: document.getElementById('id_repre').value,
                nombre_representante: document.getElementById('res_repre').value,
                grado_id: document.getElementById('id_grado').value,
                paralelo_id: document.getElementById('res_paralelo').value,
                periodo_id: pId,
                docente_id: document.getElementById('id_docente').value,
                fecha_matricula: serverTimestamp(),
                estado: "activa"
            });
            Swal.fire('¡Éxito!', 'Matrícula procesada correctamente.', 'success').then(() => location.reload());
        } catch (err) {
            Swal.fire('Error Critico', 'No se pudo sincronizar la matrícula.', 'error');
            btn.disabled = false;
            btn.innerText = 'Confirmar Matrícula';
        }
    });
</script>
</body>
</html>
