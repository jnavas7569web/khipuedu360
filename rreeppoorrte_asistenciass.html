<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Reporte de Asistencia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        :root { --azul: #1e1b4b; --gris-fondo: #f8fafc; }
        body { background-color: var(--gris-fondo); font-family: 'Inter', sans-serif; font-size: 13px; opacity: 0; transition: opacity 0.5s ease; }
        
        .header-reporte { background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 100%); color: white; }
        .logo-img { width: 80px; height: 80px; object-fit: contain; background: white; border-radius: 1rem; padding: 5px; }
        
        .badge { padding: 3px 8px; border-radius: 6px; font-weight: 900; text-transform: uppercase; font-size: 9px; border: 1.5px solid; display: inline-block; }
        .badge-presente { background: #dcfce7; color: #166534; border-color: #166534; }
        .badge-ausente { background: #fee2e2; color: #991b1b; border-color: #991b1b; }
        .badge-atraso { background: #fef3c7; color: #92400e; border-color: #92400e; }
        .badge-justificado { background: #e0f2fe; color: #075985; border-color: #075985; }
        .badge-vacio { background: #f1f5f9; color: #94a3b8; border-color: #cbd5e1; }

        @media print {
            @page { size: A4; margin: 8mm; }
            .no-print { display: none !important; }
            body { background: white; padding: 0; opacity: 1 !important; }
            .print-card { box-shadow: none !important; border: none !important; width: 100% !important; border-radius: 0 !important; }
            .header-reporte { 
                background: #fff !important; 
                color: #1e1b4b !important; 
                padding: 10px !important; 
                border-bottom: 3px solid #1e1b4b !important;
                -webkit-print-color-adjust: exact; 
            }
            .header-reporte h1 { font-size: 18px !important; color: #1e1b4b !important; }
            .header-reporte p { color: #475569 !important; border: none !important; }
            .logo-img { border: 1px solid #ddd !important; }
            td, th { padding: 6px 10px !important; font-size: 10px !important; border-bottom: 1px solid #e2e8f0 !important; }
        }
    </style>
</head>
<body class="p-2 md:p-6">

<div class="max-w-6xl mx-auto bg-white rounded-[2rem] shadow-2xl overflow-hidden border print-card text-slate-700">
    <div class="header-reporte p-6 md:p-8 flex flex-col md:flex-row items-center justify-between gap-6">
        <div class="flex items-center gap-6 text-center md:text-left">
            <img id="inst-logo" src="" class="logo-img shadow-lg" alt="Logo">
            <div>
                <h1 id="inst-nombre" class="text-xl md:text-3xl font-black tracking-tighter uppercase italic">Cargando Institución...</h1>
                <p class="text-indigo-200 text-[10px] font-bold tracking-[0.3em] uppercase">AMIE: <span id="inst-amie">---</span></p>
            </div>
        </div>
        <div class="text-center md:text-right border-l-0 md:border-l border-white/20 pl-0 md:pl-8">
            <h2 class="text-lg font-black uppercase italic">Reporte de Asistencia</h2>
            <p id="info-filtros" class="text-indigo-100 text-[10px] font-bold mt-1 uppercase tracking-widest">SISTEMA KHIPU EDU 360</p>
        </div>
    </div>

    <div class="p-6 bg-gray-50 border-b no-print">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-1 uppercase tracking-widest">Seleccionar Curso / Sección:</label>
                <select id="select-curso" class="w-full p-3 bg-white border-2 border-gray-200 rounded-xl font-black text-gray-700 text-xs outline-none focus:border-indigo-500 transition-all uppercase">
                    <option value="">Cargando opciones...</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-1 uppercase tracking-widest">Desde:</label>
                <input type="date" id="f-desde" class="w-full p-3 bg-white border-2 border-gray-200 rounded-xl font-black text-gray-700 text-xs">
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-1 uppercase tracking-widest">Hasta:</label>
                <input type="date" id="f-hasta" class="w-full p-3 bg-white border-2 border-gray-200 rounded-xl font-black text-gray-700 text-xs">
            </div>
            <button id="btn-procesar" class="bg-indigo-600 hover:bg-black text-white font-black py-4 rounded-xl text-[10px] uppercase shadow-lg transition-all active:scale-95">
                <i class="fa-solid fa-magnifying-glass mr-2"></i> Generar Reporte
            </button>
        </div>
    </div>

    <div class="p-4 md:p-8">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr id="cabecera-dinamica" class="text-indigo-900 font-black uppercase text-[10px] tracking-widest border-b-2 border-indigo-100">
                        <th class="px-4 py-3">Estudiante</th>
                    </tr>
                </thead>
                <tbody id="tabla-pro" class="divide-y divide-gray-100">
                    <tr><td class="text-center py-20 text-gray-300 italic text-lg font-bold uppercase">Configure los parámetros superiores.</td></tr>
                </tbody>
            </table>
        </div>

        <div id="footer-reporte" class="mt-8 hidden flex flex-col md:flex-row justify-between items-end border-t pt-6 border-gray-100 gap-8">
            <div class="text-center md:text-left w-full md:w-auto">
                <div class="w-48 border-t-2 border-indigo-900 mx-auto md:mx-0 mb-2"></div>
                <p class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Docente Tutor / Responsable</p>
                <h4 id="nombre-tutor" class="text-md font-black text-indigo-900 uppercase italic">Buscando...</h4>
            </div>
            <div class="text-right w-full md:w-auto">
                <p class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Total Alumnos</p>
                <h4 id="total-est" class="text-3xl font-black text-indigo-900 italic">0</h4>
            </div>
        </div>

        <div class="mt-12 flex justify-between items-center no-print">
            <a href="dashboard.html" class="text-gray-400 hover:text-indigo-600 font-black text-[10px] uppercase tracking-widest transition-colors">
                <i class="fa-solid fa-house mr-2"></i> Volver al Inicio
            </a>
            <button onclick="window.print()" class="bg-indigo-950 hover:bg-black text-white px-10 py-5 rounded-2xl font-black uppercase text-[11px] tracking-widest shadow-2xl transition-all active:scale-95">
                <i class="fa-solid fa-print mr-3"></i> Imprimir Reporte (A4)
            </button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, collection, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const cacheMaps = { grados: {}, paralelos: {}, jornadas: {} };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.body.style.opacity = "1";
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('f-desde').value = hoy;
            document.getElementById('f-hasta').value = hoy;
            await cargarInfoInstitucion();
            await cargarDiccionarios();
            await cargarOpciones(user.uid);
        } else { window.location.href = "index.html"; }
    });

    async function cargarInfoInstitucion() {
        const d = await getDoc(doc(db, "institucion", "datos_generales"));
        if(d.exists()) {
            const data = d.data();
            document.getElementById('inst-nombre').innerText = data.nombre.toUpperCase();
            document.getElementById('inst-amie').innerText = data.amie.toUpperCase();
            document.getElementById('inst-logo').src = data.logo_url;
        }
    }

    async function cargarDiccionarios() {
        const [gS, pS, jS] = await Promise.all([
            getDocs(collection(db, "grados")),
            getDocs(collection(db, "paralelos")),
            getDocs(collection(db, "jornadas"))
        ]);
        gS.forEach(d => cacheMaps.grados[d.id] = d.data().nombre.toUpperCase());
        pS.forEach(d => cacheMaps.paralelos[d.id] = d.data().nombre.toUpperCase());
        jS.forEach(d => cacheMaps.jornadas[d.id] = d.data().nombre.toUpperCase());
    }

    async function cargarOpciones(uid) {
        const userDoc = await getDoc(doc(db, "usuario", uid));
        const isAdmin = userDoc.data().rol === "admin";
        const select = document.getElementById('select-curso');
        
        const qAsig = isAdmin ? 
            query(collection(db, "asignaciones")) :
            query(collection(db, "asignaciones"), where("docente_id", "==", uid));

        const snapAsig = await getDocs(qAsig);
        select.innerHTML = '<option value="">ELEGIR CURSO / SECCIÓN</option>';

        snapAsig.forEach(docSnap => {
            const data = docSnap.data();
            const gradoNom = cacheMaps.grados[data.grado_id] || data.grado_id;
            // Guardamos ID_GRADO|NOMBRE_PARALELO|NOMBRE_JORNADA (Para cruzar con estudiantes)
            const val = `${data.grado_id}|${data.paralelo_id}|${data.jornada}`;
            select.innerHTML += `<option value="${val}">${gradoNom} - ${data.paralelo_id} (${data.jornada})</option>`;
        });
    }

    document.getElementById('btn-procesar').addEventListener('click', async () => {
        const cursoVal = document.getElementById('select-curso').value;
        const dStr = document.getElementById('f-desde').value;
        const hStr = document.getElementById('f-hasta').value;
        if(!cursoVal) return Swal.fire('Atención', 'Seleccione un curso.', 'info');

        const [gID, pNom, jNom] = cursoVal.split('|');
        const esMismoDia = (dStr === hStr);
        const btn = document.getElementById('btn-procesar');
        btn.disabled = true;

        try {
            // 1. CARGA ESTUDIANTES QUE COINCIDAN (Foto 2bcdd3 y 2bcd77)
            const snapE = await getDocs(collection(db, "estudiantes"));
            let estudiantes = [];
            snapE.forEach(d => {
                const e = d.data();
                const estParalelo = cacheMaps.paralelos[e.paralelo] || e.paralelo;
                const estJornada = cacheMaps.jornadas[e.jornada] || e.jornada;
                
                if(e.grado === gID && estParalelo === pNom && estJornada === jNom) {
                    estudiantes.push({ id: d.id, ...e });
                }
            });
            estudiantes.sort((a, b) => a.apellidos.localeCompare(b.apellidos));

            // 2. CARGA ASISTENCIAS EN EL RANGO
            const qA = query(collection(db, "asistencias"), where("fecha", ">=", dStr), where("fecha", "<=", hStr));
            const snapA = await getDocs(qA);
            const todasAsis = snapA.docs.map(d => d.data());

            // 3. BUSCAR TUTOR (Foto 2bcdf7)
            const qT = query(collection(db, "asignaciones"), 
                             where("grado_id", "==", gID), 
                             where("paralelo_id", "==", pNom), 
                             where("jornada", "==", jNom),
                             where("tutor", "==", true));
            const snapT = await getDocs(qT);
            if (!snapT.empty) {
                const uDoc = await getDoc(doc(db, "usuario", snapT.docs[0].data().docente_id));
                document.getElementById('nombre-tutor').innerText = uDoc.exists() ? uDoc.data().nombre : "SIN TUTOR ASIGNADO";
            }

            // RENDERIZAR TABLA
            const tbody = document.getElementById('tabla-pro');
            const cab = document.getElementById('cabecera-dinamica');
            tbody.innerHTML = "";
            
            const cabBase = `<th class="px-4 py-3 text-center w-12 text-indigo-300">#</th><th class="px-4 py-3">Estudiante</th><th class="px-4 py-3 text-center">NEE</th>`;
            cab.innerHTML = esMismoDia ? cabBase + `<th class="px-4 py-3 text-right">Estado</th>` : 
                                         cabBase + `<th class="px-4 py-3 text-center text-green-600">P</th><th class="px-4 py-3 text-center text-red-600">F</th><th class="px-4 py-3 text-center text-orange-500">A</th><th class="px-4 py-3 text-center text-blue-500">J</th>`;

            let num = 1;
            estudiantes.forEach(est => {
                const susAsis = todasAsis.filter(a => a.estudiante_id === est.id);
                let c = { presente: 0, ausente: 0, atraso: 0, justificado: 0 };
                let ultimo = "---";

                susAsis.forEach(a => { if(c.hasOwnProperty(a.estado)) c[a.estado]++; ultimo = a.estado; });

                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-50 hover:bg-slate-50";
                const base = `<td class="px-4 py-3 text-center text-gray-300 font-bold">${num++}</td>
                              <td class="px-4 py-3 font-bold uppercase text-[11px]">${est.apellidos} ${est.nombres}</td>
                              <td class="px-4 py-3 text-center font-bold text-gray-400">${est.nee ? 'SÍ' : 'NO'}</td>`;

                if(esMismoDia) {
                    tr.innerHTML = base + `<td class="px-4 py-3 text-right"><span class="badge badge-${ultimo}">${traducir(ultimo)}</span></td>`;
                } else {
                    tr.innerHTML = base + `<td class="px-4 py-3 text-center font-black text-green-600">${c.presente}</td>
                                           <td class="px-4 py-3 text-center font-black text-red-600">${c.ausente}</td>
                                           <td class="px-4 py-3 text-center font-black text-orange-500">${c.atraso}</td>
                                           <td class="px-4 py-3 text-center font-black text-blue-500">${c.justificado}</td>`;
                }
                tbody.appendChild(tr);
            });

            document.getElementById('footer-reporte').classList.remove('hidden');
            document.getElementById('total-est').innerText = estudiantes.length;
            const cursoLabel = document.getElementById('select-curso').options[document.getElementById('select-curso').selectedIndex].text;
            document.getElementById('info-filtros').innerText = `${cursoLabel} | Rango: ${dStr} al ${hStr}`;

        } catch (e) { console.error(e); Swal.fire('Error', 'Falla de conexión.', 'error'); }
        finally { btn.disabled = false; }
    });

    function traducir(v) {
        const m = {"presente":"Presente", "ausente":"Falta", "atraso":"Atraso", "justificado":"Justificado", "---":"N/R"};
        return m[v] || v;
    }
</script>
</body>
</html>
