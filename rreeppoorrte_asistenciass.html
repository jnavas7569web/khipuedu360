<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Reporte de Asistencia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        :root { --azul: #1a237e; --gris-fondo: #f4f7f6; }
        body { background-color: var(--gris-fondo); font-family: 'Inter', sans-serif; font-size: 14px; opacity: 0; transition: opacity 0.5s ease; }
        .header-reporte { background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 100%); color: white; }
        
        .badge { padding: 4px 10px; border-radius: 8px; font-weight: 900; text-transform: uppercase; font-size: 10px; border: 2px solid; display: inline-block; }
        .badge-presente { background: #dcfce7; color: #166534; border-color: #166534; }
        .badge-ausente { background: #fee2e2; color: #991b1b; border-color: #991b1b; }
        .badge-atraso { background: #fef3c7; color: #92400e; border-color: #92400e; }
        .badge-justificado { background: #e0f2fe; color: #075985; border-color: #075985; }

        @media print {
            @page { size: A4; margin: 10mm; }
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .print-card { box-shadow: none !important; border: none !important; width: 100% !important; }
            .header-reporte { background: #1e1b4b !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body class="p-2 md:p-6">

<div class="max-w-6xl mx-auto bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border print-card">
    <div class="header-reporte p-10 text-center">
        <h1 class="text-3xl md:text-5xl font-black tracking-tighter uppercase italic">Reporte de Asistencia</h1>
        <p id="info-filtros" class="text-indigo-100 text-sm md:text-lg font-bold mt-4 uppercase tracking-[0.2em] border-t border-white/20 pt-4 inline-block px-8">
            Seleccione los parámetros para consultar
        </p>
    </div>

    <div class="p-8 bg-gray-50 border-b no-print">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 items-end">
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest">Curso / Paralelo:</label>
                <select id="select-curso" class="w-full p-4 bg-white border-2 border-gray-200 rounded-2xl font-black text-gray-700 text-sm outline-none focus:border-indigo-500 transition-all">
                    <option value="">Cargando cursos...</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest">Desde:</label>
                <input type="date" id="f-desde" class="w-full p-4 bg-white border-2 border-gray-200 rounded-2xl font-black text-gray-700 text-sm">
            </div>
            <div>
                <label class="block text-[10px] font-black text-gray-400 mb-2 uppercase tracking-widest">Hasta:</label>
                <input type="date" id="f-hasta" class="w-full p-4 bg-white border-2 border-gray-200 rounded-2xl font-black text-gray-700 text-sm">
            </div>
            <button id="btn-procesar" class="bg-indigo-600 hover:bg-black text-white font-black py-5 rounded-2xl text-xs uppercase shadow-xl transition-all active:scale-95">
                <i class="fa-solid fa-magnifying-glass mr-2"></i> Generar Reporte
            </button>
        </div>
    </div>

    <div class="p-6 md:p-10">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr id="cabecera-dinamica" class="text-indigo-900 font-black uppercase text-[11px] tracking-widest border-b-4 border-indigo-50">
                        <th class="px-6 py-5">Información General</th>
                    </tr>
                </thead>
                <tbody id="tabla-pro" class="divide-y divide-gray-100 text-gray-700">
                    <tr><td class="text-center py-24 text-gray-300 italic text-xl font-bold uppercase tracking-tighter">Use los filtros superiores para cargar la información.</td></tr>
                </tbody>
            </table>
        </div>

        <div id="footer-reporte" class="mt-12 hidden flex flex-col md:flex-row justify-between items-center border-t pt-8 border-gray-100">
            <div class="text-center md:text-left mb-6 md:mb-0">
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Responsable / Tutor</p>
                <h4 id="nombre-tutor" class="text-xl font-black text-indigo-900 uppercase italic">---</h4>
            </div>
            <div class="text-center md:text-right">
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Total Estudiantes</p>
                <h4 id="total-est" class="text-3xl font-black text-indigo-900 italic">0</h4>
            </div>
        </div>

        <div class="mt-12 flex justify-between items-center no-print">
            <a href="dashboard.html" class="text-gray-400 hover:text-indigo-600 font-black text-[11px] uppercase tracking-widest transition-colors">
                <i class="fa-solid fa-circle-arrow-left mr-2"></i> Volver al Dashboard
            </a>
            <button onclick="window.print()" class="bg-slate-900 hover:bg-indigo-600 text-white px-10 py-5 rounded-2xl font-black text-[11px] uppercase shadow-2xl transition-all active:scale-95">
                <i class="fa-solid fa-print mr-2"></i> Imprimir en A4 (PDF)
            </button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.body.style.opacity = "1";
            
            // Fechas por defecto: HOY
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('f-desde').value = hoy;
            document.getElementById('f-hasta').value = hoy;

            // Cargar Cursos según ROL
            const userDoc = await getDoc(doc(db, "usuario", user.uid));
            const userData = userDoc.data();
            const isAdmin = userData.rol === "admin";
            
            const select = document.getElementById('select-curso');
            select.innerHTML = '<option value="">Seleccione Curso...</option>';

            if (isAdmin) {
                // Admin carga todos los cursos (Asignaciones de tutoría)
                const qAsig = query(collection(db, "asignaciones"), where("tutor", "==", true));
                const snapAsig = await getDocs(qAsig);
                snapAsig.forEach(d => {
                    const data = d.data();
                    select.innerHTML += `<option value="${data.grado_id}|${data.paralelo_id}">${data.grado_id} - ${data.paralelo_id}</option>`;
                });
            } else {
                // Docente solo ve donde es TUTOR
                const qAsig = query(collection(db, "asignaciones"), where("docente_id", "==", user.uid), where("tutor", "==", true));
                const snapAsig = await getDocs(qAsig);
                snapAsig.forEach(d => {
                    const data = d.data();
                    select.innerHTML += `<option value="${data.grado_id}|${data.paralelo_id}">${data.grado_id} - ${data.paralelo_id}</option>`;
                });
            }
        } else { window.location.href = "index.html"; }
    });

    document.getElementById('btn-procesar').addEventListener('click', async () => {
        const cursoVal = document.getElementById('select-curso').value;
        const dStr = document.getElementById('f-desde').value;
        const hStr = document.getElementById('f-hasta').value;

        if(!cursoVal || !dStr || !hStr) return Swal.fire('Campos vacíos', 'Por favor complete todos los filtros.', 'warning');

        const [grado_id, paralelo_id] = cursoVal.split('|');
        const esMismoDia = (dStr === hStr);
        const btn = document.getElementById('btn-procesar');

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> PROCESANDO...';

        try {
            // 1. Obtener Estudiantes del curso
            const qE = query(collection(db, "estudiantes"), where("grado", "==", grado_id), where("paralelo", "==", paralelo_id));
            const snapE = await getDocs(qE);
            let estudiantes = [];
            snapE.forEach(d => estudiantes.push({ id: d.id, ...d.data() }));
            estudiantes.sort((a, b) => a.apellidos.localeCompare(b.apellidos));

            // 2. Obtener Asistencias en el rango
            const qA = query(collection(db, "asistencias"), 
                where("grado_id", "==", grado_id), 
                where("paralelo_id", "==", paralelo_id),
                where("fecha", ">=", dStr),
                where("fecha", "<=", hStr)
            );
            const snapA = await getDocs(qA);
            const rawAsis = snapA.docs.map(d => d.data());

            // 3. Obtener nombre del Tutor
            const qT = query(collection(db, "asignaciones"), where("grado_id", "==", grado_id), where("paralelo_id", "==", paralelo_id), where("tutor", "==", true));
            const snapT = await getDocs(qT);
            if (!snapT.empty) {
                const uDoc = await getDoc(doc(db, "usuario", snapT.docs[0].data().docente_id));
                document.getElementById('nombre-tutor').innerText = uDoc.data().nombre;
            }

            // Renderizado de Cabecera
            const cab = document.getElementById('cabecera-dinamica');
            const cabBase = `<th class="px-6 py-5 text-center w-16 text-indigo-300">#</th><th class="px-6 py-5">Apellidos y Nombres</th><th class="px-6 py-5 text-center">NEE</th>`;
            
            if (esMismoDia) {
                cab.innerHTML = cabBase + `<th class="px-6 py-5 text-right">Estado del Día</th>`;
            } else {
                cab.innerHTML = cabBase + `<th class="px-6 py-5 text-center text-green-600">P</th><th class="px-6 py-5 text-center text-red-600">F</th><th class="px-6 py-5 text-center text-orange-500">A</th><th class="px-6 py-5 text-center text-blue-500">J</th>`;
            }

            // Renderizado de Filas
            const tbody = document.getElementById('tabla-pro');
            tbody.innerHTML = "";
            let num = 1;

            estudiantes.forEach(est => {
                const misAsis = rawAsis.filter(a => a.estudiante_id === est.id);
                let c = { presente: 0, ausente: 0, atraso: 0, justificado: 0 };
                let ultimoEstado = "---";

                misAsis.forEach(a => {
                    c[a.estado]++;
                    ultimoEstado = a.estado;
                });

                const tr = document.createElement('tr');
                tr.className = "hover:bg-indigo-50/30 transition-all border-b border-gray-50";
                
                const colEstudiante = `<td class="px-6 py-5 text-center font-black text-gray-300">${num++}</td>
                                       <td class="px-6 py-5 font-black uppercase text-indigo-950 text-sm">${est.apellidos} ${est.nombres}</td>
                                       <td class="px-6 py-5 text-center font-bold text-[10px] text-gray-400">${est.nee ? 'SÍ' : 'NO'}</td>`;

                if (esMismoDia) {
                    tr.innerHTML = colEstudiante + `<td class="px-6 py-5 text-right"><span class="badge badge-${ultimoEstado}">${traducir(ultimoEstado)}</span></td>`;
                } else {
                    tr.innerHTML = colEstudiante + `
                        <td class="px-6 py-5 text-center font-black text-green-600 text-lg">${c.presente}</td>
                        <td class="px-6 py-5 text-center font-black text-red-600 text-lg">${c.ausente}</td>
                        <td class="px-6 py-5 text-center font-black text-orange-500 text-lg">${c.atraso}</td>
                        <td class="px-6 py-5 text-center font-black text-blue-500 text-lg">${c.justificado}</td>`;
                }
                tbody.appendChild(tr);
            });

            // Actualizar Footer - JURYYYYYYYYYYYYYYYYYYYYYYYYYYYYY
            document.getElementById('info-filtros').innerText = `Periodo: ${dStr} al ${hStr} | Paralelo: ${paralelo_id}`;
            document.getElementById('total-est').innerText = estudiantes.length;
            document.getElementById('footer-reporte').classList.remove('hidden');

        } catch (e) { 
            console.error(e); 
            Swal.fire('Error', 'Hubo un problema al procesar los datos.', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-sync mr-2"></i> Generar Reporte';
        }
    });

    function traducir(v) {
        const m = {"presente":"Presente", "ausente":"Falta", "atraso":"Atraso", "justificado":"Justificado", "---":"N/R"};
        return m[v] || v;
    }
</script>
</body>
</html>
