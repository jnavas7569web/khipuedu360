<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Gestión de Representantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .input-style { background-color: #f8fafc; border: 2px solid #f1f5f9; transition: all 0.3s ease; }
        .input-style:focus { border-color: #6366f1; background-color: #fff; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .tag { background: #e0e7ff; color: #4338ca; padding: 4px 10px; border-radius: 8px; font-weight: 800; font-size: 11px; display: flex; align-items: center; gap: 5px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-10 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
            <div>
                <h1 class="text-3xl font-black text-indigo-950 tracking-tighter italic uppercase">Representantes</h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Khipu Edu 360 • Módulo de Familia</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 rounded-2xl transition-all flex items-center justify-center">
                <i class="fa-solid fa-house text-lg"></i>
            </button>
        </header>

        <section class="glass-card p-10">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-2xl font-black text-slate-800 uppercase italic">Registro de Representante</h2>
                <div id="status-repre" class="text-[9px] font-black uppercase px-4 py-2 rounded-xl bg-slate-100 text-slate-400 tracking-widest">Nueva Ficha</div>
            </div>

            <form id="form-representante" class="space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="relative">
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Cédula</label>
                        <input type="text" id="in_cedula" maxlength="10" required class="w-full p-3 input-style rounded-xl font-bold text-slate-700" placeholder="13XXXXXXXX">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Nombres</label>
                        <input type="text" id="in_nombres" required class="w-full p-3 input-style rounded-xl font-bold text-slate-700 uppercase">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Apellidos</label>
                        <input type="text" id="in_apellidos" required class="w-full p-3 input-style rounded-xl font-bold text-slate-700 uppercase">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Parentesco</label>
                        <select id="in_parentesco" required class="w-full p-3 input-style rounded-xl font-bold text-slate-700">
                            <option value="MADRE">MADRE</option>
                            <option value="PADRE">PADRE</option>
                            <option value="ABUELO/A">ABUELO/A</option>
                            <option value="TIO/A">TIO/A</option>
                            <option value="HERMANO/A">HERMANO/A</option>
                            <option value="TUTOR LEGAL">TUTOR LEGAL</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Teléfono de Contacto</label>
                        <input type="text" id="in_telefono" required class="w-full p-3 input-style rounded-xl font-bold text-slate-700" placeholder="09XXXXXXXX">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Correo Electrónico</label>
                        <input type="email" id="in_correo" class="w-full p-3 input-style rounded-xl font-bold text-slate-700">
                    </div>
                </div>

                <div class="bg-indigo-50 p-6 rounded-2xl border border-indigo-100">
                    <h4 class="text-indigo-600 font-black text-[10px] uppercase mb-4 tracking-widest border-b border-indigo-200 pb-2">Estudiantes a Cargo (Hijos/Pupilos)</h4>
                    <div class="flex gap-3 mb-4">
                        <input type="text" id="in_estudiante_cedula" maxlength="10" class="flex-1 p-3 input-style rounded-xl font-bold text-slate-700" placeholder="Cédula del Estudiante">
                        <button type="button" id="btn-add-hijo" class="bg-indigo-600 text-white px-6 rounded-xl font-black text-[10px] uppercase hover:bg-black transition-all">
                            Vincular <i class="fa-solid fa-plus ml-1"></i>
                        </button>
                    </div>
                    <div id="lista-hijos" class="flex flex-wrap gap-2">
                        <p id="no-hijos" class="text-[10px] font-bold text-indigo-300 uppercase italic">No hay estudiantes vinculados aún</p>
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-6">
                    <button type="button" onclick="location.reload()" class="px-8 py-3 font-black uppercase text-[10px] text-slate-400 hover:text-red-500 tracking-widest transition-all">Limpiar</button>
                    <button type="submit" id="btn-save" class="bg-indigo-600 hover:bg-black text-white px-10 py-4 rounded-2xl font-black uppercase text-[10px] tracking-[0.2em] shadow-xl transition-all">
                        Guardar Representante <i class="fa-solid fa-save ml-2"></i>
                    </button>
                </div>
            </form>
        </section>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let estudiantesVinculados = [];

    // Lógica para añadir tags de hijos
    const btnAddHijo = document.getElementById('btn-add-hijo');
    const inputHijo = document.getElementById('in_estudiante_cedula');
    const contenedorHijos = document.getElementById('lista-hijos');

    btnAddHijo.addEventListener('click', () => {
        const ced = inputHijo.value.trim();
        if(ced.length === 10 && !estudiantesVinculados.includes(ced)) {
            estudiantesVinculados.push(ced);
            renderHijos();
            inputHijo.value = "";
        } else {
            Swal.fire('Error', 'Ingrese una cédula válida de 10 dígitos o ya vinculada.', 'error');
        }
    });

    function renderHijos() {
        document.getElementById('no-hijos').style.display = estudiantesVinculados.length > 0 ? 'none' : 'block';
        contenedorHijos.querySelectorAll('.tag').forEach(t => t.remove());
        
        estudiantesVinculados.forEach(ced => {
            const div = document.createElement('div');
            div.className = "tag";
            div.innerHTML = `<span>${ced}</span><i class="fa-solid fa-xmark cursor-pointer hover:text-red-500" onclick="eliminarHijo('${ced}')"></i>`;
            contenedorHijos.appendChild(div);
        });
    }

    window.eliminarHijo = (ced) => {
        estudiantesVinculados = estudiantesVinculados.filter(item => item !== ced);
        renderHijos();
    };

    // Guardar en Firestore
    document.getElementById('form-representante').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if(estudiantesVinculados.length === 0) {
            Swal.fire('Atención', 'Debe vincular al menos a un estudiante (hijo).', 'warning');
            return;
        }

        const btn = document.getElementById('btn-save');
        btn.disabled = true;
        const cedulaRepre = document.getElementById('in_cedula').value;

        const payload = {
            cedula: cedulaRepre,
            nombres: document.getElementById('in_nombres').value.toUpperCase(),
            apellidos: document.getElementById('in_apellidos').value.toUpperCase(),
            nombre_completo: `${document.getElementById('in_nombres').value} ${document.getElementById('in_apellidos').value}`.toUpperCase(),
            parentesco: document.getElementById('in_parentesco').value,
            telefono: document.getElementById('in_telefono').value,
            correo: document.getElementById('in_correo').value,
            estudiantes_ids: estudiantesVinculados, // ARRAY de cédulas
            updated_at: serverTimestamp()
        };

        try {
            await setDoc(doc(db, "representantes", cedulaRepre), payload);
            Swal.fire('Éxito', 'Representante guardado y vinculado correctamente.', 'success').then(() => {
                location.reload();
            });
        } catch (error) {
            console.error(error);
            btn.disabled = false;
            Swal.fire('Error', 'No se pudo guardar la información.', 'error');
        }
    });

    // Cargar datos si ya existe al escribir cédula
    document.getElementById('in_cedula').addEventListener('blur', async (e) => {
        if(e.target.value.length === 10) {
            const docRef = doc(db, "representantes", e.target.value);
            const docSnap = await getDoc(docRef);
            if(docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('in_nombres').value = data.nombres;
                document.getElementById('in_apellidos').value = data.apellidos;
                document.getElementById('in_parentesco').value = data.parentesco;
                document.getElementById('in_telefono').value = data.telefono;
                document.getElementById('in_correo').value = data.correo;
                estudiantesVinculados = data.estudiantes_ids || [];
                renderHijos();
                document.getElementById('status-repre').innerText = "Editando Registro";
                document.getElementById('status-repre').className = "text-[9px] font-black uppercase px-4 py-2 rounded-xl bg-amber-100 text-amber-600 tracking-widest";
            }
        }
    });
</script>
</body>
</html>
