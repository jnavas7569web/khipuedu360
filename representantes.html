<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Gestión de Representantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; opacity: 0; transition: opacity 0.5s ease; }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .input-style { background-color: #ffffff; border: 2px solid #e2e8f0; transition: all 0.3s ease; width: 100%; }
        .input-style:focus { border-color: #1d9bf0; outline: none; box-shadow: 0 0 0 4px rgba(29, 155, 240, 0.1); }
        
        /* ESTÁNDAR VISUAL: Todo a mayúsculas excepto el correo */
        input[type="text"]:not(#in_correo) { text-transform: uppercase; }
        
        .label-style { font-size: 10px; font-weight: 900; color: #1d9bf0; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; display: block; margin-left: 0.25rem; }
        .tag { background: #e0e7ff; color: #4338ca; padding: 6px 12px; border-radius: 12px; font-weight: 800; font-size: 11px; display: flex; align-items: center; gap: 8px; border: 1px solid #c7d2fe; text-transform: uppercase; }
        
        @media (max-width: 640px) {
            .vincular-container { flex-direction: column; }
            .vincular-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-indigo-950 tracking-tighter italic uppercase">Representantes</h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1 text-xs">Khipu Edu 360 • Comunidad Educativa</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 rounded-2xl transition-all flex items-center justify-center">
                <i class="fa-solid fa-house"></i>
            </button>
        </header>

        <section class="glass-card p-6 md:p-10">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
                <h2 class="text-xl md:text-2xl font-black text-slate-800 uppercase italic underline decoration-sky-500 decoration-4 underline-offset-8">Ficha del Representante</h2>
                <div id="status-repre" class="text-[9px] font-black uppercase px-4 py-2 rounded-xl bg-slate-100 text-slate-400 tracking-widest border border-slate-200">Nueva Ficha</div>
            </div>

            <form id="form-representante" class="space-y-8 text-slate-700">
                <div class="bg-slate-50/80 p-6 md:p-8 rounded-[2.5rem] border border-slate-200">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="label-style">Cédula de Identidad</label>
                            <input type="text" id="in_cedula" maxlength="10" required class="p-4 input-style rounded-2xl font-bold" placeholder="13XXXXXXXX">
                        </div>
                        <div>
                            <label class="label-style">Nombres</label>
                            <input type="text" id="in_nombres" required class="p-4 input-style rounded-2xl font-bold">
                        </div>
                        <div>
                            <label class="label-style">Apellidos</label>
                            <input type="text" id="in_apellidos" required class="p-4 input-style rounded-2xl font-bold">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
                        <div>
                            <label class="label-style">Fecha de Nacimiento</label>
                            <input type="date" id="in_nacimiento" required class="p-4 input-style rounded-2xl font-bold">
                        </div>
                        <div>
                            <label class="label-style">Estado Civil</label>
                            <select id="in_estado_civil" required class="p-4 input-style rounded-2xl font-bold appearance-none bg-white">
                                <option value="SOLTERO/A">SOLTERO/A</option>
                                <option value="CASADO/A">CASADO/A</option>
                                <option value="DIVORCIADO/A">DIVORCIADO/A</option>
                                <option value="VIUDO/A">VIUDO/A</option>
                                <option value="UNION LIBRE">UNIÓN LIBRE</option>
                            </select>
                        </div>
                        <div>
                            <label class="label-style">Ocupación / Trabajo</label>
                            <input type="text" id="in_ocupacion" class="p-4 input-style rounded-2xl font-bold" placeholder="EJ: CAJERA">
                        </div>
                    </div>
                </div>

                <div class="bg-sky-50/50 p-6 md:p-8 rounded-[2.5rem] border border-sky-100">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="md:col-span-2">
                            <label class="label-style">Dirección de Domicilio</label>
                            <input type="text" id="in_direccion" required class="p-4 input-style rounded-2xl font-bold" placeholder="CALLE, SECTOR, REFERENCIA">
                        </div>
                        <div>
                            <label class="label-style">Parentesco</label>
                            <select id="in_parentesco" required class="p-4 input-style rounded-2xl font-bold appearance-none bg-white">
                                <option value="MADRE">MADRE</option>
                                <option value="PADRE">PADRE</option>
                                <option value="ABUELO/A">ABUELO/A</option>
                                <option value="TIO/A">TIO/A</option>
                                <option value="HERMANO/A">HERMANO/A</option>
                                <option value="TUTOR LEGAL">TUTOR LEGAL</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                        <div>
                            <label class="label-style">Teléfono Principal</label>
                            <input type="text" id="in_telefono" required class="p-4 input-style rounded-2xl font-bold" placeholder="09XXXXXXXX">
                        </div>
                        <div>
                            <label class="label-style">Correo Electrónico</label>
                            <input type="email" id="in_correo" class="p-4 input-style rounded-2xl font-bold" placeholder="correo@ejemplo.com">
                        </div>
                    </div>
                </div>

                <div class="bg-indigo-50/50 p-6 md:p-8 rounded-[2.5rem] border border-indigo-100">
                    <h4 class="label-style text-indigo-600 mb-4">Estudiantes a Cargo (Hijos/Representados)</h4>
                    <div class="flex flex-col sm:flex-row gap-3 mb-6 vincular-container">
                        <input type="text" id="in_estudiante_cedula" maxlength="10" class="flex-1 p-4 input-style rounded-2xl font-bold" placeholder="Cédula del Estudiante">
                        <button type="button" id="btn-add-hijo" class="vincular-btn bg-indigo-600 text-white px-8 py-4 rounded-2xl font-black text-[10px] uppercase hover:bg-black transition-all shadow-lg flex items-center gap-2">
                            Vincular <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                    <div id="lista-hijos" class="flex flex-wrap gap-3">
                        <p id="no-hijos" class="text-[10px] font-bold text-indigo-300 uppercase italic">No hay estudiantes vinculados aún</p>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row justify-end gap-4 pt-6">
                    <button type="button" onclick="location.reload()" class="px-8 py-4 font-black uppercase text-[10px] text-slate-400 hover:text-red-500 transition-all tracking-widest order-2 md:order-1">Descartar</button>
                    <button type="submit" id="btn-save" class="bg-emerald-600 hover:bg-black text-white px-10 md:px-14 py-5 rounded-[1.5rem] font-black uppercase text-[10px] tracking-[0.2em] shadow-xl shadow-emerald-100 transition-all active:scale-95 order-1 md:order-2">
                        Guardar Representante <i class="fa-solid fa-cloud-arrow-up ml-2"></i>
                    </button>
                </div>
            </form>
        </section>
    </div>

<script type="module">
      ////// AITO DESLOGIGIGNGN
    import "./security-control.js";
    ///////////////////AUTO DESLOOGGGGG
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "index.html"; }
        else {
            const userDoc = await getDoc(doc(db, "usuario", user.uid));
            if (userDoc.exists() && (userDoc.data().rol === 'admin' || userDoc.data().rol === 'docente')) {
                document.body.style.opacity = "1";
            } else {
                window.location.href = "dashboard.html";
            }
        }
    });

    // --- ESTÁNDAR DE DATOS: Convertir inputs a mayúsculas al terminar de escribir ---
    document.querySelectorAll('input[type="text"]').forEach(input => {
        input.addEventListener('blur', function() {
            if(this.id !== 'in_correo') {
                this.value = this.value.toUpperCase().trim();
            } else {
                this.value = this.value.toLowerCase().trim();
            }
        });
    });

    let estudiantesVinculados = [];
    const contenedorHijos = document.getElementById('lista-hijos');

    document.getElementById('btn-add-hijo').addEventListener('click', () => {
        const ced = document.getElementById('in_estudiante_cedula').value.trim();
        if(ced.length === 10 && !estudiantesVinculados.includes(ced)) {
            estudiantesVinculados.push(ced);
            renderHijos();
            document.getElementById('in_estudiante_cedula').value = "";
        } else {
            Swal.fire('Error', 'Cédula no válida o ya vinculada.', 'warning');
        }
    });

    function renderHijos() {
        document.getElementById('no-hijos').style.display = estudiantesVinculados.length > 0 ? 'none' : 'block';
        contenedorHijos.querySelectorAll('.tag').forEach(t => t.remove());
        estudiantesVinculados.forEach(ced => {
            const div = document.createElement('div');
            div.className = "tag";
            div.innerHTML = `<span>${ced}</span><i class="fa-solid fa-circle-xmark cursor-pointer hover:text-red-500" onclick="eliminarHijo('${ced}')"></i>`;
            contenedorHijos.appendChild(div);
        });
    }

    window.eliminarHijo = (ced) => {
        estudiantesVinculados = estudiantesVinculados.filter(item => item !== ced);
        renderHijos();
    };

    document.getElementById('form-representante').addEventListener('submit', async (e) => {
        e.preventDefault();
        if(estudiantesVinculados.length === 0) return Swal.fire('Faltan datos', 'Debe vincular al menos un alumno.', 'info');

        const btn = document.getElementById('btn-save');
        btn.disabled = true;
        const cedulaRepre = document.getElementById('in_cedula').value.trim();

        // PAYLOAD FORZADO A MAYÚSCULAS
        const payload = {
            cedula: cedulaRepre,
            nombres: document.getElementById('in_nombres').value.toUpperCase().trim(),
            apellidos: document.getElementById('in_apellidos').value.toUpperCase().trim(),
            nombre_completo: `${document.getElementById('in_nombres').value} ${document.getElementById('in_apellidos').value}`.toUpperCase().trim(),
            nacimiento: new Date(document.getElementById('in_nacimiento').value),
            estado_civil: document.getElementById('in_estado_civil').value,
            ocupacion: document.getElementById('in_ocupacion').value.toUpperCase().trim(),
            direccion: document.getElementById('in_direccion').value.toUpperCase().trim(),
            parentesco: document.getElementById('in_parentesco').value,
            telefono: document.getElementById('in_telefono').value.trim(),
            correo: document.getElementById('in_correo').value.toLowerCase().trim(), // Correo siempre minúscula
            estudiantes_ids: estudiantesVinculados,
            activo: true,
            updated_at: serverTimestamp()
        };

        try {
            await setDoc(doc(db, "representantes", cedulaRepre), payload);
            
            Swal.fire({
                title: '<span class="text-indigo-900 font-black uppercase italic">¡Guardado con éxito!</span>',
                text: '¿Qué acción desea realizar ahora?',
                icon: 'success',
                showCancelButton: true,
                showDenyButton: true,
                confirmButtonText: '<i class="fa-solid fa-user-graduate mr-1"></i> Añadir Alumno',
                denyButtonText: '<i class="fa-solid fa-users mr-1"></i> Otro Representante',
                cancelButtonText: 'Ir al Inicio',
                confirmButtonColor: '#6366f1',
                denyButtonColor: '#1e293b',
                cancelButtonColor: '#94a3b8',
                customClass: { popup: 'rounded-[2rem]' }
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = "estudiantes.html";
                } else if (result.isDenied) {
                    location.reload();
                } else {
                    window.location.href = "dashboard.html";
                }
            });

        } catch (error) {
            btn.disabled = false;
            Swal.fire('Error', 'No se pudo guardar la ficha.', 'error');
        }
    });

    document.getElementById('in_cedula').addEventListener('blur', async (e) => {
        const ced = e.target.value.trim();
        if(ced.length === 10) {
            const docSnap = await getDoc(doc(db, "representantes", ced));
            if(docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('in_nombres').value = data.nombres;
                document.getElementById('in_apellidos').value = data.apellidos;
                document.getElementById('in_parentesco').value = data.parentesco;
                document.getElementById('in_telefono').value = data.telefono;
                document.getElementById('in_correo').value = data.correo;
                document.getElementById('in_direccion').value = data.direccion || "";
                document.getElementById('in_estado_civil').value = data.estado_civil || "SOLTERO/A";
                document.getElementById('in_ocupacion').value = data.ocupacion || "";
                if(data.nacimiento) {
                    const fecha = data.nacimiento.toDate ? data.nacimiento.toDate() : new Date(data.nacimiento);
                    document.getElementById('in_nacimiento').value = fecha.toISOString().split('T')[0];
                }
                estudiantesVinculados = data.estudiantes_ids || [];
                renderHijos();
                document.getElementById('status-repre').innerText = "Editando Registro";
                document.getElementById('status-repre').className = "text-[9px] font-black uppercase px-4 py-2 rounded-xl bg-amber-100 text-amber-600 tracking-widest border border-amber-200";
            }
        }
    });
</script>
</body>
</html>
