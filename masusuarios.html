<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Gestión de Usuarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; opacity: 0; transition: opacity 0.5s ease; }
        .glass-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .input-style { background-color: #ffffff; border: 2px solid #e2e8f0; transition: all 0.3s ease; }
        .input-style:focus { border-color: #1d9bf0; outline: none; box-shadow: 0 0 0 4px rgba(29, 155, 240, 0.1); }
        .label-style { font-size: 10px; font-weight: 900; color: #1d9bf0; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; display: block; margin-left: 0.25rem; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
            <div>
                <h1 class="text-3xl font-black text-indigo-950 tracking-tighter italic uppercase">Gestión de Usuarios</h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-1">Khipu Edu 360 • Control de Acceso</p>
            </div>
            <button onclick="window.location.href='dashboard.html'" class="bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-500 w-12 h-12 rounded-2xl transition-all flex items-center justify-center">
                <i class="fa-solid fa-house"></i>
            </button>
        </header>

        <section class="glass-card p-10">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-2xl font-black text-slate-800 uppercase italic underline decoration-sky-500 decoration-4 underline-offset-8">Ficha de Usuario</h2>
                <div id="status-user" class="text-[9px] font-black uppercase px-4 py-2 rounded-xl bg-slate-100 text-slate-400 tracking-widest border border-slate-200">Listo para escanear</div>
            </div>

            <form id="form-usuario" class="space-y-8">
                <div class="bg-slate-50/80 p-8 rounded-[2.5rem] border border-slate-200">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="relative md:col-span-1">
                            <label class="label-style">Número de Cédula</label>
                            <input type="text" id="in_cedula" maxlength="10" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700" placeholder="13XXXXXXXX">
                            <div id="load-icon" class="hidden absolute right-4 top-[3.2rem] text-sky-500"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
                        </div>
                        <div class="md:col-span-2">
                            <label class="label-style">Nombre Completo</label>
                            <input type="text" id="in_nombre" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 uppercase">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
                        <div>
                            <label class="label-style">Nacimiento</label>
                            <input type="date" id="in_nacimiento" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700">
                        </div>
                        <div>
                            <label class="label-style">Teléfono Celular</label>
                            <input type="text" id="in_telefono" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700" placeholder="09XXXXXXXX">
                        </div>
                        <div>
                            <label class="label-style">Título / Especialidad</label>
                            <input type="text" id="in_titulo" class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 uppercase" placeholder="Ej: INGENIERO">
                        </div>
                    </div>
                </div>

                <div class="bg-sky-50/50 p-8 rounded-[2.5rem] border border-sky-100">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="label-style">Correo Electrónico (Login)</label>
                            <input type="email" id="in_correo" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700">
                        </div>
                        <div>
                            <label class="label-style">Contraseña de Acceso</label>
                            <input type="password" id="in_pass" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700" placeholder="Mínimo 6 caracteres">
                        </div>
                        <div>
                            <label class="label-style">Rol en el Sistema</label>
                            <select id="in_rol" required class="w-full p-4 input-style rounded-2xl font-bold text-slate-700 appearance-none">
                                <option value="docente">DOCENTE</option>
                                <option value="admin">ADMINISTRADOR</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="flex flex-wrap justify-end gap-4 pt-6">
                    <button type="button" id="btn-suspender" class="hidden px-8 py-4 font-black uppercase text-[10px] text-red-500 hover:bg-red-50 rounded-2xl transition-all tracking-widest border border-transparent hover:border-red-200">
                        <i class="fa-solid fa-user-slash mr-2"></i> Suspender Acceso
                    </button>
                    <button type="button" onclick="location.reload()" class="px-8 py-4 font-black uppercase text-[10px] text-slate-400 hover:text-indigo-600 transition-all tracking-widest">Descartar</button>
                    <button type="submit" id="btn-save" class="bg-sky-500 hover:bg-black text-white px-12 py-5 rounded-[1.5rem] font-black uppercase text-[10px] tracking-[0.2em] shadow-xl shadow-sky-200 transition-all active:scale-95">
                        Registrar Acceso <i class="fa-solid fa-user-shield ml-2"></i>
                    </button>
                </div>
            </form>
        </section>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, getDocs, collection, query, where, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let usuarioEncontrado = null; // Guardará el objeto completo de Firestore

    // ESCUDO ADMIN
    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "index.html"; }
        else {
            const userSnap = await getDoc(doc(db, "usuario", user.uid));
            if (userSnap.exists() && userSnap.data().rol === "admin") {
                document.body.style.opacity = "1";
            } else {
                Swal.fire('Acceso Denegado', 'Área exclusiva de administración.', 'error').then(() => window.location.href = "dashboard.html");
            }
        }
    });

    // BUSCADOR POR CÉDULA
    document.getElementById('in_cedula').addEventListener('input', async (e) => {
        const ced = e.target.value;
        if (ced.length === 10) {
            document.getElementById('load-icon').classList.remove('hidden');
            const q = query(collection(db, "usuario"), where("cedula", "==", ced));
            const snap = await getDocs(q);

            if (!snap.empty) {
                usuarioEncontrado = snap.docs[0].data();
                usuarioEncontrado.docId = snap.docs[0].id;
                
                document.getElementById('in_nombre').value = usuarioEncontrado.nombre;
                document.getElementById('in_correo').value = usuarioEncontrado.correo;
                document.getElementById('in_titulo').value = usuarioEncontrado.titulo || "";
                document.getElementById('in_rol').value = usuarioEncontrado.rol;
                document.getElementById('in_telefono').value = usuarioEncontrado.telefono || "";
                if(usuarioEncontrado.nacimiento) document.getElementById('in_nacimiento').value = usuarioEncontrado.nacimiento.toDate().toISOString().split('T')[0];
                
                document.getElementById('in_pass').required = false;
                document.getElementById('in_pass').placeholder = "Sin cambios (Clave protegida)";
                
                const status = document.getElementById('status-user');
                const btnSuspender = document.getElementById('btn-suspender');
                
                btnSuspender.classList.remove('hidden');
                if(usuarioEncontrado.estado === 'activo') {
                    status.innerText = "USUARIO ACTIVO - MODO EDICIÓN";
                    status.className = "text-[9px] font-black uppercase px-4 py-2 rounded-xl bg-emerald-100 text-emerald-600 tracking-widest border border-emerald-200";
                    btnSuspender.innerHTML = `<i class="fa-solid fa-user-slash mr-2"></i> Suspender Acceso`;
                    btnSuspender.className = btnSuspender.className.replace('text-emerald-500', 'text-red-500');
                } else {
                    status.innerText = "USUARIO SUSPENDIDO (INACTIVO)";
                    status.className = "text-[9px] font-black uppercase px-4 py-2 rounded-xl bg-red-100 text-red-600 tracking-widest border border-red-200";
                    btnSuspender.innerHTML = `<i class="fa-solid fa-user-check mr-2"></i> Reactivar Usuario`;
                    btnSuspender.className = btnSuspender.className.replace('text-red-500', 'text-emerald-500');
                }
                document.getElementById('btn-save').innerText = "Actualizar Perfil";
            } else {
                usuarioEncontrado = null;
                document.getElementById('in_pass').required = true;
                document.getElementById('btn-suspender').classList.add('hidden');
                document.getElementById('status-user').innerText = "NUEVO REGISTRO";
                document.getElementById('status-user').className = "text-[9px] font-black uppercase px-4 py-2 rounded-xl bg-blue-100 text-blue-600 tracking-widest border border-blue-200";
            }
            document.getElementById('load-icon').classList.add('hidden');
        }
    });

    // GUARDAR O ACTUALIZAR
    document.getElementById('form-usuario').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-save');
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> PROCESANDO...`;

        const email = document.getElementById('in_correo').value.trim();
        const password = document.getElementById('in_pass').value;
        const cedula = document.getElementById('in_cedula').value;

        try {
            let uid_final = usuarioEncontrado ? usuarioEncontrado.uid : null;

            if (!uid_final) {
                // Registro nuevo en Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                uid_final = userCredential.user.uid;
            }

            const payload = {
                uid: uid_final,
                cedula: cedula,
                nombre: document.getElementById('in_nombre').value.trim().toUpperCase(),
                correo: email,
                telefono: document.getElementById('in_telefono').value,
                nacimiento: new Date(document.getElementById('in_nacimiento').value),
                titulo: document.getElementById('in_titulo').value.trim().toUpperCase(),
                rol: document.getElementById('in_rol').value,
                estado: usuarioEncontrado ? usuarioEncontrado.estado : "activo",
                updated_at: serverTimestamp()
            };

            await setDoc(doc(db, "usuario", uid_final), payload, { merge: true });

            Swal.fire({ title: '¡Sincronizado!', text: 'El usuario ha sido procesado correctamente.', icon: 'success' })
            .then(() => location.reload());

        } catch (error) {
            let msg = "No se pudo crear. Si el correo ya existe en Auth, bórrelo en la consola de Firebase.";
            if(error.code === 'auth/email-already-in-use') msg = "Este correo ya está en uso por otro usuario en el autenticador.";
            Swal.fire('Error de Registro', msg, 'error');
            btn.disabled = false;
            btn.innerText = "Registrar Acceso";
        }
    });

    // SUSPENDER O REACTIVAR (BAJA LÓGICA)
    document.getElementById('btn-suspender').onclick = async () => {
        if (!usuarioEncontrado) return;
        
        const nuevoEstado = usuarioEncontrado.estado === 'activo' ? 'inactivo' : 'activo';
        const tituloAccion = nuevoEstado === 'inactivo' ? '¿Suspender Acceso?' : '¿Reactivar Usuario?';
        
        const result = await Swal.fire({
            title: tituloAccion,
            text: nuevoEstado === 'inactivo' ? "El usuario no podrá entrar al sistema hasta que lo reactives." : "El usuario recuperará el acceso inmediatamente.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: nuevoEstado === 'inactivo' ? '#ef4444' : '#10b981',
            confirmButtonText: 'Sí, confirmar'
        });

        if (result.isConfirmed) {
            await updateDoc(doc(db, "usuario", usuarioEncontrado.docId), { estado: nuevoEstado });
            Swal.fire('Estado Actualizado', `Usuario marcado como ${nuevoEstado.toUpperCase()}.`, 'success')
            .then(() => location.reload());
        }
    };
</script>
</body>
</html>
