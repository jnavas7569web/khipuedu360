<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khipu Edu 360 - Portal De Consultas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        .glass-card { background: white; border-radius: 2.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .btn-nav { transition: all 0.3s ease; border: 2px solid transparent; cursor: pointer; }
        .btn-nav:hover { transform: translateY(-3px); border-color: #6366f1; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="text-center mb-10">
        <h1 class="text-2xl font-black text-indigo-900 italic uppercase tracking-tighter">Khipu Edu 360</h1>
        <p class="text-slate-400 text-[9px] font-bold uppercase tracking-[0.4em]">Portal de Consulta Académica</p>
    </div>

    <main class="max-w-4xl mx-auto w-full flex-grow">
        <section id="seccion-busqueda" class="glass-card p-8 md:p-12 text-center mb-8">
            <h2 class="text-xl font-black text-slate-800 mb-6 uppercase italic tracking-tight">Consultar Expediente</h2>
            <div class="max-w-sm mx-auto">
                <input type="text" id="cedula_input" maxlength="10" 
                    class="w-full p-5 rounded-3xl bg-slate-50 border-2 border-slate-200 text-center font-black text-xl outline-none focus:border-indigo-500 transition-all" 
                    placeholder="CÉDULA DEL ALUMNO">
                <button onclick="consultarPortal()" class="mt-6 w-full bg-indigo-600 hover:bg-black text-white font-black py-4 rounded-2xl uppercase text-[11px] tracking-widest transition-all shadow-xl active:scale-95">
                    Ver Información <i class="fa-solid fa-magnifying-glass ml-2"></i>
                </button>
            </div>
        </section>

        <div id="portal-estudiante" class="hidden">
            <div class="glass-card p-6 mb-8 border-l-8 border-indigo-600 flex flex-col md:flex-row justify-between items-center gap-6 text-center md:text-left">
                <div class="flex flex-col md:flex-row items-center gap-5">
                    <div class="w-16 h-16 bg-indigo-600 rounded-3xl flex items-center justify-center text-white text-2xl shadow-lg">
                        <i class="fa-solid fa-user-graduate"></i>
                    </div>
                    <div>
                        <h3 id="res_nombre" class="text-xl font-black text-slate-800 uppercase italic">---</h3>
                        <div class="flex flex-wrap gap-2 mt-1 justify-center md:justify-start">
                            <span id="res_curso" class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-lg font-black text-[10px] border border-indigo-100 uppercase">---</span>
                            <span id="res_asistencia" class="px-3 py-1 rounded-lg font-black text-[10px] uppercase">---</span>
                        </div>
                    </div>
                </div>
                <button onclick="location.reload()" class="bg-slate-100 hover:bg-rose-500 hover:text-white text-slate-500 px-6 py-3 rounded-2xl font-black text-[10px] uppercase transition-all">
                    Nueva Consulta <i class="fa-solid fa-rotate-left ml-2"></i>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <button onclick="cambiarTab('notas')" class="btn-nav glass-card p-6 flex items-center justify-center gap-4">
                    <div class="w-10 h-10 bg-amber-50 rounded-2xl flex items-center justify-center text-amber-500 text-lg"><i class="fa-solid fa-award"></i></div>
                    <p class="font-black text-slate-800 uppercase text-xs">Calificaciones</p>
                </button>
                <button onclick="cambiarTab('tareas')" class="btn-nav glass-card p-6 flex items-center justify-center gap-4">
                    <div class="w-10 h-10 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-500 text-lg"><i class="fa-solid fa-book"></i></div>
                    <p class="font-black text-slate-800 uppercase text-xs">Tareas</p>
                </button>
            </div>

            <div id="tab-notas" class="tab-content active">
                <div class="glass-card overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[9px] font-black uppercase text-slate-400 border-b">
                            <tr>
                                <th class="p-5">Materia</th>
                                <th class="p-5 text-center">T1</th>
                                <th class="p-5 text-center">T2</th>
                                <th class="p-5 text-center">T3</th>
                                <th class="p-5 text-center bg-indigo-50/50 text-indigo-600">Prom</th>
                            </tr>
                        </thead>
                        <tbody id="lista-notas" class="text-[12px] font-bold text-slate-700 divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>

            <div id="tab-tareas" class="tab-content">
                <div id="lista-tareas" class="space-y-4"></div>
            </div>
        </div>

        <div id="placeholder" class="py-20 text-center opacity-10">
            <i class="fa-solid fa-fingerprint text-8xl"></i>
        </div>
    </main>

    <footer class="mt-10 py-10 text-center">
        <p class="text-[9px] font-black text-slate-400 uppercase tracking-[0.3em] mb-3">
            © 2026 Escuela Gran Colombia • Sistema Khipu
        </p>
        <div class="inline-block px-5 py-2 rounded-full bg-indigo-50 border border-indigo-100">
            <p class="text-[10px] font-bold text-indigo-900 tracking-wide">
                Diseño y desarrollo by. Ing. Jury Navas 🤓
            </p>
        </div>
    </footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, collection, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7pl5NiJtX1qlwLVng2Frt9MOeT6x9aNk",
        authDomain: "khipu-edu360.firebaseapp.com",
        projectId: "khipu-edu360",
        storageBucket: "khipu-edu360.firebasestorage.app",
        messagingSenderId: "505046535196",
        appId: "1:505046535196:web:5e260f2839bacdc35263d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const HOY = "2026-04-27"; 

    window.consultarPortal = async () => {
        const ced = document.getElementById('cedula_input').value.trim();
        if(ced.length !== 10) return Swal.fire('Aviso', 'Ingrese los 10 dígitos.', 'warning');

        Swal.fire({ title: 'Sincronizando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        try {
            // 1. ESTUDIANTE
            const eSnap = await getDoc(doc(db, "estudiantes", ced));
            if (!eSnap.exists()) {
                Swal.close();
                return Swal.fire('No encontrado', 'Cédula no registrada.', 'warning');
            }
            const est = eSnap.data();

            // VINCULACIÓN GRADO Y PARALELO
            let nombreGrado = "---";
            let nombreParalelo = "---";
            if(est.grado_id) {
                const gSnap = await getDoc(doc(db, "grados", est.grado_id));
                if(gSnap.exists()) nombreGrado = gSnap.data().nombre;
            }
            if(est.paralelo_id) {
                const pSnap = await getDoc(doc(db, "paralelos", est.paralelo_id));
                if(pSnap.exists()) nombreParalelo = pSnap.data().nombre;
            }

            document.getElementById('res_nombre').innerText = `${est.nombres} ${est.apellidos}`;
            document.getElementById('res_curso').innerText = `${nombreGrado} - ${nombreParalelo}`;

            // 2. ASISTENCIA
            const asisSnap = await getDoc(doc(db, "asistencias", `${ced}_${HOY}`));
            const badge = document.getElementById('res_asistencia');
            if(asisSnap.exists()) {
                const s = asisSnap.data().estado.toUpperCase();
                badge.innerText = `HOY: ${s}`;
                badge.className = `px-3 py-1 rounded-lg font-black text-[10px] uppercase ${s==='PRESENTE'?'bg-emerald-100 text-emerald-600':'bg-rose-100 text-rose-600'}`;
            } else {
                badge.innerText = "SIN REGISTRO";
                badge.className = "px-3 py-1 rounded-lg font-black text-[10px] bg-slate-100 text-slate-400";
            }

            // 3. NOTAS CON VINCULACIÓN DE MATERIA
            const qN = query(collection(db, "notass"), where("estudiante_id", "==", ced));
            const snapN = await getDocs(qN);
            const bodyN = document.getElementById('lista-notas');
            bodyN.innerHTML = "";
            if(snapN.empty) {
                bodyN.innerHTML = '<tr><td colspan="5" class="p-10 text-center text-slate-300 italic">No hay notas publicadas.</td></tr>';
            } else {
                const notasHTML = await Promise.all(snapN.docs.map(async (docN) => {
                    const n = docN.data();
                    let nomMat = n.materia_id;
                    const mSnap = await getDoc(doc(db, "materias", n.materia_id));
                    if(mSnap.exists()) nomMat = mSnap.data().nombre;
                    const p = ((parseFloat(n.nota1||0)+parseFloat(n.nota2||0)+parseFloat(n.nota3||0))/3).toFixed(2);
                    return `<tr><td class="p-5 uppercase font-black text-indigo-950">${nomMat}</td><td class="p-5 text-center">${n.nota1||'0.00'}</td><td class="p-5 text-center">${n.nota2||'0.00'}</td><td class="p-5 text-center">${n.nota3||'0.00'}</td><td class="p-5 text-center bg-indigo-50/50 text-indigo-700 font-black">${p}</td></tr>`;
                }));
                bodyN.innerHTML = notasHTML.join("");
            }

            // 4. TAREAS
            const listaT = document.getElementById('lista-tareas');
            listaT.innerHTML = "";
            try {
                if (est.grado_id && est.paralelo_id) {
                    const qT = query(collection(db, "tareas"), where("grado_id", "==", est.grado_id), where("paralelo_id", "==", est.paralelo_id));
                    const snapT = await getDocs(qT);
                    let vigentes = [];
                    snapT.forEach(dt => { if(dt.data().fecha_entrega >= HOY) vigentes.push(dt.data()); });
                    if(vigentes.length > 0) {
                        const tareasHTML = await Promise.all(vigentes.map(async (t) => {
                            let matT = t.materia_id;
                            const mtSnap = await getDoc(doc(db, "materias", t.materia_id));
                            if(mtSnap.exists()) matT = mtSnap.data().nombre;
                            return `<div class="glass-card p-6 border-l-8 border-emerald-500 flex justify-between items-center gap-4 mb-4">
                                <div><p class="text-[9px] font-black text-indigo-500 uppercase">${matT}</p>
                                <h4 class="font-black text-slate-800 uppercase text-sm">${t.titulo}</h4></div>
                                <div class="bg-rose-50 px-4 py-2 rounded-xl text-rose-600 font-black text-xs">${t.fecha_entrega}</div>
                            </div>`;
                        }));
                        listaT.innerHTML = tareasHTML.join("");
                    } else {
                        listaT.innerHTML = '<div class="p-10 text-center text-slate-300 font-black uppercase text-[10px]">No hay tareas pendientes</div>';
                    }
                }
            } catch (err) {
                listaT.innerHTML = '<div class="p-10 text-center text-amber-500 font-black uppercase text-[10px]">Módulo de tareas en construcción 🛠️</div>';
            }

            document.getElementById('seccion-busqueda').classList.add('hidden');
            document.getElementById('portal-estudiante').classList.remove('hidden');
            document.getElementById('placeholder').classList.add('hidden');
            window.cambiarTab('notas');
            Swal.close();

        } catch (e) {
            console.error(e);
            Swal.fire('Error', 'Falla de conexión. Revisa las reglas de Firebase.', 'error');
        }
    };

    window.cambiarTab = (tab) => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById(`tab-${tab}`).classList.add('active');
    };
</script>
</body>
</html>
